<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI日记分析</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        :root{
            --bg:#F4ECEA;          /*莫兰迪浅冷粉底色（页面背景）*/
            --card:#F9F3F2;        /*卡片浅裸粉白*/
            --text:#5C5050;        /*深灰粉正文文字*/
            --text-secondary:#998888;/*次要淡粉灰文字*/
            --border:#E4D4D2;      /*莫兰迪粉灰边框*/
            --primary:#C9A8A7;     /*主色：低饱和冷粉（按钮、高亮）*/
            --primary-hover:#B99493;/*悬浮加深冷粉*/
            --danger:#C88A8A;      /*删除按钮莫兰迪豆沙红*/
            --success:#A9B8B0;     /*成功低饱和灰绿（莫兰迪搭配）*/
            --shadow:0 1px 4px 0 rgba(150,120,120,0.12)
        }
        .dark{
            --bg:#483E3E;
            --card:#594F4F;
            --text:#EAE0E0;
            --text-secondary:#BBAAAA;
            --border:#726262;
            --primary:#D1B2B1;
            --primary-hover:#C9A8A7;
            --danger:#DD9999;
            --success:#9AB0A6;
            --shadow:0 1px 4px 0 rgba(30,20,20,0.35)
        }
        body{background:var(--bg);color:var(--text);padding:20px;max-width:1000px;margin:0 auto;transition:all 0.3s ease}
        .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
        .top-bar h1{font-size:28px;color:var(--primary);display:flex;align-items:center;gap:8px}
        .top-actions{display:flex;gap:16px;align-items:center}
        .icon-btn{background:transparent;border:none;font-size:22px;cursor:pointer;color:var(--text);padding:8px;border-radius:8px;transition:background 0.2s}
        .icon-btn:hover{background:var(--border)}

        .card{background:var(--card);border-radius:20px;padding:24px;margin-bottom:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
        .card h2{font-size:22px;margin-bottom:20px;color:var(--text)}
        .card h3{font-size:18px;margin:16px 0 12px;color:var(--text)}

        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        @media (max-width:768px){.grid-2{grid-template-columns:1fr}}

        .input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px;outline:none;transition:border-color 0.2s}
        .input:focus{border-color:var(--primary)}
        .textarea{min-height:120px;resize:vertical;line-height:1.6}
        .select{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px;cursor:pointer}

        .btn{padding:12px 24px;border:none;border-radius:10px;font-size:16px;font-weight:500;cursor:pointer;transition:all 0.2s}
        .btn-primary{background:var(--primary);color:white}
        .btn-primary:hover{background:var(--primary-hover)}
        .btn-danger{background:var(--danger);color:white}
        .btn-success{background:var(--success);color:white}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
        .btn-outline:hover{background:var(--border)}
        .btn-sm{padding:8px 16px;font-size:14px}

        .upload-box{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;transition:border-color 0.2s}
        .upload-box.active{border-color:var(--primary)}
        .upload-icon{font-size:48px;color:var(--text-secondary);margin-bottom:12px}
        .upload-txt{font-size:18px;color:var(--text);margin-bottom:8px}
        .upload-tip{color:var(--text-secondary);margin-bottom:20px}
        input[type="file"]{display:none}

        .tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:8px}
        .tab{padding:8px 16px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-radius:8px;font-size:16px}
        .tab.active{background:var(--primary);color:white}

        .diary-item{border-bottom:1px solid var(--border);padding:16px 0}
        .diary-item:last-child{border-bottom:none}
        .diary-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        .diary-date{font-weight:500;color:var(--text)}
        .diary-source{font-size:14px;color:var(--text-secondary)}
        .diary-preview{color:var(--text-secondary);line-height:1.5;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .diary-actions{display:flex;gap:8px;margin-top:12px}

        .analysis-result{background:var(--bg);border-radius:12px;padding:20px;margin-top:20px;line-height:1.8}
        .analysis-result h4{margin-bottom:12px;color:var(--primary)}
        .analysis-meta{font-size:14px;color:var(--text-secondary);margin-bottom:16px}

        .empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary)}
        .loading{text-align:center;padding:40px;color:var(--text-secondary)}
        .loading::after{content:"";display:inline-block;width:20px;height:20px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
        .modal-content{background:var(--card);border-radius:20px;padding:24px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text)}

        .badge{display:inline-block;padding:4px 8px;border-radius:4px;font-size:12px;background:var(--primary);color:white;margin-left:8px}

        /* 新增：分析看板样式 */
        .dashboard-card{margin-bottom:30px}
        .dashboard-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .dashboard-actions{display:flex;gap:8px}
        .latest-result{max-height:300px;overflow-y:auto;padding:16px;background:var(--bg);border-radius:12px}
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>📘 AI日记分析</h1>
        <div class="top-actions">
            <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
            <button class="icon-btn" id="configBtn" title="AI配置">⚙️</button>
            <button class="icon-btn" id="exportBtn" title="导出所有数据">📤</button>
        </div>
    </div>

    <!-- 录入区域 -->
    <div class="card">
        <div class="tabs">
            <button class="tab active" data-tab="paste">直接粘贴</button>
            <button class="tab" data-tab="upload">批量导入文件</button>
        </div>

        <div id="pasteTab" class="tab-content">
            <textarea class="input textarea" id="diaryInput" placeholder="在这里粘贴你的日记内容，支持单篇或多篇（每篇开头带日期格式如：2024-05-20 周一 晴）"></textarea>
            <div style="display:flex;gap:12px;margin-top:16px">
                <button class="btn btn-primary" onclick="addDiary()">添加单篇日记</button>
                <button class="btn btn-outline" onclick="parseMultiDiary()">智能解析多篇</button>
            </div>
        </div>

        <div id="uploadTab" class="tab-content" style="display:none">
            <div class="upload-box" id="dropBox">
                <div class="upload-icon">⬆️</div>
                <div class="upload-txt">拖拽文件到这里，或者点击选择文件</div>
                <div class="upload-tip">支持格式: TXT、Markdown、JSON | 自动解析带日期的多篇日记</div>
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">选择文件</button>
                <input id="fileInput" type="file" accept=".txt,.md,.json" multiple>
            </div>
            <div style="margin-top:16px">
                <button class="btn btn-outline" onclick="clearAllDiaries()">清空所有日记</button>
            </div>
        </div>
    </div>

    <!-- 主标签页：分析看板 / 日记列表 -->
    <div class="tabs">
        <button class="tab active" data-main-tab="dashboard">📊 分析看板</button>
        <button class="tab" data-main-tab="diaryList">📝 日记列表</button>
    </div>

    <!-- 分析看板（新增核心功能） -->
    <div id="dashboardTab" class="main-tab-content">
        <!-- 今日分析 -->
        <div class="card dashboard-card">
            <div class="dashboard-header">
                <h3>☀️ 今日分析</h3>
                <div class="dashboard-actions">
                    <button class="btn btn-primary btn-sm" onclick="quickAnalyze('today')">重新分析</button>
                    <button class="btn btn-outline btn-sm" onclick="viewRangeHistory('today')">查看历史</button>
                </div>
            </div>
            <div id="todayResult" class="latest-result">
                <div class="empty-state">还没有今日分析，点击"重新分析"开始</div>
            </div>
        </div>

        <!-- 近7天分析 -->
        <div class="card dashboard-card">
            <div class="dashboard-header">
                <h3>📅 近7天分析</h3>
                <div class="dashboard-actions">
                    <button class="btn btn-primary btn-sm" onclick="quickAnalyze('week')">重新分析</button>
                    <button class="btn btn-outline btn-sm" onclick="viewRangeHistory('week')">查看历史</button>
                </div>
            </div>
            <div id="weekResult" class="latest-result">
                <div class="empty-state">还没有近7天分析，点击"重新分析"开始</div>
            </div>
        </div>

        <!-- 近30天分析 -->
        <div class="card dashboard-card">
            <div class="dashboard-header">
                <h3>📆 近30天分析</h3>
                <div class="dashboard-actions">
                    <button class="btn btn-primary btn-sm" onclick="quickAnalyze('month')">重新分析</button>
                    <button class="btn btn-outline btn-sm" onclick="viewRangeHistory('month')">查看历史</button>
                </div>
            </div>
            <div id="monthResult" class="latest-result">
                <div class="empty-state">还没有近30天分析，点击"重新分析"开始</div>
            </div>
        </div>

        <!-- 年度分析 -->
        <div class="card dashboard-card">
            <div class="dashboard-header">
                <h3>📈 年度分析（全部）</h3>
                <div class="dashboard-actions">
                    <button class="btn btn-primary btn-sm" onclick="quickAnalyze('all')">重新分析</button>
                    <button class="btn btn-outline btn-sm" onclick="viewRangeHistory('all')">查看历史</button>
                </div>
            </div>
            <div id="allResult" class="latest-result">
                <div class="empty-state">还没有年度分析，点击"重新分析"开始</div>
            </div>
        </div>
    </div>

    <!-- 日记列表 -->
    <div id="diaryListTab" class="main-tab-content" style="display:none">
        <div class="card">
            <h2>日记列表</h2>
            <input type="text" class="input" id="searchInput" placeholder="搜索日记内容或日期..." style="margin-bottom:20px">
            <div id="diaryList">
                <div class="empty-state">还没有日记，开始写第一篇吧</div>
            </div>
        </div>
    </div>

    <!-- 原手动分析区域（保留，用于单篇和自定义视角） -->
    <div class="card">
        <h2>自定义分析 <span class="badge">手动触发</span></h2>
        <div class="grid-2">
            <div>
                <label>分析时间范围</label>
                <select class="select" id="timeRange">
                    <option value="single">当前选中日记</option>
                    <option value="today">今日日记</option>
                    <option value="week">近7天日记</option>
                    <option value="month">近30天日记</option>
                    <option value="all">全部日记</option>
                </select>
            </div>
            <div>
                <label>分析视角（可多选，支持全选）</label>
                <div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" id="selectAll" onchange="toggleSelectAll()"> 全选
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="default"> 默认洞察
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="value"> 价值澄清
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="reverse"> 逆向思考
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="second"> 二阶思考
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="cbt"> CBT疗法
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="mbti"> MBTI分析
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="custom"> 自定义视角
                    </label>
                </div>
            </div>
        </div>
        <div id="customViewInput" style="margin-top:12px;display:none">
            <input type="text" class="input" id="customView" placeholder="输入你想要的额外分析视角，例如：金钱消费分析、梦境分析">
        </div>
        <div style="margin-top:20px">
            <button class="btn btn-primary" onclick="startAnalysis()">开始AI分析</button>
        </div>
        <div id="analysisResult" style="display:none"></div>
    </div>

    <!-- AI配置模态框 -->
    <div id="configModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <h2>AI接口配置</h2>
                <button class="modal-close" onclick="closeModal('configModal')">×</button>
            </div>
            
            <h3>基础配置</h3>
            <div class="grid-2" style="margin-bottom:16px">
                <div>
                    <label>API 密钥</label>
                    <input type="password" class="input" id="apiKey" placeholder="输入你的API Key">
                </div>
                <div>
                    <label>API 节点地址</label>
                    <input type="text" class="input" id="apiBase" placeholder="https://api.openai.com/v1" value="https://api.openai.com/v1">
                </div>
            </div>
            <div class="grid-2" style="margin-bottom:16px">
                <div>
                    <label>模型名称</label>
                    <select class="select" id="modelName">
                        <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
                        <option value="gpt-4">gpt-4</option>
                        <option value="gpt-4-turbo">gpt-4-turbo</option>
                        <option value="gpt-4o">gpt-4o</option>
                        <option value="claude-3-haiku">claude-3-haiku</option>
                        <option value="claude-3-sonnet">claude-3-sonnet</option>
                        <option value="claude-3-opus">claude-3-opus</option>
                        <option value="gemini-pro">gemini-pro</option>
                        <option value="gemini-1.5-pro">gemini-1.5-pro</option>
                        <option value="qwen-turbo">通义千问turbo</option>
                        <option value="glm-4">智谱GLM4</option>
                        <option value="custom">自定义其他模型(下方填写)</option>
                    </select>
                    <input type="text" class="input" id="customModel" placeholder="选择自定义时在这里填模型名" style="margin-top:8px;display:none;">
                </div>
                <div>
                    <label>温度值 (0-2)</label>
                    <input type="number" class="input" id="temperature" placeholder="0.7" value="0.7" min="0" max="2" step="0.1">
                </div>
            </div>
            <div style="margin-bottom:16px">
                <label>最大生成长度 (tokens)</label>
                <input type="number" class="input" id="maxTokens" placeholder="2000" value="2000" min="100" max="10000">
            </div>

            <h3>提示词配置（可修改）</h3>
            <div style="margin-bottom:16px">
                <label>日记分析提示词</label>
                <textarea class="input textarea" id="analysisPrompt" style="min-height:200px">你是一位专业的日记分析师，请根据用户提供的日记内容，从{视角}角度进行深入、客观、温暖的分析。

要求：
1. 分析要具体，结合日记中的具体内容，不要空泛
2. 语言要温暖有同理心，避免评判性语言
3. 结构清晰，分点列出，使用小标题
4. 最后给出1-2条建设性的建议
5. 字数控制在{字数}左右

现在开始分析以下日记内容：
{日记内容}</textarea>
            </div>
            <div style="margin-bottom:24px">
                <label>批量日记解析提示词</label>
                <textarea class="input textarea" id="parsePrompt" style="min-height:150px">请将以下文本解析为多篇独立的日记，每篇日记包含日期和内容。

要求：
1. 识别每篇日记的开头日期，支持格式：YYYY-MM-DD、YYYY/MM/DD、MM-DD、X月X日
2. 如果没有明确日期，使用"未知日期"
3. 保留日记的原始内容，不要修改
4. 输出严格按照JSON数组格式，每个元素包含date和content两个字段
5. 不要添加任何额外的解释或说明

需要解析的文本：
{文本内容}</textarea>
            </div>

            <div style="display:flex;gap:12px;justify-content:flex-end">
                <button class="btn btn-outline" onclick="resetPrompts()">恢复默认提示词</button>
                <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
            </div>
        </div>
    </div>

    <!-- 历史分析模态框 -->
    <div id="historyModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="historyModalTitle">历史分析记录</h2>
                <button class="modal-close" onclick="closeModal('historyModal')">×</button>
            </div>
            <div id="historyList"></div>
        </div>
    </div>

<script>
// 全局变量
let diaries = JSON.parse(localStorage.getItem('diaries') || '[]');
let analysisHistory = JSON.parse(localStorage.getItem('analysisHistory') || '[]');
let selectedDiaryId = null;
let config = JSON.parse(localStorage.getItem('aiConfig') || JSON.stringify({
    apiKey: '',
    apiBase: 'https://api.openai.com/v1',
    modelName: 'gpt-3.5-turbo',
    temperature: 0.7,
    maxTokens: 2000,
    analysisPrompt: `你是一位专业的日记分析师，请根据用户提供的日记内容，从{视角}角度进行深入、客观、温暖的分析。

要求：
1. 分析要具体，结合日记中的具体内容，不要空泛
2. 语言要温暖有同理心，避免评判性语言
3. 结构清晰，分点列出，使用小标题
4. 最后给出1-2条建设性的建议
5. 字数控制在{字数}左右

现在开始分析以下日记内容：
{日记内容}`,
    parsePrompt: `请将以下文本解析为多篇独立的日记，每篇日记包含日期和内容。

要求：
1. 识别每篇日记的开头日期，支持格式：YYYY-MM-DD、YYYY/MM/DD、MM-DD、X月X日
2. 如果没有明确日期，使用"未知日期"
3. 保留日记的原始内容，不要修改
4. 输出严格按照JSON数组格式，每个元素包含date和content两个字段
5. 不要添加任何额外的解释或说明

需要解析的文本：
{文本内容}`
}));

// 初始化
document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    initTabs();
    initMainTabs();
    initFileUpload();
    renderDiaryList();
    renderDashboard();
    loadConfigToForm();
    
    // 监听自定义勾选框切换输入框
    const customCb = document.querySelector('input[value="custom"]');
    if(customCb){
        customCb.addEventListener('change',(e)=>{
            document.getElementById('customViewInput').style.display = e.target.checked ? 'block':'none'
        })
    }
});

// 主标签页切换（分析看板/日记列表）
function initMainTabs() {
    document.querySelectorAll('[data-main-tab]').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('[data-main-tab]').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.main-tab-content').forEach(c => c.style.display = 'none');
            tab.classList.add('active');
            document.getElementById(tab.dataset.mainTab + 'Tab').style.display = 'block';
        });
    });
}

// 主题切换
function initTheme() {
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('themeBtn').textContent = '☀️';
    }
    document.getElementById('themeBtn').addEventListener('click', () => {
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
    });
}

// 标签页切换
function initTabs() {
    document.querySelectorAll('.tab:not([data-main-tab])').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab:not([data-main-tab])').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content:not(.main-tab-content)').forEach(c => c.style.display = 'none');
            tab.classList.add('active');
            document.getElementById(tab.dataset.tab + 'Tab').style.display = 'block';

}

// 文件拖拽上传
function initFileUpload() {
    const dropBox = document.getElementById('dropBox');
    const fileInput = document.getElementById('fileInput');

    fileInput.onchange = (e)=>readFiles(e.target.files);

    dropBox.ondragover = e=>{e.preventDefault();dropBox.classList.add('active')};
    dropBox.ondragleave = ()=>dropBox.classList.remove('active');
    dropBox.ondrop = e=>{
        e.preventDefault();
        dropBox.classList.remove('active');
        readFiles(e.dataTransfer.files);
    }
}
function readFiles(files) {
    Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = async (e) => {
            const content = e.target.result;
            if (file.name.endsWith('.json')) {
                try {
                    const data = JSON.parse(content);
                    if (Array.isArray(data)) {
                        data.forEach(item => addDiaryItem(item.date||new Date().toLocaleDateString(),item.content,'文件导入-'+file.name))
                    }
                } catch (err) {
                    await parseAndAddMultiDiary(content,'文件导入-'+file.name)
                }
            } else {
                await parseAndAddMultiDiary(content,'文件导入-'+file.name)
            }
        };
        reader.readAsText(file);
    });
}

// 添加单篇
function addDiary() {
    const content = document.getElementById('diaryInput').value.trim();
    if (!content) { alert('日记内容不能为空！'); return; }
    addDiaryItem(new Date().toLocaleDateString(), content, '手动输入');
    document.getElementById('diaryInput').value = '';
}

// 批量解析按钮
async function parseMultiDiary() {
    const content = document.getElementById('diaryInput').value.trim();
    if (!content) { alert('请先粘贴日记！'); return; }
    await parseAndAddMultiDiary(content, '智能解析');
    document.getElementById('diaryInput').value = '';
}

// 解析分发：无key=本地正则；有key=AI解析
async function parseAndAddMultiDiary(content, source) {
    if (!config.apiKey) {
        simpleParseMultiDiary(content, source);
        return;
    }
    try {
        const prompt = config.parsePrompt.replace('{文本内容}', content);
        const res = await callAI(prompt);
        const arr = JSON.parse(res);
        arr.forEach(i=>addDiaryItem(i.date,i.content,source));
        alert(`AI解析成功，共${arr.length}篇`);
    } catch (err) {
        console.log(err);
        simpleParseMultiDiary(content,source);
    }
}

// 本地简易正则拆分（不用AI）
function simpleParseMultiDiary(content, source) {
    const reg = /(?:^|\n)(\d{4}[-/]\d{1,2}[-/]\d{1,2}|\d{1,2}[-/]\d{1,2}|\d{1,2}月\d{1,2}日)/g;
    const arr = content.split(reg);
    let count =0;
    if(arr.length>1){
        for(let i=1;i<arr.length;i+=2){
            let d = arr[i];
            let txt = arr[i+1]?.trim()||'';
            if(txt){addDiaryItem(d,txt,source);count++}
        }
        alert(`本地解析完成，${count}篇`);
    }else{
        addDiaryItem(new Date().toLocaleDateString(),content,source);
        alert('未识别多日期，作为单篇保存');
    }
}

function addDiaryItem(date,content,source){
    const obj = {
        id:Date.now()+Math.random(),
        date:date,
        content:content.trim(),
        source:source,
        createdAt:new Date().toISOString()
    }
    diaries.unshift(obj);
    saveDiaries();renderDiaryList();
}
function saveDiaries(){localStorage.setItem('diaries',JSON.stringify(diaries))}

// 看板一键快速分析
async function quickAnalyze(range) {
    if (!config.apiKey) {
        alert('请先右上角⚙配置AI密钥');openModal('configModal');return;
    }

    // 默认选中所有预设视角
    const defaultViews = ['default', 'value', 'reverse', 'second', 'cbt', 'mbti'];
    const viewMap = {
        default:"默认洞察",
        value:"价值澄清",
        reverse:"逆向思考",
        second:"二阶思考",
        cbt:"CBT疗法",
        mbti:"MBTI分析"
    };
    const viewNames = defaultViews.map(k => viewMap[k]).join('、');

    // 筛选日记
    let target=[];
    const now=new Date();
    switch(range){
        case 'today':
            let td=now.toLocaleDateString();
            target=diaries.filter(d=>d.date===td);break;
        case 'week':
            let wk=new Date(now.getTime()-7*86400*1000);
            target=diaries.filter(d=>new Date(d.date)>=wk);break;
        case 'month':
            let m=new Date(now.getTime()-30*86400*1000);
            target=diaries.filter(d=>new Date(d.date)>=m);break;
        case 'all':target=[...diaries];break;
    }
    if(!target.length){alert('所选范围无日记');return;}

    let diaryTxt = target.map(d=>`【${d.date}】\n${d.content}`).join('\n\n');
    const el = document.getElementById(range + 'Result');
    el.innerHTML = '<div class="loading">AI分析请求中...</div>';

    try{
        let prompt = config.analysisPrompt.replace('{视角}', viewNames).replace('{字数}', config.maxTokens * 0.75).replace('{日记内容}', diaryTxt);
        let aiRes = await callAI(prompt);
        
        // 保存历史记录
        const hisItem = {
            id:Date.now(),
            view: viewNames,
            timeRange: range,
            diaryCount: target.length,
            result: aiRes,
            createdAt: new Date().toLocaleString()
        }
        analysisHistory.unshift(hisItem);
        localStorage.setItem('analysisHistory', JSON.stringify(analysisHistory));

        // 更新看板
        renderDashboard();
        alert(`${getRangeName(range)}分析完成！`);
    }catch(e){
        el.innerHTML = `<div style="color:var(--danger);padding:20px;text-align:center">失败：${e.message}</div>`;
    }
}

// 【自定义分析函数】
async function startAnalysis() {
    if (!config.apiKey) {
        alert('请先右上角⚙配置AI密钥');openModal('configModal');return;
    }
    const range = document.getElementById('timeRange').value;
    const checkedArr = Array.from(document.querySelectorAll('input[name="view"]:checked')).map(x=>x.value);
    if(!checkedArr.length){alert('至少勾选一个分析视角');return;}

    const viewMap = {
        default:"默认洞察",
        value:"价值澄清",
        reverse:"逆向思考",
        second:"二阶思考",
        cbt:"CBT疗法",
        mbti:"MBTI分析",
        custom:document.getElementById('customView').value.trim()
    }
    let viewNames = checkedArr.map(k=>viewMap[k]);
    if(checkedArr.includes('custom')&&!viewMap.custom){alert('勾选自定义后请填写内容');return;}

    // 筛选日记
    let target=[];
    const now=new Date();
    switch(range){
        case 'single':
            if(!selectedDiaryId){alert('先选中一篇日记');return;}
            target=diaries.filter(d=>d.id===selectedDiaryId);break;
        case 'today':
            let td=now.toLocaleDateString();
            target=diaries.filter(d=>d.date===td);break;
        case 'week':
            let wk=new Date(now.getTime()-7*86400*1000);
            target=diaries.filter(d=>new Date(d.date)>=wk);break;
        case 'month':
            let m=new Date(now.getTime()-30*86400*1000);
            target=diaries.filter(d=>new Date(d.date)>=m);break;
        case 'all':target=[...diaries];break;
    }
    if(!target.length){alert('所选范围无日记');return;}

    let diaryTxt = target.map(d=>`【${d.date}】\n${d.content}`).join('\n\n');
    const resWrap = document.getElementById('analysisResult');
    resWrap.style.display='block';resWrap.innerHTML='<div class="loading">AI分析请求中</div>';

    try{
        const allViewText = viewNames.join('、');
        let prompt = config.analysisPrompt.replace('{视角}',allViewText).replace('{字数}',config.maxTokens*0.75).replace('{日记内容}',diaryTxt);
        let aiRes = await callAI(prompt);
        
        // 保存历史记录
        const hisItem = {
            id:Date.now(),
            view:allViewText,
            timeRange:range,
            diaryCount:target.length,
            result:aiRes,
            createdAt:new Date().toLocaleString()
        }
        analysisHistory.unshift(hisItem);
        localStorage.setItem('analysisHistory',JSON.stringify(analysisHistory));

        // 如果是时间范围分析，同步更新看板
        if(range !== 'single'){
            renderDashboard();
        }

        resWrap.innerHTML = `
        <div class="analysis-result">
            <h4>📊${allViewText} 分析结果</h4>
            <div class="analysis-meta">范围:${getRangeName(range)}｜${target.length}篇｜${hisItem.createdAt}</div>
            <div>${marked.parse(aiRes)}</div>
            <div style="margin-top:20px;display:flex;gap:12px">
                <button class="btn btn-outline" onclick="copyResult()">复制结果</button>
                <button class="btn btn-outline" onclick="exportResult()">导出md</button>
            </div>
        </div>`
    }catch(e){
        resWrap.innerHTML=`<div style="color:var(--danger);padding:20px;text-align:center">失败：${e.message}</div>`
    }
}
function getRangeName(s){
    const map={single:'单篇日记',today:'今日',week:'近7天',month:'近30天',all:'年度（全部）'}
    return map[s]
}

// AI请求接口
async function callAI(prompt){
    const res = await fetch(`${config.apiBase}/chat/completions`,{
        method:'POST',
        headers:{
            'Content-Type':'application/json',
            'Authorization':`Bearer ${config.apiKey}`
        },
        body:JSON.stringify({
            model:config.modelName,
            messages:[{role:'user',content:prompt}],
            temperature:Number(config.temperature),
            max_tokens:Number(config.maxTokens)
        })
    })
    if(!res.ok){
        let err=await res.json();
        throw new Error(err.error?.message||'接口异常');
    }
    let json=await res.json();
    return json.choices[0].message.content;
}

// 复制/导出
function copyResult(){
    let text = document.querySelector('.analysis-result>div:nth-child(3)').innerText;
    navigator.clipboard.writeText(text).then(()=>alert('已复制'));
}
function exportResult(){
    let text = document.querySelector('.analysis-result>div:nth-child(3)').innerText;
    const blob = new Blob([text],{type:'text/markdown'});
    let a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`日记分析_${new Date().toLocaleDateString()}.md`;
    a.click();URL.revokeObjectURL(a.href);
}

// 历史记录详情
function viewHistoryDetail(id){
    let item = analysisHistory.find(x=>x.id===id);
    const resWrap = document.getElementById('analysisResult');
    resWrap.style.display='block';
    resWrap.innerHTML=`
    <div class="analysis-result">
        <h4>📊${item.view}（历史记录）</h4>
        <div class="analysis-meta">范围：${getRangeName(item.timeRange)}｜${item.diaryCount}篇｜${item.createdAt}</div>

        <div style="margin-top:20px;display:flex;gap:12px">

            <button class="btn btn-outline" onclick="exportResult()">导出md</button>
        </div>
    </div>`
    closeModal('historyModal');
    // 切换到自定义分析标签页显示结果
    document.querySelector('[data-main-tab="dashboard"]').click();
}
function deleteHistory(id){
    if(!confirm('删除本条记录？'))return;
    analysisHistory=analysisHistory.filter(x=>x.id!==id);
    localStorage.setItem('analysisHistory',JSON.stringify(analysisHistory));
    // 刷新当前打开的历史模态框
    const title = document.getElementById('historyModalTitle').textContent;
    if(title.includes('今日')) viewRangeHistory('today');
    else if(title.includes('近7天')) viewRangeHistory('week');
    else if(title.includes('近30天')) viewRangeHistory('month');
    else if(title.includes('年度')) viewRangeHistory('all');
    else {
        closeModal('historyModal');
        renderDashboard();
    }
}

// 配置读写
function loadConfigToForm(){
    document.getElementById('apiKey').value=config.apiKey;
    document.getElementById('apiBase').value=config.apiBase;
    document.getElementById('temperature').value=config.temperature;
    document.getElementById('maxTokens').value=config.maxTokens;
    document.getElementById('analysisPrompt').value=config.analysisPrompt;
    document.getElementById('parsePrompt').value=config.parsePrompt;

    // 模型下拉选择逻辑
    const modelSel = document.getElementById('modelName');
    const customModelInp = document.getElementById('customModel');
    
    // 先尝试匹配预设模型
    let found = false;
    for(let i=0;i<modelSel.options.length;i++){
        if(modelSel.options[i].value === config.modelName){
            modelSel.selectedIndex = i;
            customModelInp.style.display = 'none';
            found = true;
            break;
        }
    }
    // 没找到就是自定义模型
    if(!found){
        modelSel.value = 'custom';
        customModelInp.style.display = 'block';
        customModelInp.value = config.modelName;
    }

    // 下拉切换监听
    modelSel.onchange = function(){
        if(this.value === 'custom'){
            customModelInp.style.display = 'block';
        }else{
            customModelInp.style.display = 'none';
        }
    }
}
function saveConfig(){
    config={
        apiKey:document.getElementById('apiKey').value.trim(),
        apiBase:document.getElementById('apiBase').value.trim(),
        modelName: document.getElementById('modelName').value==='custom' ? document.getElementById('customModel').value.trim() : document.getElementById('modelName').value.trim(),
        temperature:document.getElementById('temperature').value,
        maxTokens:document.getElementById('maxTokens').value,
        analysisPrompt:document.getElementById('analysisPrompt').value,
        parsePrompt:document.getElementById('parsePrompt').value
    }
    localStorage.setItem('aiConfig',JSON.stringify(config));
    alert('配置保存成功');closeModal('configModal');
}
