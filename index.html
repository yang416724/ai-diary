<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI日记分析</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        :root{
            --bg:#f8fafc;
            --card:#ffffff;
            --text:#1e293b;
            --text-secondary:#64748b;
            --border:#e2e8f0;
            --primary:#3b82f6;
            --primary-hover:#2563eb;
            --danger:#ef4444;
            --success:#10b981;
            --shadow:0 1px 3px 0 rgba(0,0,0,0.1)
        }
        .dark{
            --bg:#0f172a;
            --card:#1e293b;
            --text:#f1f5f9;
            --text-secondary:#94a3b8;
            --border:#334155;
            --primary:#60a5fa;
            --primary-hover:#3b82f6;
            --danger:#f87171;
            --success:#34d399;
            --shadow:0 1px 3px 0 rgba(0,0,0,0.3)
        }
        body{background:var(--bg);color:var(--text);padding:20px;max-width:1000px;margin:0 auto;transition:all 0.3s ease}
        .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
        .top-bar h1{font-size:28px;color:var(--primary);display:flex;align-items:center;gap:8px}
        .top-actions{display:flex;gap:16px;align-items:center}
        .icon-btn{background:transparent;border:none;font-size:22px;cursor:pointer;color:var(--text);padding:8px;border-radius:8px;transition:background 0.2s}
        .icon-btn:hover{background:var(--border)}

        .card{background:var(--card);border-radius:16px;padding:24px;margin-bottom:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
        .card h2{font-size:22px;margin-bottom:20px;color:var(--text)}
        .card h3{font-size:18px;margin:16px 0 12px;color:var(--text)}

        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        @media (max-width:768px){.grid-2{grid-template-columns:1fr}}

        .input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:16px;outline:none;transition:border-color 0.2s}
        .input:focus{border-color:var(--primary)}
        .textarea{min-height:120px;resize:vertical;line-height:1.6}
        .select{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:16px;cursor:pointer}

        .btn{padding:12px 24px;border:none;border-radius:8px;font-size:16px;font-weight:500;cursor:pointer;transition:all 0.2s}
        .btn-primary{background:var(--primary);color:white}
        .btn-primary:hover{background:var(--primary-hover)}
        .btn-danger{background:var(--danger);color:white}
        .btn-success{background:var(--success);color:white}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
        .btn-outline:hover{background:var(--border)}

        .upload-box{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;transition:border-color 0.2s}
        .upload-box.active{border-color:var(--primary)}
        .upload-icon{font-size:48px;color:var(--text-secondary);margin-bottom:12px}
        .upload-txt{font-size:18px;color:var(--text);margin-bottom:8px}
        .upload-tip{color:var(--text-secondary);margin-bottom:20px}
        input[type="file"]{display:none}

        .tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:8px}
        .tab{padding:8px 16px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-radius:8px;font-size:16px}
        .tab.active{background:var(--primary);color:white}

        .diary-item{border-bottom:1px solid var(--border);padding:16px 0}
        .diary-item:last-child{border-bottom:none}
        .diary-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        .diary-date{font-weight:500;color:var(--text)}
        .diary-source{font-size:14px;color:var(--text-secondary)}
        .diary-preview{color:var(--text-secondary);line-height:1.5;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .diary-actions{display:flex;gap:8px;margin-top:12px}

        .analysis-result{background:var(--bg);border-radius:12px;padding:20px;margin-top:20px;line-height:1.8}
        .analysis-result h4{margin-bottom:12px;color:var(--primary)}
        .analysis-meta{font-size:14px;color:var(--text-secondary);margin-bottom:16px}

        .empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary)}
        .loading{text-align:center;padding:40px;color:var(--text-secondary)}
        .loading::after{content:"";display:inline-block;width:20px;height:20px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
        .modal-content{background:var(--card);border-radius:16px;padding:24px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text)}

        .badge{display:inline-block;padding:4px 8px;border-radius:4px;font-size:12px;background:var(--primary);color:white;margin-left:8px}
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>📘 AI日记分析</h1>
        <div class="top-actions">
            <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
            <button class="icon-btn" id="configBtn" title="AI配置">⚙️</button>
            <button class="icon-btn" id="exportBtn" title="导出所有数据">📤</button>
        </div>
    </div>

    <!-- 录入区域 -->
    <div class="card">
        <div class="tabs">
            <button class="tab active" data-tab="paste">直接粘贴</button>
            <button class="tab" data-tab="upload">批量导入文件</button>
        </div>

        <div id="pasteTab" class="tab-content">
            <textarea class="input textarea" id="diaryInput" placeholder="在这里粘贴你的日记内容，支持单篇或多篇（每篇开头带日期格式如：2024-05-20 周一 晴）"></textarea>
            <div style="display:flex;gap:12px;margin-top:16px">
                <button class="btn btn-primary" onclick="addDiary()">添加单篇日记</button>
                <button class="btn btn-outline" onclick="parseMultiDiary()">智能解析多篇</button>
            </div>
        </div>

        <div id="uploadTab" class="tab-content" style="display:none">
            <div class="upload-box" id="dropBox">
                <div class="upload-icon">⬆️</div>
                <div class="upload-txt">拖拽文件到这里，或者点击选择文件</div>
                <div class="upload-tip">支持格式: TXT、Markdown、JSON | 自动解析带日期的多篇日记</div>
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">选择文件</button>
                <input id="fileInput" type="file" accept=".txt,.md,.json" multiple>
            </div>
            <div style="margin-top:16px">
                <button class="btn btn-outline" onclick="clearAllDiaries()">清空所有日记</button>
            </div>
        </div>
    </div>

    <!-- 分析区域 -->
    <div class="card">
        <h2>AI分析 <span class="badge">手动触发</span></h2>
        <div class="grid-2">
            <div>
                <label>分析时间范围</label>
                <select class="select" id="timeRange">
                    <option value="single">当前选中日记</option>
                    <option value="today">今日日记</option>
                    <option value="week">近7天日记</option>
                    <option value="month">近30天日记</option>
                    <option value="all">全部日记</option>
                </select>
            </div>
             <!-- 分析区域 -->
    <div class="card">
        <h2>AI分析 <span class="badge">手动触发</span></h2>
        <div class="grid-2">
            <div>
                <label>分析时间范围</label>
                <select class="select" id="timeRange">
                    <option value="single">当前选中日记</option>
                    <option value="today">今日日记</option>
                    <option value="week">近7天日记</option>
                    <option value="month">近30天日记</option>
                    <option value="all">全部日记</option>
                </select>
            </div>
            <div>
                <label>分析视角（可多选，支持全选）</label>
                <div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" id="selectAll" onchange="toggleSelectAll()"> 全选
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="default"> 默认洞察
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="value"> 价值澄清
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="reverse"> 逆向思考
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="second"> 二阶思考
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="cbt"> CBT疗法
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="mbti"> MBTI分析
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="custom"> 自定义视角
                    </label>
                </div>
            </div>
        </div>
        <div id="customViewInput" style="margin-top:12px;display:none">
            <input type="text" class="input" id="customView" placeholder="输入你想要的额外分析视角，例如：金钱消费分析、梦境分析">
        </div>
        <div style="margin-top:20px">
            <button class="btn btn-primary" onclick="startAnalysis()">开始AI分析</button>
            <button class="btn btn-outline" onclick="viewHistory()">查看历史分析</button>
        </div>
        <div id="analysisResult" style="display:none"></div>
    </div>
        <div style="margin-top:20px">
            <button class="btn btn-primary" onclick="startAnalysis()">开始AI分析</button>
            <button class="btn btn-outline" onclick="viewHistory()">查看历史分析</button>
        </div>
        <div id="analysisResult" style="display:none"></div>
    </div>

    <!-- 日记列表 -->
    <div class="card">
        <h2>日记列表</h2>
        <input type="text" class="input" id="searchInput" placeholder="搜索日记内容或日期..." style="margin-bottom:20px">
        <div id="diaryList">
            <div class="empty-state">还没有日记，开始写第一篇吧</div>
        </div>
    </div>

    <!-- AI配置模态框 -->
    <div id="configModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <h2>AI接口配置</h2>
                <button class="modal-close" onclick="closeModal('configModal')">×</button>
            </div>
            
            <h3>基础配置</h3>
            <div class="grid-2" style="margin-bottom:16px">
                <div>
                    <label>API 密钥</label>
                    <input type="password" class="input" id="apiKey" placeholder="输入你的API Key">
                </div>
                <div>
                    <label>API 节点地址</label>
                    <input type="text" class="input" id="apiBase" placeholder="https://api.openai.com/v1" value="https://api.openai.com/v1">
                </div>
            </div>
            <div class="grid-2" style="margin-bottom:16px">
                <div>
                    <label>模型名称</label>
                    <input type="text" class="input" id="modelName" placeholder="gpt-3.5-turbo" value="gpt-3.5-turbo">
                </div>
                <div>
                    <label>温度值 (0-2)</label>
                    <input type="number" class="input" id="temperature" placeholder="0.7" value="0.7" min="0" max="2" step="0.1">
                </div>
            </div>
            <div style="margin-bottom:16px">
                <label>最大生成长度 (tokens)</label>
                <input type="number" class="input" id="maxTokens" placeholder="2000" value="2000" min="100" max="10000">
            </div>

            <h3>提示词配置（可修改）</h3>
            <div style="margin-bottom:16px">
                <label>日记分析提示词</label>
                <textarea class="input textarea" id="analysisPrompt" style="min-height:200px">你是一位专业的日记分析师，请根据用户提供的日记内容，从{视角}角度进行深入、客观、温暖的分析。

要求：
1. 分析要具体，结合日记中的具体内容，不要空泛
2. 语言要温暖有同理心，避免评判性语言
3. 结构清晰，分点列出，使用小标题
4. 最后给出1-2条建设性的建议
5. 字数控制在{字数}左右

现在开始分析以下日记内容：
{日记内容}</textarea>
            </div>
            <div style="margin-bottom:24px">
                <label>批量日记解析提示词</label>
                <textarea class="input textarea" id="parsePrompt" style="min-height:150px">请将以下文本解析为多篇独立的日记，每篇日记包含日期和内容。

要求：
1. 识别每篇日记的开头日期，支持格式：YYYY-MM-DD、YYYY/MM/DD、MM-DD、X月X日
2. 如果没有明确日期，使用"未知日期"
3. 保留日记的原始内容，不要修改
4. 输出严格按照JSON数组格式，每个元素包含date和content两个字段
5. 不要添加任何额外的解释或说明

需要解析的文本：
{文本内容}</textarea>
            </div>

            <div style="display:flex;gap:12px;justify-content:flex-end">
                <button class="btn btn-outline" onclick="resetPrompts()">恢复默认提示词</button>
                <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
            </div>
        </div>
    </div>

    <!-- 历史分析模态框 -->
    <div id="historyModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <h2>历史分析记录</h2>
                <button class="modal-close" onclick="closeModal('historyModal')">×</button>
            </div>
            <div id="historyList"></div>
        </div>
    </div>

<script>
// 全局变量
let diaries = JSON.parse(localStorage.getItem('diaries') || '[]');
let analysisHistory = JSON.parse(localStorage.getItem('analysisHistory') || '[]');
let selectedDiaryId = null;
let config = JSON.parse(localStorage.getItem('aiConfig') || JSON.stringify({
    apiKey: '',
    apiBase: 'https://api.openai.com/v1',
    modelName: 'gpt-3.5-turbo',
    temperature: 0.7,
    maxTokens: 2000,
    analysisPrompt: `你是一位专业的日记分析师，请根据用户提供的日记内容，从{视角}角度进行深入、客观、温暖的分析。

要求：
1. 分析要具体，结合日记中的具体内容，不要空泛
2. 语言要温暖有同理心，避免评判性语言
3. 结构清晰，分点列出，使用小标题
4. 最后给出1-2条建设性的建议
5. 字数控制在{字数}左右

现在开始分析以下日记内容：
{日记内容}`,
    parsePrompt: `请将以下文本解析为多篇独立的日记，每篇日记包含日期和内容。

要求：
1. 识别每篇日记的开头日期，支持格式：YYYY-MM-DD、YYYY/MM/DD、MM-DD、X月X日
2. 如果没有明确日期，使用"未知日期"
3. 保留日记的原始内容，不要修改
4. 输出严格按照JSON数组格式，每个元素包含date和content两个字段
5. 不要添加任何额外的解释或说明

需要解析的文本：
{文本内容}`
}));

// 初始化
document.addEventListener('DOMContentLoaded', () => {
    initTheme();
    initTabs();
    initFileUpload();
    renderDiaryList();
    loadConfigToForm();
    
    // 自定义视角显示切换
    document.getElementById('analysisView').addEventListener('change', (e) => {
        document.getElementById('customViewInput').style.display = e.target.value === 'custom' ? 'block' : 'none';
    });
});

// 主题切换
function initTheme() {
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('themeBtn').textContent = '☀️';
    }
    document.getElementById('themeBtn').addEventListener('click', () => {
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
    });
}

// 标签页切换
function initTabs() {
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            tab.classList.add('active');
            document.getElementById(tab.dataset.tab + 'Tab').style.display = 'block';
        });
    });
}

// 文件上传
function initFileUpload() {
    const dropBox = document.getElementById('dropBox');
    const fileInput = document.getElementById('fileInput');
// AI分析
async function startAnalysis() {
    if (!config.apiKey) {
        alert('请先点击右上角⚙️配置AI接口信息！');
        openModal('configModal');
        return;
    }

    const timeRange = document.getElementById('timeRange').value;
    
    // 获取所有选中的分析视角
    const checkedViews = Array.from(document.querySelectorAll('input[name="view"]:checked')).map(cb => cb.value);
    if (checkedViews.length === 0) {
        alert('请至少选择一个分析视角！');
        return;
    }

    // 视角名称映射（完全对应flomo）
    const viewMap = {
        default: '默认洞察',
        value: '价值澄清',
        reverse: '逆向思考',
        second: '二阶思考',
        cbt: 'CBT疗法',
        mbti: 'MBTI分析',
        custom: document.getElementById('customView').value
    };

    // 处理自定义视角
    let viewNames = checkedViews.map(v => viewMap[v]);
    if (checkedViews.includes('custom') && !viewMap.custom) {
        alert('请输入自定义分析视角内容！');
        return;
    }

    // 自定义视角显示切换
    document.getElementById('customViewInput').style.display = checkedViews.includes('custom') ? 'block' : 'none';

    // 获取对应时间范围的日记
    let targetDiaries = [];
    const now = new Date();
    
    switch (timeRange) {
        case 'single':
            if (!selectedDiaryId) {
                alert('请先在日记列表中点击"选中分析"选择一篇日记！');
                return;
            }
            targetDiaries = diaries.filter(d => d.id === selectedDiaryId);
            break;
        case 'today':
            const today = now.toLocaleDateString();
            targetDiaries = diaries.filter(d => d.date === today);
            break;
        case 'week':
            const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            targetDiaries = diaries.filter(d => new Date(d.date) >= weekAgo);
            break;
        case 'month':
            const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
            targetDiaries = diaries.filter(d => new Date(d.date) >= monthAgo);
            break;
        case 'all':
            targetDiaries = [...diaries];
            break;
    }

    if (targetDiaries.length === 0) {
        alert('该时间范围内没有日记！');
        return;
    }

    // 拼接日记内容
    let diaryContent = targetDiaries.map(d => `【${d.date}】\n${d.content}`).join('\n\n');
    
    // 显示加载状态
    const resultEl = document.getElementById('analysisResult');
    resultEl.style.display = 'block';
    resultEl.innerHTML = '<div class="loading">正在分析中，请稍候...</div>';

    try {
        // 拼接多视角提示词
        const viewsText = viewNames.join('、');
        const prompt = config.analysisPrompt
            .replace('{视角}', viewsText)
            .replace('{字数}', config.maxTokens * 0.75)
            .replace('{日记内容}', diaryContent);

        const result = await callAI(prompt);
        
        // 保存分析历史（✅ 确认：分析结果会永久保存到本地）
        const historyItem = {
            id: Date.now(),
            view: viewsText, // 保存所有选中的视角名称
            timeRange: timeRange,
            diaryCount: targetDiaries.length,
            result: result,
            createdAt: new Date().toLocaleString()
        };
        analysisHistory.unshift(historyItem);
        localStorage.setItem('analysisHistory', JSON.stringify(analysisHistory));

        // 显示结果
        resultEl.innerHTML = `
            <div class="analysis-result">
                <h4>📊 ${viewsText} 分析结果</h4>
                <div class="analysis-meta">分析范围: ${getTimeRangeText(timeRange)} | 共${targetDiaries.length}篇日记 | ${historyItem.createdAt}</div>
                <div>${marked.parse(result)}</div>
                <div style="margin-top:20px;display:flex;gap:12px">
                    <button class="btn btn-outline" onclick="copyResult()">复制结果</button>
                    <button class="btn btn-outline" onclick="exportResult()">导出为Markdown</button>
                </div>
            </div>
        `;
    } catch (err) {

}

// 添加单篇日记
function addDiary() {
    const content = document.getElementById('diaryInput').value.trim();
    if (!content) {
        alert('日记内容不能为空！');
        return;
    }
    addDiaryItem(new Date().toLocaleDateString(), content, '手动输入');

}

// 智能解析多篇日记
async function parseMultiDiary() {
    const content = document.getElementById('diaryInput').value.trim();
    if (!content) {
        alert('请先粘贴日记内容！');
        return;
    }
    await parseAndAddMultiDiary(content, '智能解析');
    document.getElementById('diaryInput').value = '';
}

async function parseAndAddMultiDiary(content, source) {
    if (!config.apiKey) {
        // 没有配置AI时，尝试简单解析
        simpleParseMultiDiary(content, source);
        return;
    }

    try {
        const prompt = config.parsePrompt.replace('{文本内容}', content);
        const result = await callAI(prompt);
        const diaries = JSON.parse(result);
        diaries.forEach(item => {
            addDiaryItem(item.date, item.content, source);
        });
        alert(`成功解析 ${diaries.length} 篇日记！`);
    } catch (err) {
        console.error('AI解析失败，使用简单解析:', err);
        simpleParseMultiDiary(content, source);
    }
}

function simpleParseMultiDiary(content, source) {
    // 简单的日期正则匹配
    const dateRegex = /(?:^|\n)(\d{4}[-/]\d{1,2}[-/]\d{1,2}|\d{1,2}[-/]\d{1,2}|\d{1,2}月\d{1,2}日)/g;
    const parts = content.split(dateRegex);
    
    if (parts.length > 1) {
        let count = 0;
        for (let i = 1; i < parts.length; i += 2) {
            const date = parts[i];
            const text = parts[i + 1]?.trim() || '';
            if (text) {
                addDiaryItem(date, text, source);
                count++;
            }
        }
        alert(`简单解析完成，共导入 ${count} 篇日记`);
    } else {
        // 没有找到日期，当作单篇
        addDiaryItem(new Date().toLocaleDateString(), content, source);
        alert('未识别到多个日期，已作为单篇日记导入');
    }
}

function addDiaryItem(date, content, source) {
    const diary = {
        id: Date.now() + Math.random(),
        date: date,
        content: content.trim(),
        source: source,
        createdAt: new Date().toISOString()
    };
    diaries.unshift(diary);
    saveDiaries();
    renderDiaryList();
}

function saveDiaries() {
    localStorage.setItem('diaries', JSON.stringify(diaries));
}

function renderDiaryList() {
    const listEl = document.getElementById('diaryList');
    const searchKey = document.getElementById('searchInput').value.toLowerCase();
    
    const filtered = diaries.filter(d => 
        d.content.toLowerCase().includes(searchKey) || 
        d.date.toLowerCase().includes(searchKey)
    );

    if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty-state">没有找到匹配的日记</div>';
        return;
    }

    let html = '';
    filtered.forEach(diary => {
        html += `
        <div class="diary-item" data-id="${diary.id}">
            <div class="diary-header">
                <span class="diary-date">📅 ${diary.date}</span>
                <span class="diary-source">${diary.source}</span>
            </div>
            <div class="diary-preview">${diary.content}</div>
            <div class="diary-actions">
                <button class="btn btn-outline btn-sm" onclick="selectDiary(${diary.id})">选中分析</button>
                <button class="btn btn-outline btn-sm" onclick="viewDiary(${diary.id})">查看全文</button>
                <button class="btn btn-danger btn-sm" onclick="deleteDiary(${diary.id})">删除</button>
            </div>
        </div>
        `;
    });
    listEl.innerHTML = html;
}

document.getElementById('searchInput').addEventListener('input', renderDiaryList);

function selectDiary(id) {
    selectedDiaryId = id;
    document.getElementById('timeRange').value = 'single';
    alert('已选中该日记，点击"开始AI分析"即可分析');
}

function viewDiary(id) {
    const diary = diaries.find(d => d.id === id);
    if (!diary) return;
    alert(`日期：${diary.date}\n\n${diary.content}`);
}

function deleteDiary(id) {
    if (!confirm('确定要删除这篇日记吗？')) return;
    diaries = diaries.filter(d => d.id !== id);
    saveDiaries();
    renderDiaryList();
}

function clearAllDiaries() {
    if (!confirm('确定要清空所有日记吗？此操作不可恢复！')) return;
    diaries = [];
    saveDiaries();
    renderDiaryList();
}

// AI分析
async function startAnalysis() {
    if (!config.apiKey) {
        alert('请先点击右上角⚙️配置AI接口信息！');
        openModal('configModal');
        return;
    }

    const timeRange = document.getElementById('timeRange').value;
    const view = document.getElementById('analysisView').value;
    let viewName = '';
    
    const viewMap = {
        emotion: '情绪分析',
        growth: '成长与反思',
        relationship: '人际关系',
        productivity: '生产力与时间',
        health: '健康与生活',
        summary: '内容总结',
        custom: document.getElementById('customView').value
    };
    
    viewName = viewMap[view];
    if (view === 'custom' && !viewName) {
        alert('请输入自定义分析视角！');
        return;
    }

    // 获取对应时间范围的日记
    let targetDiaries = [];
    const now = new Date();
    
    switch (timeRange) {
        case 'single':
            if (!selectedDiaryId) {
                alert('请先在日记列表中点击"选中分析"选择一篇日记！');
                return;
            }
            targetDiaries = diaries.filter(d => d.id === selectedDiaryId);
            break;
        case 'today':
            const today = now.toLocaleDateString();
            targetDiaries = diaries.filter(d => d.date === today);
            break;
        case 'week':
            const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            targetDiaries = diaries.filter(d => new Date(d.date) >= weekAgo);
            break;
        case 'month':
            const monthAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
            targetDiaries = diaries.filter(d => new Date(d.date) >= monthAgo);
            break;
        case 'all':
            targetDiaries = [...diaries];
            break;
    }

    if (targetDiaries.length === 0) {
        alert('该时间范围内没有日记！');
        return;
    }

    // 拼接日记内容
    let diaryContent = targetDiaries.map(d => `【${d.date}】\n${d.content}`).join('\n\n');
    
    // 显示加载状态
    const resultEl = document.getElementById('analysisResult');
    resultEl.style.display = 'block';
    resultEl.innerHTML = '<div class="loading">正在分析中，请稍候...</div>';

    try {
        const prompt = config.analysisPrompt
            .replace('{视角}', viewName)
            .replace('{字数}', config.maxTokens * 0.75)
            .replace('{日记内容}', diaryContent);

        const result = await callAI(prompt);
        
        // 保存分析历史
        const historyItem = {
            id: Date.now(),
            view: viewName,
            timeRange: timeRange,
            diaryCount: targetDiaries.length,
            result: result,
            createdAt: new Date().toLocaleString()
        };
        analysisHistory.unshift(historyItem);
        localStorage.setItem('analysisHistory', JSON.stringify(analysisHistory));

        // 显示结果
        resultEl.innerHTML = `
            <div class="analysis-result">
                <h4>📊 ${viewName} 分析结果</h4>
                <div class="analysis-meta">分析范围: ${getTimeRangeText(timeRange)} | 共${targetDiaries.length}篇日记 | ${historyItem.createdAt}</div>
                <div>${marked.parse(result)}</div>
                <div style="margin-top:20px;display:flex;gap:12px">
                    <button class="btn btn-outline" onclick="copyResult()">复制结果</button>
                    <button class="btn btn-outline" onclick="exportResult()">导出为Markdown</button>
                </div>
            </div>
        `;
    } catch (err) {
        resultEl.innerHTML = `<div style="color:var(--danger);text-align:center;padding:20px">分析失败: ${err.message}</div>`;
    }
}

function getTimeRangeText(range) {
    const map = {
        single: '单篇日记',
        today: '今日',
        week: '近7天',
        month: '近30天',
        all: '全部'
    };
    return map[range];
}

async function callAI(prompt) {
    const response = await fetch(`${config.apiBase}/chat/completions`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${config.apiKey}`
        },
        body: JSON.stringify({
            model: config.modelName,
            messages: [{ role: 'user', content: prompt }],
            temperature: parseFloat(config.temperature),
            max_tokens: parseInt(config.maxTokens)
        })
    });

    if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error?.message || 'API请求失败');
    }

    const data = await response.json();
    return data.choices[0].message.content;
}

function copyResult() {
    const resultText = document.querySelector('.analysis-result > div:nth-child(3)').textContent;
    navigator.clipboard.writeText(resultText).then(() => {
        alert('已复制到剪贴板！');
    });
}

function exportResult() {
    const resultText = document.querySelector('.analysis-result > div:nth-child(3)').textContent;
    const blob = new Blob([resultText], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `日记分析_${new Date().toLocaleDateString()}.md`;
    a.click();
    URL.revokeObjectURL(url);
}

function viewHistory() {
    const listEl = document.getElementById('historyList');
    if (analysisHistory.length === 0) {
        listEl.innerHTML = '<div class="empty-state">还没有分析记录</div>';
        openModal('historyModal');

    }

    let html = '';
    analysisHistory.forEach(item => {
        html += `
        <div class="diary-item">
            <div class="diary-header">
                <span class="diary-date">📊 ${item.view}</span>
                <span class="diary-source">${item.createdAt}</span>
            </div>
            <div style="color:var(--text-secondary);margin-bottom:8px">
                分析范围: ${getTimeRangeText(item.timeRange)} | 共${item.diaryCount}篇日记
            </div>
            <div class="diary-preview">${item.result}</div>
            <div class="diary-actions">
                <button class="btn btn-outline btn-sm" onclick="viewHistoryDetail(${item.id})">查看详情</button>
                <button class="btn btn-danger btn-sm" onclick="deleteHistory(${item.id})">删除</button>
            </div>
        </div>
        `;
    });
    listEl.innerHTML = html;
    openModal('historyModal');
}

function viewHistoryDetail(id) {
    const item = analysisHistory.find(h => h.id === id);
    if (!item) return;
    
    const resultEl = document.getElementById('analysisResult');
    resultEl.style.display = 'block';
    resultEl.innerHTML = `
        <div class="analysis-result">
            <h4>📊 ${item.view} 分析结果（历史记录）</h4>
            <div class="analysis-meta">分析范围: ${getTimeRangeText(item.timeRange)} | 共${item.diaryCount}篇日记 | ${item.createdAt}</div>
            <div>${marked.parse(item.result)}</div>
        </div>
    `;
    closeModal('historyModal');
}

function deleteHistory(id) {
    if (!confirm('确定要删除这条分析记录吗？')) return;
    analysisHistory = analysisHistory.filter(h => h.id !== id);
    localStorage.setItem('analysisHistory', JSON.stringify(analysisHistory));
    viewHistory();
}
