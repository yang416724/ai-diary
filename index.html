<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI日记分析</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        /* 真正马卡龙粉绿配色（粉色为主，绿色为辅） */
        :root{
            --bg:#F8FDF9;          /* 超浅薄荷绿背景（比纯粉更护眼） */
            --card:#FEF7FA;        /* 奶白卡片 */
            --text:#5A4B5A;        /* 深灰粉正文 */
            --text-secondary:#9A8B9A;/* 浅灰粉次要文字 */
            --border:#D5E8DC;      /* 薄荷绿边框（粉绿平衡关键） */
            --primary:#F9A8D4;     /* 主色：马卡龙樱花粉 */
            --primary-hover:#F472B6;/* 悬浮加深樱花粉 */
            --secondary:#86E3CE;   /* 辅助色：马卡龙薄荷绿 */
            --secondary-hover:#6DD5BE;/* 悬浮加深薄荷绿 */
            --danger:#F87171;      /* 马卡龙豆沙红 */
            --success:#86E3CE;     /* 成功薄荷绿 */
            --shadow:0 2px 8px 0 rgba(249, 168, 212, 0.12) /* 淡粉柔阴影 */
        }
        .dark{
            --bg:#2A3330;          /* 暗调薄荷绿背景 */
            --card:#353F3C;        /* 深一点的卡片色 */
            --text:#F0E6F0;        /* 奶白文字 */
            --text-secondary:#B0C0B8;/* 浅灰绿次要文字 */
            --border:#4A5A54;      /* 深薄荷绿边框 */
            --primary:#FBCFE8;     /* 亮马卡龙樱花粉 */
            --primary-hover:#F9A8D4;/* 悬浮色 */
            --secondary:#A7F3D0;   /* 亮马卡龙薄荷绿 */
            --secondary-hover:#86E3CE;/* 悬浮色 */
            --danger:#FCA5A5;      /* 亮马卡龙红 */
            --success:#A7F3D0;     /* 亮薄荷绿 */
            --shadow:0 2px 8px 0 rgba(0, 0, 0, 0.3)
        }

        /* 马卡龙风格圆角 */
        .card{border-radius:24px}
        .input,.select,.btn{border-radius:12px}

        body{background:var(--bg);color:var(--text);padding:20px;max-width:1000px;margin:0 auto;transition:all 0.3s ease}
        .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
        .top-bar h1{font-size:28px;color:var(--primary);display:flex;align-items:center;gap:8px}
        .top-actions{display:flex;gap:16px;align-items:center}
        .icon-btn{background:transparent;border:none;font-size:22px;cursor:pointer;color:var(--text);padding:8px;border-radius:8px;transition:background 0.2s}
        .icon-btn:hover{background:var(--border)}

        .card{background:var(--card);padding:24px;margin-bottom:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
        .card h2{font-size:22px;margin-bottom:20px;color:var(--text)}
        .card h3{font-size:18px;margin:16px 0 12px;color:var(--text)}

        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        @media (max-width:768px){.grid-2{grid-template-columns:1fr}}

        .input{width:100%;padding:12px 16px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;outline:none;transition:border-color 0.2s}
        .input:focus{border-color:var(--primary)}
        .textarea{min-height:120px;resize:vertical;line-height:1.6}
        .select{width:100%;padding:12px 16px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;cursor:pointer}

        .btn{padding:12px 24px;border:none;font-size:16px;font-weight:500;cursor:pointer;transition:all 0.2s}
        .btn-primary{background:var(--primary);color:white}
        .btn-primary:hover{background:var(--primary-hover)}
        .btn-secondary{background:var(--secondary);color:white}
        .btn-secondary:hover{background:var(--secondary-hover)}
        .btn-danger{background:var(--danger);color:white}
        .btn-success{background:var(--success);color:white}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
        .btn-outline:hover{background:var(--border)}
        .btn-sm{padding:8px 16px;font-size:14px}

        .upload-box{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;transition:border-color 0.2s}
        .upload-box.active{border-color:var(--primary)}
        .upload-icon{font-size:48px;color:var(--text-secondary);margin-bottom:12px}
        .upload-txt{font-size:18px;color:var(--text);margin-bottom:8px}
        .upload-tip{color:var(--text-secondary);margin-bottom:20px}
        input[type="file"]{display:none}

        .tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:8px}
        .tab{padding:8px 16px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-radius:8px;font-size:16px;transition:all 0.2s}
        .tab.active{background:var(--primary);color:white}

        .diary-item{border-bottom:1px solid var(--border);padding:16px 0}
        .diary-item:last-child{border-bottom:none}
        .diary-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        .diary-date{font-weight:500;color:var(--text)}
        .diary-source{font-size:14px;color:var(--text-secondary)}
        .diary-preview{color:var(--text-secondary);line-height:1.5;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .diary-actions{display:flex;gap:8px;margin-top:12px}
        .diary-block{margin-bottom:12px;padding:12px;background:var(--bg);border-radius:8px}
        .diary-block-title{font-weight:500;color:var(--secondary);margin-bottom:6px} /* 区块标题用薄荷绿 */
        .diary-block-content{line-height:1.5}

        .analysis-result{background:var(--bg);border-radius:12px;padding:20px;margin-top:20px;line-height:1.8}
        .analysis-result h4{margin-bottom:12px;color:var(--primary)}
        .analysis-meta{font-size:14px;color:var(--text-secondary);margin-bottom:16px}

        .empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary)}
        .loading{text-align:center;padding:40px;color:var(--text-secondary)}
        .loading::after{content:"";display:inline-block;width:20px;height:20px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
        .modal-content{background:var(--card);border-radius:20px;padding:24px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text)}

        .badge{display:inline-block;padding:4px 8px;border-radius:4px;font-size:12px;background:var(--secondary);color:white;margin-left:8px} /* 标签用薄荷绿 */

        /* 分析看板样式 */
        .dashboard-card{margin-bottom:30px}
        .dashboard-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .dashboard-actions{display:flex;gap:8px}
        .latest-result{max-height:300px;overflow-y:auto;padding:16px;background:var(--bg);border-radius:12px}

        /* 目标输入框样式 */
        .goal-input-group{margin-bottom:16px}
        .goal-input-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        .goal-input-label{font-weight:500;color:var(--primary)} /* 目标标题用粉色 */
        .goal-no-record{display:flex;align-items:center;gap:6px;cursor:pointer}
        .goal-textarea{min-height:60px}

        /* 目标配置样式 */
        .goal-item{display:flex;align-items:center;gap:12px;margin-bottom:12px}
        .goal-item input{flex:1}
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>📘 AI日记分析</h1>
        <div class="top-actions">
            <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
            <button class="icon-btn" id="goalConfigBtn" title="目标配置">🎯</button>
            <button class="icon-btn" id="configBtn" title="AI配置">⚙️</button>
            <button class="icon-btn" id="exportBtn" title="导出所有数据">📤</button>
            <button class="icon-btn" id="importBtn" title="导入备份数据">📥</button>
            <button class="icon-btn" id="restoreBtn" title="恢复上一次备份">🔄</button>
        </div>
    </div>

    <!-- 录入区域 -->
    <div class="card">
        <div class="tabs">
            <button class="tab active" data-entry-tab="goal">🎯 目标打卡记</button>
            <button class="tab" data-entry-tab="free">✍️ 随心随笔记</button>
        </div>

        <!-- 目标打卡记 -->
        <div id="goalEntryTab" class="entry-tab-content">
            <div id="goalInputsContainer">
                <!-- 动态生成目标输入框 -->
            </div>
            <div class="goal-input-group">
                <div class="goal-input-header">
                    <span class="goal-input-label">📝 额外补充（可选）</span>
                </div>
                <textarea class="input textarea goal-textarea" id="extraContent" placeholder="写一些目标之外的零散内容..."></textarea>
            </div>
            <div style="margin-top:20px">
                <button class="btn btn-primary" onclick="saveGoalDiary()">保存日记</button>
            </div>
        </div>

        <!-- 随心随笔记 -->
        <div id="freeEntryTab" class="entry-tab-content" style="display:none">
            <textarea class="input textarea" id="freeDiaryInput" style="min-height:300px" placeholder="随便写点什么吧，不用有任何格式限制..."></textarea>
            <div style="margin-top:20px;display:flex;gap:12px">
                <button class="btn btn-outline" onclick="saveFreeDiary(false)">仅保存原始文本</button>
                <button class="btn btn-secondary" onclick="saveFreeDiary(true)">保存并AI智能分区</button>
            </div>
        </div>
    </div>

    <!-- 主标签页：分析看板 / 日记列表 -->
    <div class="tabs">
        <button class="tab active" data-main-tab="dashboard">📊 分析看板</button>
        <button class="tab" data-main-tab="diaryList">📝 日记列表</button>
    </div>

    <!-- 分析看板 -->
    <div id="dashboardTab" class="main-tab-content">
        <!-- 今日分析 -->
        <div class="card dashboard-card">
            <div class="dashboard-header">
                <h3>☀️ 今日分析</h3>
                <div class="dashboard-actions">
                    <button class="btn btn-primary btn-sm" onclick="quickAnalyze('today')">重新分析</button>
                    <button class="btn btn-outline btn-sm" onclick="viewRangeHistory('today')">查看历史</button>
                </div>
            </div>
            <div id="todayResult" class="latest-result">
                <div class="empty-state">还没有今日分析，点击"重新分析"开始</div>
            </div>
        </div>

        <!-- 近7天分析 -->
        <div class="card dashboard-card">
            <div class="dashboard-header">
                <h3>📅 近7天分析</h3>
                <div class="dashboard-actions">
                    <button class="btn btn-primary btn-sm" onclick="quickAnalyze('week')">重新分析</button>
                    <button class="btn btn-outline btn-sm" onclick="viewRangeHistory('week')">查看历史</button>
                </div>
            </div>
            <div id="weekResult" class="latest-result">
                <div class="empty-state">还没有近7天分析，点击"重新分析"开始</div>
            </div>
        </div>

        <!-- 近30天分析 -->
        <div class="card dashboard-card">
            <div class="dashboard-header">
                <h3>📆 近30天分析</h3>
                <div class="dashboard-actions">
                    <button class="btn btn-primary btn-sm" onclick="quickAnalyze('month')">重新分析</button>
                    <button class="btn btn-outline btn-sm" onclick="viewRangeHistory('month')">查看历史</button>
                </div>
            </div>
            <div id="monthResult" class="latest-result">
                <div class="empty-state">还没有近30天分析，点击"重新分析"开始</div>
            </div>
        </div>

        <!-- 年度分析 -->
        <div class="card dashboard-card">
            <div class="dashboard-header">
                <h3>📈 年度分析（全部）</h3>
                <div class="dashboard-actions">
                    <button class="btn btn-primary btn-sm" onclick="quickAnalyze('all')">重新分析</button>
                    <button class="btn btn-outline btn-sm" onclick="viewRangeHistory('all')">查看历史</button>
                </div>
            </div>
            <div id="allResult" class="latest-result">
                <div class="empty-state">还没有年度分析，点击"重新分析"开始</div>
            </div>
        </div>
    </div>

    <!-- 日记列表 -->
    <div id="diaryListTab" class="main-tab-content" style="display:none">
        <div class="card">
            <h2>日记列表</h2>
            <div style="display:flex;gap:12px;margin-bottom:20px">
                <input type="text" class="input" id="searchInput" placeholder="搜索日记内容或日期..." style="flex:1">
                <select class="select" id="diaryTypeFilter" style="width:150px">
                    <option value="all">全部类型</option>
                    <option value="goal">目标打卡</option>
                    <option value="free">随心随笔</option>
                </select>
            </div>
            <div id="diaryList">
                <div class="empty-state">还没有日记，开始写第一篇吧</div>
            </div>
        </div>
    </div>

    <!-- 自定义分析区域 -->
    <div class="card">
        <h2>自定义分析 <span class="badge">手动触发</span></h2>
        <div class="grid-2">
            <div>
                <label>分析时间范围</label>
                <select class="select" id="timeRange">
                    <option value="single">当前选中日记</option>
                    <option value="today">今日日记</option>
                    <option value="week">近7天日记</option>
                    <option value="month">近30天日记</option>
                    <option value="all">全部日记</option>
                </select>
            </div>
            <div>
                <label>分析视角（可多选，支持全选）</label>
                <div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" id="selectAll" onchange="toggleSelectAll()"> 全选
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="default"> 默认洞察
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="value"> 价值澄清
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="reverse"> 逆向思考
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="second"> 二阶思考
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="cbt"> CBT疗法
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="mbti"> MBTI分析
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="custom"> 自定义视角
                    </label>
                </div>
            </div>
        </div>
        <div id="customViewInput" style="margin-top:12px;display:none">
            <input type="text" class="input" id="customView" placeholder="输入你想要的额外分析视角，例如：金钱消费分析、梦境分析">
        </div>
        <div style="margin-top:20px">
            <button class="btn btn-primary" onclick="startAnalysis()">开始AI分析</button>
        </div>
        <div id="analysisResult" style="display:none"></div>
    </div>

    <!-- 目标配置模态框 -->
    <div id="goalConfigModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🎯 长期目标配置</h2>
                <button class="modal-close" onclick="closeModal('goalConfigModal')">×</button>
            </div>
            <div id="goalConfigList">
                <!-- 动态生成目标配置项 -->
            </div>
            <div style="margin-top:20px;display:flex;gap:12px">
                <button class="btn btn-outline" onclick="addGoalItem()">+ 添加新目标</button>
                <button class="btn btn-secondary" onclick="saveGoals()">保存目标</button>
            </div>
        </div>
    </div>

    <!-- AI配置模态框 -->
    <div id="configModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <h2>AI接口配置</h2>
                <button class="modal-close" onclick="closeModal('configModal')">×</button>
            </div>
            
            <h3>基础配置</h3>
            <div class="grid-2" style="margin-bottom:16px">
                <div>
                    <label>API 密钥</label>
                    <input type="password" class="input" id="apiKey" placeholder="输入你的API Key">
                </div>
                <div>
                    <label>API 节点地址</label>
                    <input type="text" class="input" id="apiBase" placeholder="https://api.openai.com/v1" value="https://api.openai.com/v1">
                </div>
            </div>
            <div class="grid-2" style="margin-bottom:16px">
                <div>
                    <label>模型名称</label>
                    <select class="select" id="modelName">
                        <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
                        <option value="gpt-4">gpt-4</option>
                        <option value="gpt-4-turbo">gpt-4-turbo</option>
                        <option value="gpt-4o">gpt-4o</option>
                        <option value="claude-3-opus-20240229">claude-3-opus</option>
                        <option value="claude-3-sonnet-20240229">claude-3-sonnet</option>
                        <option value="claude-3-haiku-20240307">claude-3-haiku</option>
                        <option value="custom">自定义其他模型</option>
                    </select>
                    <input type="text" class="input" id="customModel" placeholder="输入自定义模型名称" style="margin-top:8px;display:none">
                </div>
                <div>
                    <label>温度值 (0-2)</label>
                    <input type="number" class="input" id="temperature" placeholder="0.7" value="0.7" min="0" max="2" step="0.1">
                </div>
            </div>
            <div style="margin-bottom:16px">
                <label>最大生成长度 (tokens)</label>
                <input type="number" class="input" id="maxTokens" placeholder="2000" value="2000" min="100" max="10000">
            </div>

            <h3>提示词配置（可修改）</h3>
            <div style="margin-bottom:16px">
                <label>日记分析提示词</label>
                <textarea class="input textarea" id="analysisPrompt" style="min-height:300px">【AI角色】
我是一名在福州读大学的女生，你是我的专属私人日记洞察师，深度了解我的所有自定义长期目标。你精通Flomo全6大洞察视角，客观中立，只讲真话，不做道德评判。我是坚定的女权主义者，反对平权，支持推翻父权制，成为强大女性（包括身体强壮，心理强大）。

【核心规则（必须严格遵守）】
1. 绝对禁止鸡汤、空洞安慰、空泛大道理和晦涩的心理学术语
2. 所有分析必须紧扣我当天的日记内容，不凭空臆测
3. 所有行动建议必须是我当天/次日就能完成的小事，单条不超过20字
4. 严格按照下面的固定模块和顺序输出，不要增减大标题
5. 末尾必须生成3-5个关键词标签，方便我检索和长期记忆存档

【分析维度（完整覆盖Flomo6大视角+专属目标追踪）】
1. 【默认洞察】一句话概括当日核心内容+提炼3件最关键的事
2. 【价值澄清】从今天的言行中，找出我真正在意的东西；判断哪些事符合我的长期目标，哪些事在消耗我、偏离目标
3. 【逆向思考】如果今天这件事反过来做/不做，会有什么更好的结果？我今天忽略了哪些原本可以抓住的小机会（尤其关于赚钱、找工作、自媒体）
4. 【二阶思考】今天出现的问题（拖延、焦虑、不开心），表面原因是什么？背后真正的深层原因是什么？（不要只说“我懒”）
5. 【CBT认知纠偏】识别我日记里的负面思维陷阱（如非黑即白、灾难化、自我否定），用客观事实帮我纠正
6. 【MBTI行为映射】结合今天我的具体言行，分析我的人格特质在这件事上的体现，指出优势和需要注意的短板
7. 【核心目标每日追踪】分别对应我的所有自定义长期目标，给出1句话反馈+1条可落地小建议（当天没涉及的目标标注“今日无相关记录”即可）
8. 【明日行动清单】最多3条，只写具体动作，不写空话

function toggleGoalInput(index) {

    const input = document.getElementById(`goalInput${index}`);
    input.disabled = checkbox.checked;
    if (checkbox.checked) {

// 保存目标打卡日记（已修复变量名错误）
function saveGoalDiary() {
    const blocks = [];
    
    // 收集目标内容（修复：把index改成i）
    for (let i = 0; i < goals.length; i++) {
        const checkbox = document.getElementById(`goalNoRecord${i}`);
        const input = document.getElementById(`goalInput${i}`);
        
        if (!checkbox.checked && input.value.trim()) {
            blocks.push({
                title: goals[i],
                content: input.value.trim()
            });
        } else if (checkbox.checked) {
            blocks.push({
                title: goals[i],
                content: '今日无相关记录'
            });
        }
    }
    
    // 收集额外内容
    const extraContent = document.getElementById('extraContent').value.trim();
    if (extraContent) {
        blocks.push({
            title: '额外补充',
            content: extraContent
        });
    }
    
    // 校验：至少有一个目标填写了内容或勾选了无记录
    if (blocks.length === 0) {
        alert('请至少填写一个目标的内容或勾选"今日无相关记录"！');
        return;
    }
    
    // 创建日记对象（纯前端，不调用AI）
    const diary = {
        id: Date.now() + Math.random(),
        date: new Date().toLocaleDateString(),
        type: 'goal',
        blocks: blocks,
        rawText: '',
        source: '目标打卡',
        createdAt: new Date().toISOString()
    };
    
    diaries.unshift(diary);
    saveDiaries();
    renderDiaryList();
    
    // 清空输入框
    for (let i = 0; i < goals.length; i++) {
        document.getElementById(`goalNoRecord${i}`).checked = false;
        document.getElementById(`goalInput${i}`).disabled = false;
        document.getElementById(`goalInput${i}`).value = '';
        document.getElementById(`goalInput${i}`).style.opacity = '1';
    }
    document.getElementById('extraContent').value = '';
    
    alert('日记保存成功！');
}

// 保存随心随笔日记
async function saveFreeDiary(needPartition) {
    const rawText = document.getElementById('freeDiaryInput').value.trim();
    if (!rawText) {
        alert('日记内容不能为空！');
        return;
    }
    
    let blocks = [];
    
    if (needPartition) {
        if (!config.apiKey) {
            alert('需要配置AI接口才能使用智能分区功能！');
            openModal('configModal');
            return;
        }
        
        try {
            // 显示加载状态
            document.querySelector('#freeEntryTab .btn-secondary').disabled = true;
            document.querySelector('#freeEntryTab .btn-secondary').textContent = 'AI分区中...';
            
            // 调用AI分区
            const prompt = config.partitionPrompt
                .replace('{目标列表}', goals.join('、'))
                .replace('{文本内容}', rawText);
            
            const result = await callAI(prompt);
            blocks = JSON.parse(result);
        } catch (err) {
            console.error('AI分区失败:', err);
            alert('AI分区失败，已保存原始文本，你可以稍后手动分区');
            blocks = [{
                title: '原始内容',
                content: rawText
            }];
        }
    } else {
        blocks = [{
            title: '原始内容',
            content: rawText
        }];
    }
    
    // 创建日记对象
    const diary = {
        id: Date.now() + Math.random(),
        date: new Date().toLocaleDateString(),
        type: 'free',
        blocks: blocks,
        rawText: rawText,
        source: '随心随笔',
        createdAt: new Date().toISOString()
    };
    
    diaries.unshift(diary);
    saveDiaries();
    renderDiaryList();
    
    // 清空输入框
    document.getElementById('freeDiaryInput').value = '';
    document.querySelector('#freeEntryTab .btn-secondary').disabled = false;
    document.querySelector('#freeEntryTab .btn-secondary').textContent = '保存并AI智能分区';
    
    alert('日记保存成功！');
}

    let list = diaries.filter(d => {
        const matchKeyword = d.blocks.some(b => b.content.toLowerCase().includes(kw)) || d.date.includes(kw);
        const matchType = typeFilter === 'all' || d.type === typeFilter;
        return matchKeyword && matchType;
    });
    
    const wrap = document.getElementById('diaryList');

                <div class="diary-block-content">${block.content.slice(0, 100) + (block.content.length > 100 ? '...' : '')}</div>
            </div>`;
        });
        if (d.blocks.length > 2) {

// 看板一键快速分析
async function quickAnalyze(range) {
    if (!config.apiKey) {
        alert('请先右上角⚙配置AI密钥');openModal('configModal');return;
    }

    // 默认选中所有预设视角
    const defaultViews = ['default', 'value', 'reverse', 'second', 'cbt', 'mbti'];
    const viewMap = {
        default:"默认洞察",
        value:"价值澄清",
        reverse:"逆向思考",
        second:"二阶思考",
        cbt:"CBT疗法",
        mbti:"MBTI分析"
    };
    const viewNames = defaultViews.map(k => viewMap[k]).join('、');

    // 筛选日记
    let target=[];
    const now=new Date();
    switch(range){
        case 'today':
            let td=now.toLocaleDateString();
            target=diaries.filter(d=>d.date===td);break;
        case 'week':
            let wk=new Date(now.getTime()-7*86400*1000);
            target=diaries.filter(d=>new Date(d.date)>=wk);break;
        case 'month':
            let m=new Date(now.getTime()-30*86400*1000);
            target=diaries.filter(d=>new Date(d.date)>=m);break;
        case 'all':target=[...diaries];break;
    }
    if(!target.length){alert('所选范围无日记');return;}

    // 拼接结构化日记内容
    let diaryTxt = target.map(d=>{
        return `【${d.date}】\n${d.blocks.map(b=>`【${b.title}】\n${b.content}`).join('\n\n')}`;
    }).join('\n\n---\n\n');
    
    const el = document.getElementById(range + 'Result');
    el.innerHTML = '<div class="loading">AI分析请求中...</div>';

    try{
        // 注入目标列表到提示词
        const goalsText = goals.join('、');
        let prompt = config.analysisPrompt
            .replace('我的所有自定义长期目标', goalsText)
            .replace('{日记内容}', diaryTxt);
            
        let aiRes = await callAI(prompt);
        
        // 保存历史记录
        const hisItem = {
            id:Date.now(),
            view: viewNames,
            timeRange: range,
            diaryCount: target.length,
            result: aiRes,
            createdAt: new Date().toLocaleString()
        }
        analysisHistory.unshift(hisItem);
        localStorage.setItem('analysisHistory', JSON.stringify(analysisHistory));

        // 更新看板
        renderDashboard();
        alert(`${getRangeName(range)}分析完成！`);
    }catch(e){
        el.innerHTML = `<div style="color:var(--danger);padding:20px;text-align:center">失败：${e.message}</div>`;
    }
}

function getRangeName(s){
    const map={single:'单篇日记',today:'今日',week:'近7天',month:'近30天',all:'年度（全部）'}
    return map[s]
}

// AI请求接口
async function callAI(prompt){
    const model = config.modelName === 'custom' ? document.getElementById('customModel').value : config.modelName;
    const res = await fetch(`${config.apiBase}/chat/completions`,{
        method:'POST',
        headers:{
            'Content-Type':'application/json',
            'Authorization':`Bearer ${config.apiKey}`
        },
        body:JSON.stringify({
            model:model,
            messages:[{role:'user',content:prompt}],
            temperature:Number(config.temperature),
            max_tokens:Number(config.maxTokens)
        })
    })
    if(!res.ok){
        let err=await res.json();
        throw new Error(err.error?.message||'接口请求失败');
    }
    let json=await res.json();
    return json.choices[0].message.content;
}

function deleteHistory(id){
    if(!confirm('删除本条记录？'))return;
    analysisHistory=analysisHistory.filter(x=>x.id!==id);
    localStorage.setItem('analysisHistory',JSON.stringify(analysisHistory));
    // 刷新当前打开的历史模态框
    const title = document.getElementById('historyModalTitle').textContent;
    if(title.includes('今日')) viewRangeHistory('today');
    else if(title.includes('近7天')) viewRangeHistory('week');
    else if(title.includes('近30天')) viewRangeHistory('month');
    else if(title.includes('年度')) viewRangeHistory('all');
    else {

        renderDashboard();
    }
}

// 配置读写
function loadConfigToForm(){
    document.getElementById('apiKey').value=config.apiKey||'';
    document.getElementById('apiBase').value=config.apiBase||'https://api.openai.com/v1';
    document.getElementById('temperature').value=config.temperature||0.7;
    document.getElementById('maxTokens').value=config.maxTokens||2000;
    document.getElementById('analysisPrompt').value=config.analysisPrompt||'';
    document.getElementById('partitionPrompt').value=config.partitionPrompt||'';

    // 模型选择
    const modelSel = document.getElementById('modelName');
    const customModel = document.getElementById('customModel');
    if(config.modelName){
        let found = false;
        for(let i=0;i<modelSel.options.length;i++){
            if(modelSel.options[i].value === config.modelName){
                modelSel.selectedIndex = i;
                found = true;
                break;
            }
        }
        if(!found){
            modelSel.value = 'custom';
            customModel.value = config.modelName;
            customModel.style.display = 'block';
        }
    }
}

// 增量导入数据
document.getElementById('importBtn').addEventListener('click',()=>{
    if(!confirm('导入备份数据？不会覆盖现有数据，只会合并新增内容'))return;
    const input=document.createElement('input');
    input.type='file';
    input.accept='.json';
    input.onchange=e=>{
        const reader=new FileReader();
        reader.onload=ev=>{
            try{
                const backup=JSON.parse(ev.target.result);
                let addedCount=0;
                
                // 合并日记（去重）
                if(backup.diaries){
                    const existingIds=new Set(diaries.map(d=>d.id));
                    backup.diaries.forEach(d=>{
                        if(!existingIds.has(d.id)){
                            diaries.unshift(d);
                            addedCount++;
                        }
                    });
                }
                
                // 合并分析历史（去重）
                if(backup.analysisHistory){
                    const existingIds=new Set(analysisHistory.map(h=>h.id));
                    backup.analysisHistory.forEach(h=>{
                        if(!existingIds.has(h.id)){
                            analysisHistory.unshift(h);
                            addedCount++;
                        }
                    });
                }
                
                // 合并目标（如果当前没有目标）
                if(backup.goals && goals.length===0){
                    goals=backup.goals;
                    localStorage.setItem('goals',JSON.stringify(goals));
                }
                
                saveDiaries();
                localStorage.setItem('analysisHistory',JSON.stringify(analysisHistory));
                renderDiaryList();
                renderDashboard();
                renderGoalInputs();
                
                alert(`导入成功！共新增${addedCount}条数据`);
                location.reload();
            }catch(err){
                alert('导入失败：文件格式不正确');
            }
        };
        reader.readAsText(e.target.files[0]);
    };
    input.click();
});

// 一键恢复上一次备份
document.getElementById('restoreBtn').addEventListener('click',()=>{
    if(!confirm('确定要恢复到上一次备份吗？现有数据会被覆盖'))return;
    try {
        const backup = localStorage.getItem('diaries_backup');
        if(backup){
            diaries = JSON.parse(backup);
            saveDiaries();
            renderDiaryList();
            alert('恢复成功！');
            location.reload();
        } else {
            alert('没有找到备份数据');
        }
    } catch (e) {
        alert('恢复失败：' + e.message);
    }
});
