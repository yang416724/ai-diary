<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI日记分析</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#FFF0F5;--card:#FFFFFF;--text:#5A4B5A;--text-secondary:#9A8B9A;
            --border:#FFD1DC;--primary:#FFB7C5;--primary-hover:#FF9AAE;--danger:#FF8A80;
            --success:#A8D8B9;--success-light:#D4EDDA;--shadow:0 2px 12px rgba(255,183,197,0.2);
            --font:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',cursive,sans-serif;
        }
        .dark{
            --bg:#3A2D34;--card:#4A3D44;--text:#FDE8EC;--text-secondary:#C9B8BE;
            --border:#6A5760;--primary:#F8BBD0;--primary-hover:#F48FB1;--danger:#EF9A9A;
            --success:#80CBC4;--success-light:#375B5B;--shadow:0 2px 12px rgba(0,0,0,0.3);
        }
        body{background:var(--bg);color:var(--text);font-family:var(--font);padding:20px;max-width:1000px;margin:0 auto;transition:all 0.3s ease;font-size:16px}
        .card{border-radius:24px}.input,.select,.btn{border-radius:16px;font-family:var(--font)}
        .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .top-bar h1{font-size:30px;color:var(--primary)}
        .top-actions{display:flex;gap:12px;align-items:center}
        .icon-btn{background:transparent;border:none;font-size:24px;cursor:pointer;color:var(--text);padding:8px;border-radius:12px}
        .icon-btn:hover{background:var(--border)}
        .card{background:var(--card);padding:24px;margin-bottom:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
        .card h2{font-size:24px;margin-bottom:16px}.card h3{font-size:20px;margin:12px 0 8px}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        @media (max-width:768px){.grid-2{grid-template-columns:1fr}}
        .input{width:100%;padding:12px 16px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;outline:none}
        .input:focus{border-color:var(--success)}
        .textarea{min-height:140px;resize:vertical;line-height:1.6}
        .select{width:100%;padding:12px 16px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;cursor:pointer;border-radius:16px}
        .btn{padding:10px 20px;border:none;font-size:16px;font-weight:bold;cursor:pointer;transition:all 0.2s}
        .btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:var(--primary-hover)}
        .btn-danger{background:var(--danger);color:white}.btn-success{background:var(--success);color:white}
        .btn-outline{background:transparent;border:2px solid var(--border);color:var(--text)}.btn-outline:hover{background:var(--border)}
        .btn-sm{padding:6px 14px;font-size:14px}
        .tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid var(--border);padding-bottom:8px}
        .tab{padding:8px 20px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-radius:20px;font-size:18px;font-weight:bold}
        .tab.active{background:var(--primary);color:white}
        .date-nav{display:flex;align-items:center;gap:12px;margin-bottom:24px}
        .date-nav input[type="date"]{border:1px solid var(--border);padding:8px 12px;border-radius:12px;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px}
        .date-nav button{background:var(--success);border:none;color:white;padding:6px 12px;border-radius:12px;cursor:pointer;font-size:18px}
        .goal-row{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
        .goal-row label{font-weight:bold;font-size:18px}
        .other-section,.free-section{margin-top:28px;padding-top:20px;border-top:2px dashed var(--border)}
        .ai-actions{display:flex;gap:12px;margin-top:12px}
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
        .modal-content{background:var(--card);border-radius:24px;padding:24px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .modal-close{background:none;border:none;font-size:28px;cursor:pointer;color:var(--text)}
        .badge{background:var(--success);color:white;padding:4px 12px;border-radius:12px;font-size:14px;margin-left:8px}
        .history-panel{margin-top:16px;border-top:1px solid var(--border);padding-top:12px}
        .history-item{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:8px;font-size:14px}
        .loading{text-align:center;padding:20px}
        .loading::after{content:"";display:inline-block;width:20px;height:20px;border:3px solid var(--border);border-top-color:var(--success);border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .config-selector{display:flex;gap:8px;align-items:center;margin-bottom:16px}
        .fetch-models-btn{margin-top:8px}
        .result-content{position:relative;margin:8px 0}
        .result-content.collapsed{max-height:200px;overflow:hidden}
        .result-content.collapsed::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(transparent, var(--bg))}
        .toggle-btn{color:var(--primary);cursor:pointer;font-size:14px;margin-top:4px;background:none;border:none;font-family:var(--font);text-decoration:underline}
        .calendar td,.calendar th{width:14.28%;text-align:center;padding:8px 0;border-radius:8px}
        .calendar td.has-diary{background:var(--primary);color:white;cursor:pointer;font-weight:bold}
        .calendar td.has-diary:hover{background:var(--primary-hover)}
        .notebook-item .edit-area{display:flex;flex-direction:column;gap:8px;margin-top:8px}
        .chat-container{display:flex;flex-direction:column;height:500px}
        .chat-messages{flex:1;overflow-y:auto;padding:12px;background:var(--bg);border-radius:16px;margin-bottom:12px}
        .chat-msg{margin-bottom:12px;display:flex;gap:8px}
        .chat-msg.user{justify-content:flex-end}
        .chat-msg .bubble{max-width:80%;padding:12px 16px;border-radius:16px;line-height:1.5;word-break:break-word}
        .chat-msg.user .bubble{background:var(--primary);color:white;border-bottom-right-radius:4px}
        .chat-msg.assistant .bubble{background:var(--border);color:var(--text);border-bottom-left-radius:4px}
        .chat-input{display:flex;gap:8px}
        .chat-input textarea{flex:1;min-height:50px;max-height:100px}
        .chat-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    </style>
</head>
<body>
<div class="top-bar">
    <h1>🌸 AI日记分析</h1>
    <div class="top-actions">
        <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
        <button class="icon-btn" id="goalConfigBtn" title="目标配置">🎯</button>
        <button class="icon-btn" id="configBtn" title="设置">⚙️</button>
    </div>
</div>

<div class="tabs" id="mainTabs">
    <button class="tab active" data-main-tab="diary">📝 日记</button>
    <button class="tab" data-main-tab="analyze">📊 分析</button>
    <button class="tab" data-main-tab="chat">💬 对话</button>
</div>

<!-- 日记页（省略，内容与之前相同） -->
<div id="diaryTab" class="main-tab-content">... 大日记本、小本子、日历子标签 ...</div>

<!-- 分析页（省略） -->
<div id="analyzeTab" class="main-tab-content" style="display:none">... 分析看板、自定义分析 ...</div>

<!-- 对话页 -->
<div id="chatTab" class="main-tab-content" style="display:none">
    <div class="card">
        <h3>💬 AI 对话 <span class="badge">基于日记分析</span></h3>
        <div class="chat-toolbar">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                <input type="checkbox" id="memoryToggle"> 🧠 记忆：自动附带今日分析
            </label>
            <button class="btn btn-sm btn-outline" onclick="clearChat()">清除对话</button>
            <span style="color:var(--text-secondary);font-size:14px;margin-left:auto">💡 可在分析页生成今日分析后使用</span>
        </div>
        <div class="chat-container">
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input">
                <textarea id="chatInput" class="input textarea" rows="2" placeholder="输入消息... (Enter 发送)"></textarea>
                <button class="btn btn-primary" onclick="sendChat()">发送</button>
            </div>
        </div>
    </div>
</div>

<!-- 其他模态框（目标配置、设置、粘贴导入、批量导入）保持不变 -->

<script>
// ========== 全局变量 ==========
let diaries = [], analysisHistory = [], goals = [], selectedDiaryId = null, selectedNotebookGoal = null;
let apiConfigs = [], currentConfigId = null, config = {};
let chatMessages = [];
let calendarYear, calendarMonth;

// ... 所有已有函数（配置、日记、分析、日历、小本子等，完整保留，因篇幅太长此处省略，在最终代码中会全部包含）...

// ========== 对话功能 ==========
function loadChatHistory() {
    const saved = localStorage.getItem('chatHistory');
    if (saved) chatMessages = JSON.parse(saved);
    else chatMessages = [];
    renderChat();
}
function saveChatHistory() { localStorage.setItem('chatHistory', JSON.stringify(chatMessages)); }
function renderChat() {
    const container = document.getElementById('chatMessages');
    container.innerHTML = chatMessages.map(m => `
        <div class="chat-msg ${m.role}">
            <div class="bubble">${m.role === 'assistant' ? marked.parse(m.content) : m.content.replace(/\n/g,'<br>')}</div>
        </div>
    `).join('');
    container.scrollTop = container.scrollHeight;
}
function clearChat() { if(confirm('清除对话记录？')) { chatMessages = []; saveChatHistory(); renderChat(); } }

async function sendChat() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if(!msg) return;
    if(!config.apiKey) { openModal('configModal'); return alert('请先配置AI密钥'); }
    input.value = '';
    chatMessages.push({ role: 'user', content: msg });
    renderChat();
    saveChatHistory();

    // 构建 messages 数组
    const systemMsg = { role: 'system', content: '你是一个日记分析助手，可以基于用户的日记内容进行深入讨论。如果用户附带分析结果，请结合分析回答问题。' };
    const messages = [systemMsg];
    
    // 如果开启了记忆，且存在最新今日分析
    if(document.getElementById('memoryToggle').checked) {
        const latestToday = analysisHistory.filter(h=>h&&h.timeRange==='today')[0];
        if(latestToday) {
            messages.push({ role: 'assistant', content: '【以下是最新今日分析结果】\n' + latestToday.result, name: 'analysis' });
            messages.push({ role: 'user', content: '我已参考以上分析结果，请继续与我讨论。' });
        }
    }
    // 添加历史对话（最近10条）
    const recentHistory = chatMessages.slice(-10);
    messages.push(...recentHistory);

    // 显示加载状态
    chatMessages.push({ role: 'assistant', content: '...思考中...' });
    renderChat();
    try {
        const model = config.modelName==='custom' ? (document.getElementById('customModel')?.value || config.modelName) : config.modelName;
        const res = await fetch(`${config.apiBase}/chat/completions`, {
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':`Bearer ${config.apiKey}`},
            body: JSON.stringify({ model, messages, temperature:0.7, max_tokens:800 })
        });
        if(!res.ok) throw new Error((await res.json()).error?.message||'请求失败');
        const json = await res.json();
        const reply = json.choices[0].message.content;
        chatMessages.pop(); // 移除加载占位
        chatMessages.push({ role: 'assistant', content: reply });
    } catch(e) {
        chatMessages.pop();
        chatMessages.push({ role: 'assistant', content: '⚠️ 请求失败：' + e.message });
    }
    renderChat();
    saveChatHistory();
}

// 回车发送
document.addEventListener('keydown', function(e) {
    if(e.target.id === 'chatInput' && e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChat();
    }
});

// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded', () => {
    // ... 原有初始化（日期、主题、标签、渲染等）
    loadChatHistory();
    // 对话标签激活时渲染聊天
    document.querySelector('[data-main-tab="chat"]').addEventListener('click', renderChat);
});
</script>
</body>
</html>
