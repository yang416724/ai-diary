<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI日记分析</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        :root{
            --bg:#FDF2F8;          /* 马卡龙樱花粉背景 */
            --card:#FEF7FA;        /* 奶白卡片 */
            --text:#5A4B5A;        /* 深灰粉正文 */
            --text-secondary:#9A8B9A;/* 浅灰粉次要文字 */
            --border:#E2D5E2;      /* 浅粉边框 */
            --primary:#F9A8D4;     /* 主色：樱花粉 */
            --primary-hover:#F472B6;
            --danger:#F87171;      /* 豆沙红（删除） */
            --success:#6EE7B7;     /* 马卡龙薄荷绿（重点：绿色主色） */
            --success-hover:#4ADE80;
            --shadow:0 2px 8px 0 rgba(249, 168, 212, 0.15)
        }
        .dark{
            --bg:#2D1F2D;
            --card:#3D2F3D;
            --text:#F0E6F0;
            --text-secondary:#C0B0C0;
            --border:#5D4F5D;
            --primary:#FBCFE8;
            --primary-hover:#F9A8D4;
            --danger:#FCA5A5;
            --success:#A7F3D0;     /* 深色模式亮薄荷绿 */
            --success-hover:#86EFAC;
            --shadow:0 2px 8px 0 rgba(0, 0, 0, 0.3)
        }

        /* 圆角全局样式 */
        .card{border-radius:24px}
        .input,.select,.btn{border-radius:12px}

        body{background:var(--bg);color:var(--text);padding:20px;max-width:1000px;margin:0 auto;transition:all 0.3s ease}
        .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
        .top-bar h1{font-size:28px;color:var(--primary);display:flex;align-items:center;gap:8px}
        .top-actions{display:flex;gap:16px;align-items:center}
        .icon-btn{background:transparent;border:none;font-size:22px;cursor:pointer;color:var(--text);padding:8px;border-radius:8px;transition:background 0.2s}
        .icon-btn:hover{background:var(--border)}

        .card{background:var(--card);padding:24px;margin-bottom:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
        .card h2{font-size:22px;margin-bottom:20px;color:var(--text)}
        .card h3{font-size:18px;margin:16px 0 12px;color:var(--text)}

        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        @media (max-width:768px){.grid-2{grid-template-columns:1fr}}

        .input{width:100%;padding:12px 16px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;outline:none;transition:border-color 0.2s}
        /* 输入框聚焦使用绿色 */
        .input:focus{border-color:var(--success)}
        .textarea{min-height:120px;resize:vertical;line-height:1.6}
        .select{width:100%;padding:12px 16px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;cursor:pointer}

        .btn{padding:12px 24px;border:none;font-size:16px;font-weight:500;cursor:pointer;transition:all 0.2s}
        .btn-primary{background:var(--primary);color:white}
        .btn-primary:hover{background:var(--primary-hover)}
        .btn-danger{background:var(--danger);color:white}
        /* 绿色按钮样式（正式启用绿色配色） */
        .btn-success{background:var(--success);color:white}
        .btn-success:hover{background:var(--success-hover)}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
        .btn-outline:hover{background:var(--border)}
        .btn-sm{padding:8px 16px;font-size:14px}

        .tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:8px}
        .tab{padding:8px 16px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-radius:8px;font-size:16px;transition:all 0.2s}
        .tab.active{background:var(--primary);color:white}

        .diary-item{border-bottom:1px solid var(--border);padding:16px 0}
        .diary-item:last-child{border-bottom:none}
        .diary-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        .diary-date{font-weight:500;color:var(--text)}
        .diary-source{font-size:14px;color:var(--text-secondary)}
        .diary-preview{color:var(--text-secondary);line-height:1.5;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .diary-actions{display:flex;gap:8px;margin-top:12px}
        .diary-block{margin-bottom:12px;padding:12px;background:var(--bg);border-radius:8px}
        .diary-block-title{font-weight:500;color:var(--success);margin-bottom:6px} /* 日记标题使用绿色 */
        .diary-block-content{line-height:1.5}

        .analysis-result{background:var(--bg);border-radius:12px;padding:20px;margin-top:20px;line-height:1.8}
        .analysis-result h4{margin-bottom:12px;color:var(--primary)}
        .analysis-meta{font-size:14px;color:var(--text-secondary);margin-bottom:16px}

        .empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary)}
        .loading{text-align:center;padding:40px;color:var(--text-secondary)}
        .loading::after{content:"";display:inline-block;width:20px;height:20px;border:3px solid var(--border);border-top-color:var(--success);border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
        .modal-content{background:var(--card);border-radius:20px;padding:24px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text)}

        .badge{display:inline-block;padding:4px 8px;border-radius:4px;font-size:12px;background:var(--success);color:white;margin-left:8px} /* 标签使用绿色 */

        .dashboard-card{margin-bottom:30px}
        .dashboard-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .dashboard-actions{display:flex;gap:8px}
        .latest-result{max-height:300px;overflow-y:auto;padding:16px;background:var(--bg);border-radius:12px}

        .goal-input-group{margin-bottom:16px}
        .goal-input-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        .goal-input-label{font-weight:500}
        .goal-no-record{display:flex;align-items:center;gap:6px;cursor:pointer}
        .goal-textarea{min-height:60px}

        .goal-item{display:flex;align-items:center;gap:12px;margin-bottom:12px}
        .goal-item input{flex:1}
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>📘 AI日记分析</h1>
        <div class="top-actions">
            <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
            <button class="icon-btn" id="goalConfigBtn" title="目标配置">🎯</button>
            <button class="icon-btn" id="configBtn" title="AI配置">⚙️</button>
            <button class="icon-btn" id="exportBtn" title="导出所有数据">📤</button>
            <button class="icon-btn" id="importBtn" title="导入备份数据">📥</button>
            <button class="icon-btn" id="restoreBtn" title="恢复上一次备份">🔄</button>
        </div>
    </div>

    <!-- 录入区域 -->
    <div class="card">
        <div class="tabs">
            <button class="tab active" data-entry-tab="goal">🎯 目标打卡记</button>
            <button class="tab" data-entry-tab="free">✍️ 随心随笔记</button>
        </div>

        <!-- 目标打卡记（纯前端保存，无需AI） -->
        <div id="goalEntryTab" class="entry-tab-content">
            <div id="goalInputsContainer"></div>
            <div class="goal-input-group">
                <div class="goal-input-header">
                    <span class="goal-input-label">📝 额外补充（可选）</span>
                </div>
                <textarea class="input textarea goal-textarea" id="extraContent" placeholder="写一些目标之外的零散内容..."></textarea>
            </div>
            <div style="margin-top:20px">
                <!-- 重点：按钮独立ID，JS绑定事件，移动端完全兼容 -->
                <button class="btn btn-primary" id="saveGoalBtn">保存日记</button>
            </div>
        </div>

        <!-- 随心随笔记 -->
        <div id="freeEntryTab" class="entry-tab-content" style="display:none">
            <textarea class="input textarea" id="freeDiaryInput" style="min-height:300px" placeholder="随便写点什么吧，不用有任何格式限制..."></textarea>
            <div style="margin-top:20px;display:flex;gap:12px">
                <button class="btn btn-outline" onclick="saveFreeDiary(false)">仅保存原始文本</button>
                <!-- 随心笔记使用绿色按钮 -->
                <button class="btn btn-success" onclick="saveFreeDiary(true)">保存并AI智能分区</button>
            </div>
        </div>
    </div>

    <!-- 主标签页：分析看板 / 日记列表 -->
    <div class="tabs">
        <button class="tab active" data-main-tab="dashboard">📊 分析看板</button>
        <button class="tab" data-main-tab="diaryList">📝 日记列表</button>
    </div>

    <!-- 分析看板 -->
    <div id="dashboardTab" class="main-tab-content">
        <div class="card dashboard-card">
            <div class="dashboard-header">
                <h3>☀️ 今日分析</h3>
                <div class="dashboard-actions">
                    <button class="btn btn-primary btn-sm" onclick="quickAnalyze('today')">重新分析</button>
                    <button class="btn btn-outline btn-sm" onclick="viewRangeHistory('today')">查看历史</button>
                </div>
            </div>
            <div id="todayResult" class="latest-result">
                <div class="empty-state">还没有今日分析，点击"重新分析"开始</div>
            </div>
        </div>
        <div class="card dashboard-card">
            <div class="dashboard-header">
                <h3>📅 近7天分析</h3>
                <div class="dashboard-actions">
                    <button class="btn btn-primary btn-sm" onclick="quickAnalyze('week')">重新分析</button>
                    <button class="btn btn-outline btn-sm" onclick="viewRangeHistory('week')">查看历史</button>
                </div>
            </div>
            <div id="weekResult" class="latest-result">
                <div class="empty-state">还没有近7天分析，点击"重新分析"开始</div>
            </div>
        </div>
        <div class="card dashboard-card">
            <div class="dashboard-header">
                <h3>📆 近30天分析</h3>
                <div class="dashboard-actions">
                    <button class="btn btn-primary btn-sm" onclick="quickAnalyze('month')">重新分析</button>
                    <button class="btn btn-outline btn-sm" onclick="viewRangeHistory('month')">查看历史</button>
                </div>
            </div>
            <div id="monthResult" class="latest-result">
                <div class="empty-state">还没有近30天分析，点击"重新分析"开始</div>
            </div>
        </div>
        <div class="card dashboard-card">
            <div class="dashboard-header">
                <h3>📈 年度分析（全部）</h3>
                <div class="dashboard-actions">
                    <button class="btn btn-primary btn-sm" onclick="quickAnalyze('all')">重新分析</button>
                    <button class="btn btn-outline btn-sm" onclick="viewRangeHistory('all')">查看历史</button>
                </div>
            </div>
            <div id="allResult" class="latest-result">
                <div class="empty-state">还没有年度分析，点击"重新分析"开始</div>
            </div>
        </div>
    </div>

    <!-- 日记列表 -->
    <div id="diaryListTab" class="main-tab-content" style="display:none">
        <div class="card">
            <h2>日记列表</h2>
            <div style="display:flex;gap:12px;margin-bottom:20px">
                <input type="text" class="input" id="searchInput" placeholder="搜索日记内容或日期..." style="flex:1">
                <select class="select" id="diaryTypeFilter" style="width:150px">
                    <option value="all">全部类型</option>
                    <option value="goal">目标打卡</option>
                    <option value="free">随心随笔</option>
                </select>
            </div>
            <div id="diaryList">
                <div class="empty-state">还没有日记，开始写第一篇吧</div>
            </div>
        </div>
    </div>

    <!-- 自定义分析区域 -->
    <div class="card">
        <h2>自定义分析 <span class="badge">手动触发</span></h2>
        <div class="grid-2">
            <div>
                <label>分析时间范围</label>
                <select class="select" id="timeRange">
                    <option value="single">当前选中日记</option>
                    <option value="today">今日日记</option>
                    <option value="week">近7天日记</option>
                    <option value="month">近30天日记</option>
                    <option value="all">全部日记</option>
                </select>
            </div>
            <div>
                <label>分析视角（可多选）</label>
                <div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" id="selectAll" onchange="toggleSelectAll()"> 全选
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="default"> 默认洞察
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="value"> 价值澄清
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="reverse"> 逆向思考
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="second"> 二阶思考
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="cbt"> CBT疗法
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="mbti"> MBTI分析
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                        <input type="checkbox" name="view" value="custom"> 自定义视角
                    </label>
                </div>
            </div>
        </div>
        <div id="customViewInput" style="margin-top:12px;display:none">
            <input type="text" class="input" id="customView" placeholder="输入额外分析视角">
        </div>
        <div style="margin-top:20px">
            <button class="btn btn-primary" onclick="startAnalysis()">开始AI分析</button>
        </div>
        <div id="analysisResult" style="display:none"></div>
    </div>

    <!-- 目标配置弹窗 -->
    <div id="goalConfigModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🎯 长期目标配置</h2>
                <button class="modal-close" onclick="closeModal('goalConfigModal')">×</button>
            </div>
            <div id="goalConfigList"></div>
            <div style="margin-top:20px;display:flex;gap:12px">
                <button class="btn btn-outline" onclick="addGoalItem()">+ 添加新目标</button>
                <button class="btn btn-primary" onclick="saveGoals()">保存目标</button>
            </div>
        </div>
    </div>

    <!-- AI配置弹窗 -->
    <div id="configModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <h2>AI接口配置</h2>
                <button class="modal-close" onclick="closeModal('configModal')">×</button>
            </div>
            <h3>基础配置</h3>
            <div class="grid-2" style="margin-bottom:16px">
                <div>
                    <label>API 密钥</label>
                    <input type="password" class="input" id="apiKey" placeholder="输入API Key">
                </div>
                <div>
                    <label>API 节点地址</label>
                    <input type="text" class="input" id="apiBase" value="https://api.openai.com/v1">
                </div>
            </div>
            <div class="grid-2" style="margin-bottom:16px">
                <div>
                    <label>模型名称</label>
                    <select class="select" id="modelName">
                        <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
                        <option value="gpt-4">gpt-4</option>
                        <option value="gpt-4-turbo">gpt-4-turbo</option>
                        <option value="gpt-4o">gpt-4o</option>
                        <option value="claude-3-opus-20240229">claude-3-opus</option>
                        <option value="claude-3-sonnet-20240229">claude-3-sonnet</option>
                        <option value="claude-3-haiku-20240307">claude-3-haiku</option>
                        <option value="custom">自定义模型</option>
                    </select>
                    <input type="text" class="input" id="customModel" style="margin-top:8px;display:none" placeholder="自定义模型名">
                </div>
                <div>
                    <label>温度值 (0-2)</label>
                    <input type="number" class="input" id="temperature" value="0.7" min="0" max="2" step="0.1">
                </div>
            </div>
            <div style="margin-bottom:16px">
                <label>最大生成长度 (tokens)</label>
                <input type="number" class="input" id="maxTokens" value="2000" min="100" max="10000">
            </div>
            <h3>提示词配置</h3>
            <div style="margin-bottom:16px">
                <label>日记分析提示词</label>
                <textarea class="input textarea" id="analysisPrompt" style="min-height:200px"></textarea>
            </div>
            <div style="margin-bottom:24px">
                <label>AI分区提示词</label>
                <textarea class="input textarea" id="partitionPrompt" style="min-height:150px"></textarea>
            </div>
            <div style="display:flex;gap:12px;justify-content:flex-end">
                <button class="btn btn-outline" onclick="resetPrompts()">恢复默认</button>
                <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
            </div>
        </div>
    </div>

    <!-- 历史分析弹窗 -->
    <div id="historyModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="historyModalTitle">历史分析记录</h2>
                <button class="modal-close" onclick="closeModal('historyModal')">×</button>
            </div>
            <div id="historyList"></div>
        </div>
    </div>

<script>
// 全局变量
let diaries = [];
let analysisHistory = [];
let goals = [];
let selectedDiaryId = null;
let config = {};

// 安全读取本地数据
function safeLoadData() {
    try { diaries = JSON.parse(localStorage.getItem('diaries')) || []; } catch (e) { diaries = []; }
    try { analysisHistory = JSON.parse(localStorage.getItem('analysisHistory')) || []; } catch (e) { analysisHistory = []; }
    try {
        goals = JSON.parse(localStorage.getItem('goals'));
        if (!goals) goals = ['瘦子增肌','去外地找工作','早睡早起/健康饮食','克服拖延症','攒钱下学期校外租房','自媒体从零起步'];
    } catch (e) {
        goals = ['瘦子增肌','去外地找工作','早睡早起/健康饮食','克服拖延症','攒钱下学期校外租房','自媒体从零起步'];
    }
    try {
        config = JSON.parse(localStorage.getItem('aiConfig'));
        if (!config) initDefaultConfig();
    } catch (e) {
        initDefaultConfig();
    }
}

// 初始化默认AI配置&提示词
function initDefaultConfig() {
    config = {
        apiKey: '', apiBase: 'https://api.openai.com/v1', modelName: 'gpt-3.5-turbo',
        temperature: 0.7, maxTokens: 2000,
        analysisPrompt: `【AI角色】
我是一名在福州读大学的女生，你是我的专属私人日记洞察师，深度了解我的所有自定义长期目标。你精通Flomo全6大洞察视角，客观中立，只讲真话，不做道德评判。
【核心规则】
1. 禁止鸡汤、空洞道理、晦涩术语
2. 建议控制在短句，单条不超过20字
【分析维度】
1.【默认洞察】概括核心内容+3件关键事项
2.【价值澄清】区分符合目标/消耗自身的行为
3.【逆向思考】反向行动的可能性与机会
4.【二阶思考】焦虑、拖延等问题的深层原因
5.【CBT纠偏】纠正负面思维陷阱
6.【MBTI分析】人格特质与行为优缺点
7.【目标追踪】各目标一句话反馈+落地建议
8.【明日清单】最多3条具体行动
输出要求：分模块展示，末尾加3-5个关键词。
{日记内容}`,
        partitionPrompt: `将文本按目标分区，剩余内容归为临时主题，输出标准JSON数组，仅返回JSON：
目标列表：{目标列表}
文本：{文本内容}`
    };
}

// 页面初始化
safeLoadData();
document.addEventListener('DOMContentLoaded', function(){
    initTheme();
    bindTabSwitch();
    renderGoalInputs();
    renderDiaryList();
    renderDashboard();
    loadConfigToForm();

    // 保存按钮事件（核心修复：纯click事件，全浏览器兼容）
    const saveGoalBtn = document.getElementById('saveGoalBtn');
    if(saveGoalBtn) saveGoalBtn.addEventListener('click', saveGoalDiary);

    // 模型切换监听
    document.getElementById('modelName').addEventListener('change', function(){
        document.getElementById('customModel').style.display = this.value === 'custom' ? 'block' : 'none';
    });
    // 自定义视角显示/隐藏

// 禁用/启用输入框
function toggleInput(idx) {
    const chk = document.getElementById(`chk_${idx}`);

// ========== 核心：目标打卡保存（纯前端，无需AI，已彻底修复） ==========
function saveGoalDiary() {
    const blocks = [];
    const count = goals.length;
    // 遍历所有目标
    for(let i = 0; i < count; i++){
        const chk = document.getElementById(`chk_${i}`);
        const txt = document.getElementById(`txt_${i}`);
        const val = txt.value.trim();
        if(!chk.checked && val){
            blocks.push({title: goals[i], content: val});
        }else if(chk.checked){
            blocks.push({title: goals[i], content: '今日无相关记录'});
        }
    }
    // 额外补充
    const extra = document.getElementById('extraContent').value.trim();
    if(extra) blocks.push({title: '额外补充', content: extra});

    if(blocks.length === 0){
        alert('请填写内容 或 勾选「今日无相关记录」');
        return;
    }

    // 生成日记
    const diary = {
        id: Date.now(),
        date: new Date().toLocaleDateString(),
        type: 'goal',
        blocks: blocks,
        rawText: '',
        source: '目标打卡',
        createdAt: new Date().toISOString()
    };
    diaries.unshift(diary);
    saveDiaries();
    renderDiaryList();

    // 清空输入
    for(let i = 0; i < count; i++){
        const chk = document.getElementById(`chk_${i}`);
        const txt = document.getElementById(`txt_${i}`);
        chk.checked = false;
        txt.disabled = false;
        txt.value = '';
        txt.style.opacity = '1';
    }
    document.getElementById('extraContent').value = '';
    alert('✅ 日记保存成功！');
}

// 保存随心笔记
async function saveFreeDiary(needAi) {
    const txt = document.getElementById('freeDiaryInput').value.trim();
    if(!txt){ alert('内容不能为空'); return; }
    let blocks = [];
    if(needAi){
        if(!config.apiKey){
            alert('请先配置AI密钥');
            openModal('configModal');
            return;
        }
        try{
            const btn = document.querySelector('#freeEntryTab .btn-success');
            btn.disabled = true; btn.textContent = '处理中...';
            const prompt = config.partitionPrompt.replace('{目标列表}', goals.join('、')).replace('{文本内容}', txt);
            const res = await callAI(prompt);
            blocks = JSON.parse(res);
        }catch(e){
            alert('AI分区失败，已保存原始内容');
            blocks = [{title:'原始内容', content:txt}];
        }
    }else{
        blocks = [{title:'原始内容', content:txt}];
    }
    const diary = {
        id: Date.now() + Math.random(),
        date: new Date().toLocaleDateString(),
        type: 'free',
        blocks: blocks,
        rawText: txt,
        source: '随心随笔',
        createdAt: new Date().toISOString()
    };
    diaries.unshift(diary);
    saveDiaries();
    renderDiaryList();
    document.getElementById('freeDiaryInput').value = '';
    alert('✅ 日记保存成功！');
    const btn = document.querySelector('#freeEntryTab .btn-success');
    btn.disabled = false; btn.textContent = '保存并AI智能分区';
}

// 数据持久化 + 自动备份
function saveDiaries() {
    localStorage.setItem('diaries_backup', JSON.stringify(diaries));
    localStorage.setItem('diaries', JSON.stringify(diaries));
}

// 渲染日记列表
function renderDiaryList() {
    const kw = document.getElementById('searchInput').value.toLowerCase();
    const type = document.getElementById('diaryTypeFilter').value;
    let list = diaries.filter(d=>{
        const matchKw = d.blocks.some(b=>b.content.toLowerCase().includes(kw)) || d.date.includes(kw);
        const matchType = type === 'all' || d.type === type;
        return matchKw && matchType;
    });
    const wrap = document.getElementById('diaryList');
    if(!list.length){ wrap.innerHTML = '<div class="empty-state">暂无日记</div>'; return; }
    let html = '';
    list.forEach(d=>{
        let pre = '';
        d.blocks.slice(0,2).forEach(b=>{
            pre += `<div class="diary-block"><div class="diary-block-title">【${b.title}】</div><div class="diary-block-content">${b.content.slice(0,100)}${b.content.length>100?'...':''}</div></div>`;
        });
        if(d.blocks.length>2) pre += `<div style="color:var(--text-secondary)">还有${d.blocks.length-2}个区块</div>`;
        html += `
        <div class="diary-item">
            <div class="diary-header"><span class="diary-date">📅 ${d.date}</span><span class="diary-source">${d.source}</span></div>
            ${pre}
            <div class="diary-actions">
                <button class="btn btn-outline btn-sm" onclick="selectDiary(${d.id})">选中分析</button>
                <button class="btn btn-outline btn-sm" onclick="viewDiary(${d.id})">查看全文</button>
                <button class="btn btn-danger btn-sm" onclick="delDiary(${d.id})">删除</button>
            </div>
        </div>`;
    });
    wrap.innerHTML = html;
}
function selectDiary(id){ selectedDiaryId = id; document.getElementById('timeRange').value='single'; alert('已选中该日记'); }
function viewDiary(id){
    const d = diaries.find(x=>x.id===id);
    let txt = d.blocks.map(b=>`【${b.title}】\n${b.content}`).join('\n\n');
    alert(`日期：${d.date}\n\n${txt}`);
}
function delDiary(id){
    if(!confirm('确定删除？')) return;
    diaries = diaries.filter(x=>x.id!==id);
    saveDiaries(); renderDiaryList();
}

// 分析相关
function toggleSelectAll(){
    const all = document.getElementById('selectAll').checked;
    document.querySelectorAll('input[name="view"]').forEach(cb=>cb.checked = all);
    document.getElementById('customViewInput').style.display = all ? 'block' : 'none';
}
function renderDashboard() {
    ['today','week','month','all'].forEach(range=>{
        const item = analysisHistory.find(h=>h.timeRange===range);
        const el = document.getElementById(range+'Result');
        if(item){
            el.innerHTML = `<div class="analysis-meta">更新：${item.createdAt} | ${item.diaryCount}篇</div>
            <div>${marked.parse(item.result.slice(0,500))}${item.result.length>500?'...':''}</div>
            <div style="margin-top:12px;color:var(--text-secondary)">点击查看历史</div>`;
        }else{
            el.innerHTML = '<div class="empty-state">暂无分析记录</div>';
        }
    });
}
async function quickAnalyze(range) {
    if(!config.apiKey){ alert('请配置AI密钥'); openModal('configModal'); return; }
    let target = [];
    const now = new Date();
    const today = now.toLocaleDateString();
    switch(range){
        case 'today': target = diaries.filter(d=>d.date===today); break;
        case 'week': target = diaries.filter(d=>new Date(d.date) >= Date.now()-7*86400000); break;
        case 'month': target = diaries.filter(d=>new Date(d.date) >= Date.now()-30*86400000); break;
        case 'all': target = [...diaries]; break;
    }
    if(target.length === 0){ alert('该范围无日记'); return; }
    const el = document.getElementById(range+'Result');
    el.innerHTML = '<div class="loading">加载中...</div>';
    try{
        const content = target.map(d=>`【${d.date}】\n${d.blocks.map(b=>`【${b.title}】${b.content}`).join('\n')}`).join('\n---\n');
        const prompt = config.analysisPrompt.replace('{日记内容}', content);
        const res = await callAI(prompt);
        analysisHistory.unshift({
            id:Date.now(), view:'综合分析', timeRange:range, diaryCount:target.length,
            result:res, createdAt:new Date().toLocaleString()
        });
        localStorage.setItem('analysisHistory', JSON.stringify(analysisHistory));
        renderDashboard();
        alert('分析完成');
    }catch(e){
        el.innerHTML = `<div style="color:var(--danger)">分析失败</div>`;
    }
}
function viewRangeHistory(range) {
    const list = analysisHistory.filter(h=>h.timeRange===range);
    const wrap = document.getElementById('historyList');
    document.getElementById('historyModalTitle').textContent = 
        range==='today'?'今日历史':range==='week'?'近7天历史':range==='month'?'近30天历史':'全部历史';
    if(!list.length){ wrap.innerHTML='<div class="empty-state">暂无记录</div>'; openModal('historyModal'); return; }
    let html = '';
    list.forEach(item=>{
        html += `<div class="diary-item">
        <div class="diary-header"><span>${item.createdAt}</span><span>${item.diaryCount}篇日记</span></div>
        <div class="diary-preview">${item.result}</div>
        <div class="diary-actions">
            <button class="btn btn-outline btn-sm" onclick="viewHistoryDetail(${item.id})">查看</button>
            <button class="btn btn-danger btn-sm" onclick="delHistory(${item.id})">删除</button>
        </div></div>`;
    });
    wrap.innerHTML = html;
    openModal('historyModal');
}
async function startAnalysis() {
    if(!config.apiKey){ alert('请配置AI密钥'); openModal('configModal'); return; }
    const range = document.getElementById('timeRange').value;
    const cbs = Array.from(document.querySelectorAll('input[name="view"]:checked'));
    if(cbs.length === 0){ alert('至少选择一个视角'); return; }
    let target = [];
    const now = new Date();
    switch(range){
        case 'single': target = diaries.filter(d=>d.id===selectedDiaryId); break;
        case 'today': target = diaries.filter(d=>d.date===now.toLocaleDateString()); break;
        case 'week': target = diaries.filter(d=>new Date(d.date)>=Date.now()-7*86400000); break;
        case 'month': target = diaries.filter(d=>new Date(d.date)>=Date.now()-30*86400000); break;
        case 'all': target = [...diaries]; break;
    }
    if(target.length===0){ alert('无对应日记'); return; }
    const resBox = document.getElementById('analysisResult');
    resBox.style.display = 'block';
    resBox.innerHTML = '<div class="loading">分析中...</div>';
    try{
        const content = target.map(d=>`【${d.date}】\n${d.blocks.map(b=>`【${b.title}】${b.content}`).join('\n')}`).join('\n---\n');
        const prompt = config.analysisPrompt.replace('{日记内容}', content);
        const res = await callAI(prompt);
        resBox.innerHTML = `<div class="analysis-result"><h4>分析结果</h4>${marked.parse(res)}</div>`;
    }catch(e){
        resBox.innerHTML = `<div style="color:var(--danger)">分析失败</div>`;
    }
}
function viewHistoryDetail(id) {
    const item = analysisHistory.find(h=>h.id===id);
    const resBox = document.getElementById('analysisResult');
    resBox.style.display = 'block';
    resBox.innerHTML = `<div class="analysis-result"><h4>历史记录</h4>${marked.parse(item.result)}</div>`;
    closeModal('historyModal');
    document.querySelector('[data-main-tab="dashboard"]').click();
}
function delHistory(id) {
    if(!confirm('删除？')) return;
    analysisHistory = analysisHistory.filter(h=>h.id!==id);
    localStorage.setItem('analysisHistory', JSON.stringify(analysisHistory));
    renderDashboard(); closeModal('historyModal');
}

// AI 请求
async function callAI(prompt) {
    const model = config.modelName === 'custom' ? document.getElementById('customModel').value : config.modelName;
    const res = await fetch(`${config.apiBase}/chat/completions`,{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+config.apiKey},
        body:JSON.stringify({
            model:model, messages:[{role:'user',content:prompt}],
            temperature:Number(config.temperature), max_tokens:Number(config.maxTokens)
        })
    });
    if(!res.ok) throw new Error('接口请求失败');
    const json = await res.json();
    return json.choices[0].message.content;
}

function openModal(id){ document.getElementById(id).style.display = 'flex'; }

// AI 配置读写
function loadConfigToForm() {
    document.getElementById('apiKey').value = config.apiKey || '';
    document.getElementById('apiBase').value = config.apiBase || '';
    document.getElementById('temperature').value = config.temperature || 0.7;
    document.getElementById('maxTokens').value = config.maxTokens || 2000;
    document.getElementById('analysisPrompt').value = config.analysisPrompt || '';
    document.getElementById('partitionPrompt').value = config.partitionPrompt || '';
    const sel = document.getElementById('modelName');
    let found = false;
    for(let i=0;i<sel.options.length;i++){
        if(sel.options[i].value === config.modelName){ sel.selectedIndex = i; found=true; break; }
    }
    if(!found){ sel.value='custom'; document.getElementById('customModel').value=config.modelName; document.getElementById('customModel').style.display='block'; }
}

    const model = document.getElementById('modelName').value === 'custom' ? document.getElementById('customModel').value : document.getElementById('modelName').value;
    config = {
        apiKey:document.getElementById('apiKey').value.trim(),
        apiBase:document.getElementById('apiBase').value.trim(),
        modelName:model,
        temperature:document.getElementById('temperature').value,
        maxTokens:document.getElementById('maxTokens').value,
        analysisPrompt:document.getElementById('analysisPrompt').value,
        partitionPrompt:document.getElementById('partitionPrompt').value
    };
    localStorage.setItem('aiConfig', JSON.stringify(config));
    alert('配置保存成功'); closeModal('configModal');
}
function resetPrompts() {
    if(!confirm('恢复默认提示词？')) return;
    initDefaultConfig(); loadConfigToForm();
}

// 数据导出/导入/恢复
document.getElementById('exportBtn').addEventListener('click', ()=>{
    const data = {diaries,analysisHistory,goals,time:new Date().toLocaleString()};
    const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `日记备份_${new Date().toLocaleDateString()}.json`;
    a.click(); URL.revokeObjectURL(a.href);
});
document.getElementById('importBtn').addEventListener('click', ()=>{
    if(!confirm('导入会合并数据，继续？')) return;
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='.json';
    inp.onchange = e=>{
        const fr = new FileReader();
        fr.onload = ev=>{
            try{
                const d = JSON.parse(ev.target.result);
                let add = 0;
                if(d.diaries){
                    const ids = new Set(diaries.map(x=>x.id));
                    d.diaries.forEach(item=>{ if(!ids.has(item.id)){ diaries.unshift(item); add++; } });
                }
                if(d.analysisHistory){
                    const ids = new Set(analysisHistory.map(x=>x.id));
                    d.analysisHistory.forEach(item=>{ if(!ids.has(item.id)){ analysisHistory.unshift(item); add++; } });
                }
                if(d.goals && goals.length===0) goals = d.goals;
                saveDiaries(); localStorage.setItem('analysisHistory',JSON.stringify(analysisHistory));
                renderDiaryList(); renderDashboard(); renderGoalInputs();
                alert(`导入成功，新增${add}条数据`);
            }catch(err){ alert('文件格式错误'); }
        };
        fr.readAsText(e.target.files[0]);
    };
    inp.click();
});
document.getElementById('restoreBtn').addEventListener('click', ()=>{
    if(!confirm('恢复上一次备份，当前数据会被覆盖？')) return;
    const bak = localStorage.getItem('diaries_backup');
    if(!bak){ alert('无备份记录'); return; }
    diaries = JSON.parse(bak);
    saveDiaries(); renderDiaryList();
    alert('恢复成功');
});
