<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI日记分析</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#FFF0F5;--card:#FFFFFF;--text:#5A4B5A;--text-secondary:#9A8B9A;
            --border:#FFD1DC;--primary:#FFB7C5;--primary-hover:#FF9AAE;--danger:#FF8A80;
            --success:#A8D8B9;--success-light:#D4EDDA;--shadow:0 2px 12px rgba(255,183,197,0.2);
            --font:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',cursive,sans-serif;
        }
        .dark{
            --bg:#3A2D34;--card:#4A3D44;--text:#FDE8EC;--text-secondary:#C9B8BE;
            --border:#6A5760;--primary:#F8BBD0;--primary-hover:#F48FB1;--danger:#EF9A9A;
            --success:#80CBC4;--success-light:#375B5B;--shadow:0 2px 12px rgba(0,0,0,0.3);
        }
        body{background:var(--bg);color:var(--text);font-family:var(--font);padding:20px;max-width:1000px;margin:0 auto;transition:all 0.3s ease;font-size:16px}
        .card{border-radius:24px}.input,.select,.btn{border-radius:16px;font-family:var(--font)}
        .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .top-bar h1{font-size:30px;color:var(--primary);display:flex;align-items:center;gap:8px}
        .top-actions{display:flex;gap:12px;align-items:center}
        .icon-btn{background:transparent;border:none;font-size:24px;cursor:pointer;color:var(--text);padding:8px;border-radius:12px;transition:background 0.2s}
        .icon-btn:hover{background:var(--border)}
        .card{background:var(--card);padding:24px;margin-bottom:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
        .card h2{font-size:24px;margin-bottom:16px;color:var(--text)}
        .card h3{font-size:20px;margin:12px 0 8px;color:var(--text)}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        @media (max-width:768px){.grid-2{grid-template-columns:1fr}}
        .input{width:100%;padding:12px 16px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;outline:none;transition:border-color 0.2s}
        .input:focus{border-color:var(--success)}
        .textarea{min-height:120px;resize:vertical;line-height:1.6}
        .select{width:100%;padding:12px 16px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;cursor:pointer;border-radius:16px}
        .btn{padding:10px 20px;border:none;font-size:16px;font-weight:bold;cursor:pointer;transition:all 0.2s;letter-spacing:1px}
        .btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:var(--primary-hover)}
        .btn-danger{background:var(--danger);color:white}.btn-success{background:var(--success);color:white}
        .btn-outline{background:transparent;border:2px solid var(--border);color:var(--text)}.btn-outline:hover{background:var(--border)}
        .btn-sm{padding:6px 14px;font-size:14px}
        .tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid var(--border);padding-bottom:8px}
        .tab{padding:8px 20px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-radius:20px;font-size:18px;font-weight:bold;transition:all 0.2s}
        .tab.active{background:var(--primary);color:white}
        .diary-item{border-bottom:1px solid var(--border);padding:16px 0;display:flex;align-items:flex-start;gap:12px}
        .diary-item:last-child{border-bottom:none}
        .diary-checkbox{width:20px;height:20px;margin-top:4px;cursor:pointer;accent-color:var(--success)}
        .diary-body{flex:1}.diary-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        .diary-date{font-weight:bold;color:var(--text)}.diary-source{font-size:14px;color:var(--text-secondary);background:var(--bg);padding:2px 10px;border-radius:12px}
        .diary-preview{color:var(--text-secondary);line-height:1.5}
        .diary-actions{display:flex;gap:8px;margin-top:12px}
        .diary-block{margin-bottom:12px;padding:12px;background:var(--bg);border-radius:16px}
        .diary-block-title{font-weight:bold;color:var(--primary);margin-bottom:6px}
        .analysis-result{background:var(--bg);border-radius:20px;padding:20px;margin-top:20px;line-height:1.8}
        .empty-state{text-align:center;padding:40px;color:var(--text-secondary)}
        .loading{text-align:center;padding:40px}
        .loading::after{content:"";display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--success);border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
        .modal-content{background:var(--card);border-radius:24px;padding:24px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .modal-close{background:none;border:none;font-size:28px;cursor:pointer;color:var(--text)}
        .badge{display:inline-block;padding:4px 12px;border-radius:12px;font-size:14px;background:var(--success);color:white;margin-left:8px}
        .batch-actions{display:flex;gap:8px;margin-bottom:12px;align-items:center}
        .goal-input-group{margin-bottom:16px}.goal-input-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        .goal-no-record{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
        .date-picker{display:flex;align-items:center;gap:8px;margin-bottom:16px;background:var(--success-light);padding:8px 12px;border-radius:12px}
        .date-picker input{border:none;background:transparent;color:var(--text);font-size:16px;font-family:var(--font)}
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>🌸 AI日记分析</h1>
        <div class="top-actions">
            <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
            <button class="icon-btn" id="goalConfigBtn" title="目标配置">🎯</button>
            <button class="icon-btn" id="configBtn" title="设置">⚙️</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" data-main-tab="record">📝 记录日记</button>
        <button class="tab" data-main-tab="analyze">📊 分析日记</button>
    </div>

    <div id="recordTab" class="main-tab-content">
        <div class="date-picker"><span>📅 日记日期：</span><input type="date" id="diaryDate"></div>
        <div class="tabs">
            <button class="tab active" data-entry-tab="goal">🎯 目标打卡记</button>
            <button class="tab" data-entry-tab="free">✍️ 随心记</button>
        </div>
        <div id="goalEntryTab" class="entry-tab-content">
            <div id="goalInputsContainer"></div>
            <div class="goal-input-group">
                <div class="goal-input-header"><span>📝 额外补充（可选）</span></div>
                <textarea class="input textarea goal-textarea" id="extraContent" placeholder="写一些目标之外的零散内容..."></textarea>
            </div>
            <div style="margin-top:20px"><button class="btn btn-primary" id="saveGoalBtn">💾 保存日记</button></div>
        </div>
        <div id="freeEntryTab" class="entry-tab-content" style="display:none">
            <textarea class="input textarea" id="freeDiaryInput" style="min-height:300px" placeholder="随便写点什么吧，不用有任何格式限制..."></textarea>
            <div style="margin-top:20px;display:flex;gap:12px">
                <button class="btn btn-outline" onclick="saveFreeDiary(false)">仅保存原始文本</button>
                <button class="btn btn-primary" onclick="saveFreeDiary(true)">✨ 保存并AI智能分区</button>
            </div>
        </div>
    </div>

    <div id="analyzeTab" class="main-tab-content" style="display:none">
        <div class="card"><div class="dashboard-header"><h3>☀️ 今日分析</h3><div><button class="btn btn-success btn-sm" onclick="quickAnalyze('today')">重新分析</button><button class="btn btn-outline btn-sm" onclick="viewRangeHistory('today')">查看历史</button></div></div><div id="todayResult" class="latest-result"><div class="empty-state">还没有今日分析</div></div></div>
        <div class="card"><div class="dashboard-header"><h3>📅 近7天分析</h3><div><button class="btn btn-success btn-sm" onclick="quickAnalyze('week')">重新分析</button><button class="btn btn-outline btn-sm" onclick="viewRangeHistory('week')">查看历史</button></div></div><div id="weekResult" class="latest-result"><div class="empty-state">还没有近7天分析</div></div></div>
        <div class="card"><div class="dashboard-header"><h3>📆 近30天分析</h3><div><button class="btn btn-success btn-sm" onclick="quickAnalyze('month')">重新分析</button><button class="btn btn-outline btn-sm" onclick="viewRangeHistory('month')">查看历史</button></div></div><div id="monthResult" class="latest-result"><div class="empty-state">还没有近30天分析</div></div></div>
        <div class="card"><div class="dashboard-header"><h3>📈 年度分析</h3><div><button class="btn btn-success btn-sm" onclick="quickAnalyze('all')">重新分析</button><button class="btn btn-outline btn-sm" onclick="viewRangeHistory('all')">查看历史</button></div></div><div id="allResult" class="latest-result"><div class="empty-state">还没有年度分析</div></div></div>

        <div class="card">
            <h2>📚 日记列表</h2>
            <div style="display:flex;gap:12px;margin-bottom:12px">
                <input type="text" class="input" id="searchInput" placeholder="搜索内容或日期..." style="flex:1">
                <select class="select" id="diaryTypeFilter" style="width:140px"><option value="all">全部</option><option value="goal">目标打卡</option><option value="free">随心记</option></select>
            </div>
            <div id="batchBar" class="batch-actions" style="display:none">
                <span id="selectedCount" style="color:var(--success);font-weight:bold">已选0篇</span>
                <button class="btn btn-outline btn-sm" onclick="toggleSelectAll()">全选</button>
                <button class="btn btn-outline btn-sm" onclick="clearSelection()">取消</button>
                <button class="btn btn-danger btn-sm" onclick="batchDelete()">🗑️ 批量删除</button>
            </div>
            <div id="diaryList"><div class="empty-state">还没有日记</div></div>
        </div>

        <div class="card">
            <h2>🔍 自定义分析 <span class="badge">手动</span></h2>
            <div class="grid-2">
                <div><label>时间范围</label><select class="select" id="timeRange"><option value="single">选中日记</option><option value="today">今日</option><option value="week">近7天</option><option value="month">近30天</option><option value="all">全部</option></select></div>
                <div>
                    <label>分析视角</label>
                    <div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
                        <label><input type="checkbox" id="selectAll" onchange="toggleAllViews()"> 全选（内置）</label>
                        <label><input type="checkbox" name="view" value="default"> 默认洞察</label>
                        <label><input type="checkbox" name="view" value="value"> 价值澄清</label>
                        <label><input type="checkbox" name="view" value="reverse"> 逆向思考</label>
                        <label><input type="checkbox" name="view" value="second"> 二阶思考</label>
                        <label><input type="checkbox" name="view" value="cbt"> CBT疗法</label>
                        <label><input type="checkbox" name="view" value="mbti"> MBTI分析</label>
                        <label><input type="checkbox" name="view" value="custom"> 自定义视角</label>
                    </div>
                </div>
            </div>
            <div id="customViewInput" style="margin-top:12px;display:none"><input type="text" class="input" id="customView" placeholder="输入自定义视角"></div>
            <div style="margin-top:20px"><button class="btn btn-success" onclick="startAnalysis()">✨ 开始分析</button></div>
            <div id="analysisResult" style="display:none"></div>
        </div>
    </div>

    <div id="goalConfigModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header"><h2>🎯 长期目标配置</h2><button class="modal-close" onclick="closeModal('goalConfigModal')">×</button></div>
            <div id="goalConfigList"></div>
            <div style="margin-top:20px;display:flex;gap:12px"><button class="btn btn-outline" onclick="addGoalItem()">+ 添加</button><button class="btn btn-primary" onclick="saveGoals()">💾 保存</button></div>
        </div>
    </div>

    <div id="configModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header"><h2>⚙️ 设置</h2><button class="modal-close" onclick="closeModal('configModal')">×</button></div>
            <h3>AI接口</h3>
            <div class="grid-2"><div><label>API Key</label><input type="password" class="input" id="apiKey"></div><div><label>节点地址</label><input type="text" class="input" id="apiBase" value="https://api.openai.com/v1"></div></div>
            <div class="grid-2"><div><label>模型</label><select class="select" id="modelName"><option value="gpt-3.5-turbo">gpt-3.5-turbo</option><option value="gpt-4o">gpt-4o</option><option value="custom">自定义</option></select><input type="text" class="input" id="customModel" placeholder="自定义模型名" style="margin-top:8px;display:none"></div><div><label>温度</label><input type="number" class="input" id="temperature" value="0.7" step="0.1"></div></div>
            <div><label>Tokens</label><input type="number" class="input" id="maxTokens" value="2000"></div>
            <h3>提示词</h3>
            <textarea class="input textarea" id="analysisPrompt" style="min-height:150px"></textarea>
            <textarea class="input textarea" id="partitionPrompt" style="min-height:100px;margin-top:8px"></textarea>
            <div style="margin:12px 0"><button class="btn btn-outline" onclick="resetPrompts()">恢复默认</button><button class="btn btn-primary" onclick="saveConfig()">💾 保存AI配置</button></div>
            <h3>💾 数据管理</h3>
            <div style="display:flex;gap:12px"><button class="btn btn-success" id="exportBtn">📤 导出</button><button class="btn btn-success" id="importBtn">📥 导入</button><button class="btn btn-outline" id="restoreBtn">🔄 恢复</button></div>
        </div>
    </div>

    <div id="historyModal" class="modal" style="display:none">
        <div class="modal-content"><div class="modal-header"><h2 id="historyModalTitle">历史</h2><button class="modal-close" onclick="closeModal('historyModal')">×</button></div><div id="historyList"></div></div>
    </div>

    <div id="editModal" class="modal" style="display:none">
        <div class="modal-content"><div class="modal-header"><h2>✏️ 编辑日记</h2><button class="modal-close" onclick="closeModal('editModal')">×</button></div><div id="editContent"></div><div style="margin-top:20px"><button class="btn btn-outline" onclick="closeModal('editModal')">取消</button><button class="btn btn-primary" id="saveEditBtn">💾 保存修改</button></div></div>
    </div>

<script>
// 安全工具
function isValidDiary(d) { return d && typeof d === 'object' && Array.isArray(d.blocks); }
function getValidDiaries() { return Array.isArray(diaries) ? diaries.filter(isValidDiary) : []; }
function safeBlocks(d) { return isValidDiary(d) ? d.blocks : []; }

let diaries = [], analysisHistory = [], goals = [], selectedDiaryId = null, config = {}, editingDiaryId = null, selectedIds = new Set();

function getFullDefaultAnalysisPrompt() { return "【AI角色】\n我是福州在读女生...\n（详细提示词见配置）\n{日记内容}"; }
function getFullDefaultPartitionPrompt() { return "将以下文本按目标分区...\n{目标列表}\n{文本内容}"; }

function safeLoadData() {
    try { diaries = JSON.parse(localStorage.getItem('diaries')||'[]'); if(!Array.isArray(diaries)) diaries=[]; diaries=diaries.filter(isValidDiary); } catch(e){ diaries=[]; }
    try { analysisHistory = JSON.parse(localStorage.getItem('analysisHistory')||'[]'); } catch(e){ analysisHistory=[]; }
    try { goals = JSON.parse(localStorage.getItem('goals')||'["瘦子增肌","去外地找工作","早睡早起","克服拖延症","攒钱租房","自媒体"]'); } catch(e){ goals=["瘦子增肌","去外地找工作","早睡早起","克服拖延症","攒钱租房","自媒体"]; }
    try {
        config = JSON.parse(localStorage.getItem('aiConfig'));
        if(!config) config = { apiKey:'', apiBase:'https://api.openai.com/v1', modelName:'gpt-3.5-turbo', temperature:0.7, maxTokens:2000, analysisPrompt:getFullDefaultAnalysisPrompt(), partitionPrompt:getFullDefaultPartitionPrompt() };
    } catch(e){ config = { apiKey:'', apiBase:'https://api.openai.com/v1', modelName:'gpt-3.5-turbo', temperature:0.7, maxTokens:2000, analysisPrompt:getFullDefaultAnalysisPrompt(), partitionPrompt:getFullDefaultPartitionPrompt() }; }
}
safeLoadData();

// 主题
function initTheme() {
    if(localStorage.getItem('theme')==='dark'){ document.body.classList.add('dark'); document.getElementById('themeBtn').textContent='☀️'; }
    document.getElementById('themeBtn').onclick = () => {
        document.body.classList.toggle('dark');
        localStorage.setItem('theme', document.body.classList.contains('dark')?'dark':'light');
        document.getElementById('themeBtn').textContent = document.body.classList.contains('dark')?'☀️':'🌙';
    };
}

// 标签页
function initTabs() {
    document.querySelectorAll('[data-main-tab]').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('[data-main-tab]').forEach(t=>t.classList.remove('active'));
            document.querySelectorAll('.main-tab-content').forEach(c=>c.style.display='none');
            tab.classList.add('active');
            document.getElementById(tab.dataset.mainTab+'Tab').style.display='block';
        });
    });
    document.querySelectorAll('[data-entry-tab]').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('[data-entry-tab]').forEach(t=>t.classList.remove('active'));
            document.querySelectorAll('.entry-tab-content').forEach(c=>c.style.display='none');
            tab.classList.add('active');
            document.getElementById(tab.dataset.entryTab+'EntryTab').style.display='block';
        });
    });
}

// 日期默认今天
function setDefaultDate() {
    const d = new Date();
    const dateStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    document.getElementById('diaryDate').value = dateStr;
}

// 目标输入框
function renderGoalInputs() {
    const container = document.getElementById('goalInputsContainer');
    container.innerHTML = '';
    goals.forEach((goal,i) => {
        container.innerHTML += `
        <div class="goal-input-group">
            <div class="goal-input-header"><span>🎯 ${goal}</span><label class="goal-no-record"><input type="checkbox" onchange="toggleGoalInput(${i})"> 今日无记录</label></div>
            <textarea class="input textarea goal-textarea" id="goalInput${i}" placeholder="记录今天关于「${goal}」的进展..."></textarea>
        </div>`;
    });
}
function toggleGoalInput(i) {
    const cb = document.getElementById('goalNoRecord'+i);
    const ta = document.getElementById('goalInput'+i);
    ta.disabled = cb.checked; ta.style.opacity = cb.checked?'0.5':'1';
    if(cb.checked) ta.value='';
}

function getSelectedDate() { return document.getElementById('diaryDate').value; }

// 保存日记
function saveGoalDiary() {
    const groups = document.querySelectorAll('#goalInputsContainer .goal-input-group');
    const blocks = [];
    groups.forEach((group, idx) => {
        const cb = group.querySelector('input[type="checkbox"]');
        const ta = group.querySelector('textarea');
        if(!cb.checked && ta.value.trim()) blocks.push({title:goals[idx], content:ta.value.trim()});
        else if(cb.checked) blocks.push({title:goals[idx], content:'今日无相关记录'});
    });
    const extra = document.getElementById('extraContent').value.trim();
    if(extra) blocks.push({title:'额外补充', content:extra});
    if(blocks.length===0) return alert('请至少填写一个目标');

    diaries.unshift({
        id: Date.now(),
        date: getSelectedDate(),
        type:'goal', blocks, rawText:'', source:'目标打卡', createdAt: new Date().toISOString()
    });
    saveDiaries();
    renderDiaryList();
    groups.forEach((group,i) => {
        group.querySelector('input[type="checkbox"]').checked = false;
        const ta = group.querySelector('textarea'); ta.disabled = false; ta.value = ''; ta.style.opacity = '1';
    });
    document.getElementById('extraContent').value = '';
    alert('日记保存成功！');
}

async function saveFreeDiary(needPartition) {
    const raw = document.getElementById('freeDiaryInput').value.trim();
    if(!raw) return alert('内容不能为空');
    let blocks = [];
    if(needPartition) {
        if(!config.apiKey) return alert('请先配置AI密钥');
        const btn = document.querySelector('#freeEntryTab .btn-primary');
        btn.disabled = true; btn.textContent = '分区中...';
        try {
            const prompt = config.partitionPrompt.replace('{目标列表}', goals.join('、')).replace('{文本内容}', raw);
            const res = await callAI(prompt);
            blocks = JSON.parse(res);
        } catch(e) { alert('AI分区失败，已保存原始文本'); blocks = [{title:'原始内容', content:raw}]; }
        btn.disabled = false; btn.textContent = '✨ 保存并AI智能分区';
    } else blocks = [{title:'原始内容', content:raw}];
    diaries.unshift({
        id: Date.now()+Math.random(),
        date: getSelectedDate(),
        type:'free', blocks, rawText:raw, source:'随心记', createdAt: new Date().toISOString()
    });
    saveDiaries();
    renderDiaryList();
    document.getElementById('freeDiaryInput').value = '';
    alert('日记保存成功！');
}

function saveDiaries() {
    localStorage.setItem('diaries_backup', JSON.stringify(diaries));
    localStorage.setItem('diaries', JSON.stringify(diaries));
}

// 目标配置
function renderGoalConfigList() {
    document.getElementById('goalConfigList').innerHTML = goals.map((g,i) => `<div class="goal-item"><input type="text" class="input" value="${g}"><button class="btn btn-danger btn-sm" onclick="removeGoalItem(${i})">删除</button></div>`).join('');
}
function addGoalItem() { goals.push('新目标'); renderGoalConfigList(); }
function removeGoalItem(i) { if(goals.length<=1) return alert('至少保留一个'); goals.splice(i,1); renderGoalConfigList(); }
function saveGoals() {
    goals = Array.from(document.querySelectorAll('#goalConfigList .goal-item input')).map(i=>i.value.trim()).filter(v=>v);
    if(!goals.length) return alert('至少保留一个');
    localStorage.setItem('goals', JSON.stringify(goals));
    renderGoalInputs(); closeModal('goalConfigModal'); alert('目标已保存');
}

// 日记列表
function renderDiaryList() {
    const valid = getValidDiaries();
    const kw = document.getElementById('searchInput').value.toLowerCase();
    const type = document.getElementById('diaryTypeFilter').value;
    let list = valid.filter(d => {
        const matchKw = safeBlocks(d).some(b => b?.content?.toLowerCase().includes(kw)) || (d.date||'').includes(kw);
        return matchKw && (type==='all' || d.type===type);
    });
    const wrap = document.getElementById('diaryList');
    if(!list.length) { wrap.innerHTML = '<div class="empty-state">没有匹配日记</div>'; updateBatchBar(); return; }
    wrap.innerHTML = list.map(d => {
        const blocks = safeBlocks(d);
        let preview = blocks.slice(0,2).map(b => `<div class="diary-block"><div class="diary-block-title">【${b.title||''}】</div><div>${(b.content||'').slice(0,100)}${b.content&&b.content.length>100?'...':''}</div></div>`).join('');
        if(blocks.length>2) preview += `<div>还有${blocks.length-2}个区块...</div>`;
        return `<div class="diary-item">
            <input type="checkbox" class="diary-checkbox" data-id="${d.id}" ${selectedIds.has(d.id)?'checked':''} onchange="toggleSelectDiary(${d.id},this.checked)">
            <div class="diary-body"><div class="diary-header"><span>📅 ${d.date}</span><span class="diary-source">${d.source}</span></div>${preview}
            <div class="diary-actions"><button class="btn btn-outline btn-sm" onclick="selectDiary(${d.id})">分析</button><button class="btn btn-outline btn-sm" onclick="viewDiary(${d.id})">查看</button><button class="btn btn-outline btn-sm" onclick="editDiary(${d.id})">编辑</button><button class="btn btn-danger btn-sm" onclick="deleteDiary(${d.id})">删除</button></div></div></div>`;
    }).join('');
    updateBatchBar();
}
function toggleSelectDiary(id, checked) { if(checked) selectedIds.add(id); else selectedIds.delete(id); updateBatchBar(); }
function toggleSelectAll() {
    const boxes = document.querySelectorAll('.diary-checkbox');
    const allChecked = Array.from(boxes).every(cb=>cb.checked);
    boxes.forEach(cb => { cb.checked = !allChecked; const id = Number(cb.dataset.id); if(!allChecked) selectedIds.add(id); else selectedIds.delete(id); });
    updateBatchBar();
}
function clearSelection() { selectedIds.clear(); document.querySelectorAll('.diary-checkbox').forEach(cb=>cb.checked=false); updateBatchBar(); }
function batchDelete() {
    if(selectedIds.size===0) return;
    if(!confirm(`确定删除选中的 ${selectedIds.size} 篇？`)) return;
    diaries = diaries.filter(d => !selectedIds.has(d.id));
    selectedIds.clear(); saveDiaries(); renderDiaryList();
}
function updateBatchBar() {
    const bar = document.getElementById('batchBar'), count = document.getElementById('selectedCount');
    if(selectedIds.size>0) { bar.style.display='flex'; count.textContent = `已选 ${selectedIds.size} 篇`; }
    else bar.style.display='none';
}
function deleteDiary(id) { if(!confirm('删除这篇日记？')) return; diaries = diaries.filter(d=>d.id!==id); saveDiaries(); renderDiaryList(); }
function selectDiary(id) { selectedDiaryId = id; document.getElementById('timeRange').value='single'; alert('已选中'); }
function viewDiary(id) {
    const d = diaries.find(x=>x.id===id);
    if(!isValidDiary(d)) return alert('数据损坏');
    alert(`日期:${d.date}\n\n${safeBlocks(d).map(b=>`【${b.title||''}】\n${b.content||''}`).join('\n\n')}`);
}

// 编辑日记
function editDiary(id) {
    const d = diaries.find(x=>x.id===id);
    if(!isValidDiary(d)) return alert('数据损坏');
    editingDiaryId = id;
    if(d.type==='goal') {
        const blockMap = {}; safeBlocks(d).forEach(b => { if(b.title) blockMap[b.title]=b.content; });
        let html = goals.map((goal,i) => {
            const val = blockMap[goal]||'', noRecord = val==='今日无相关记录';
            return `<div class="goal-input-group"><div class="goal-input-header"><span>🎯 ${goal}</span><label class="goal-no-record"><input type="checkbox" onchange="toggleEditGoalRecord(${i})" ${noRecord?'checked':''}> 无记录</label></div><textarea class="input textarea" id="editGoalInput${i}" ${noRecord?'disabled style="opacity:0.5"':''}>${noRecord?'':val}</textarea></div>`;
        }).join('');
        html += `<div class="goal-input-group"><span>📝 额外补充</span><textarea class="input textarea" id="editExtra">${blockMap['额外补充']||''}</textarea></div>`;
        document.getElementById('editContent').innerHTML = html;
    } else {
        document.getElementById('editContent').innerHTML = `<textarea class="input textarea" id="editFreeInput" style="min-height:200px">${d.rawText||''}</textarea>`;
    }
    openModal('editModal');
}
function toggleEditGoalRecord(i) {
    const cb = event.target, ta = document.getElementById('editGoalInput'+i);
    ta.disabled = cb.checked; ta.style.opacity = cb.checked?'0.5':'1';
    if(cb.checked) ta.value='';
}
document.getElementById('saveEditBtn').addEventListener('click', () => {
    if(!editingDiaryId) return;
    const d = diaries.find(x=>x.id===editingDiaryId);
    if(!d) return;
    if(d.type==='goal') {
        const blocks = [];
        goals.forEach((goal,i) => {
            const group = document.getElementById('editGoalInput'+i)?.closest('.goal-input-group');
            const cb = group?.querySelector('input[type="checkbox"]');
            const ta = document.getElementById('editGoalInput'+i);
            if(cb && ta) {
                if(!cb.checked && ta.value.trim()) blocks.push({title:goal, content:ta.value.trim()});
                else if(cb.checked) blocks.push({title:goal, content:'今日无相关记录'});
            }
        });
        const extra = document.getElementById('editExtra')?.value.trim();
        if(extra) blocks.push({title:'额外补充', content:extra});
        if(blocks.length===0) return alert('请至少填写一项');
        d.blocks = blocks;
    } else {
        const newRaw = document.getElementById('editFreeInput')?.value.trim();
        if(!newRaw) return alert('内容不能为空');
        d.rawText = newRaw; d.blocks = [{title:'原始内容', content:newRaw}];
    }
    saveDiaries(); renderDiaryList(); closeModal('editModal'); editingDiaryId=null; alert('已更新');
});

// 视角全选
function toggleAllViews() {
    const checked = document.getElementById('selectAll').checked;
    document.querySelectorAll('input[name="view"]').forEach(cb => { if(cb.value!=='custom') cb.checked = checked; });
    document.querySelector('input[name="view"][value="custom"]').checked = false;
    document.getElementById('customViewInput').style.display = 'none';
}
document.addEventListener('change', e => {
    if(e.target.name==='view' && e.target.value==='custom') document.getElementById('customViewInput').style.display = e.target.checked?'block':'none';
});

// 看板
function renderDashboard() {
    ['today','week','month','all'].forEach(range => {
        const latest = analysisHistory.filter(h=>h&&h.timeRange===range)[0];
        const el = document.getElementById(range+'Result');
        if(latest) el.innerHTML = `<div>${latest.createdAt} | ${latest.diaryCount}篇</div><div>${marked.parse(latest.result.slice(0,300))}...</div>`;
        else el.innerHTML = '<div class="empty-state">暂无分析</div>';
    });
}
async function quickAnalyze(range) {
    if(!config.apiKey) { openModal('configModal'); return alert('请配置AI密钥'); }
    let target; const now = new Date();
    if(range==='today') target = diaries.filter(d=>d.date===now.toLocaleDateString());
    else if(range==='week') target = diaries.filter(d=>new Date(d.date) >= new Date(now.getTime()-7*86400000));
    else if(range==='month') target = diaries.filter(d=>new Date(d.date) >= new Date(now.getTime()-30*86400000));
    else target = [...diaries];
    target = target.filter(isValidDiary);
    if(!target.length) return alert('无有效日记');
    const text = target.map(d => `【${d.date}】\n${safeBlocks(d).map(b=>`【${b.title}】${b.content}`).join('\n')}`).join('\n---\n');
    document.getElementById(range+'Result').innerHTML = '<div class="loading">分析中...</div>';
    try {
        const prompt = config.analysisPrompt.replace('我的所有自定义长期目标', goals.join('、')).replace('{日记内容}', text);
        const res = await callAI(prompt);
        analysisHistory.unshift({ id:Date.now(), view:'默认全视角', timeRange:range, diaryCount:target.length, result:res, createdAt:new Date().toLocaleString() });
        localStorage.setItem('analysisHistory', JSON.stringify(analysisHistory));
        renderDashboard(); alert('分析完成');
    } catch(e) { document.getElementById(range+'Result').innerHTML = `<div style="color:red">失败：${e.message}</div>`; }
}

async function startAnalysis() {
    if(!config.apiKey) { openModal('configModal'); return alert('请配置AI密钥'); }
    const range = document.getElementById('timeRange').value;
    const views = Array.from(document.querySelectorAll('input[name="view"]:checked')).map(cb=>cb.value);
    if(!views.length) return alert('请勾选视角');
    let target; const now = new Date();
    if(range==='single') { if(!selectedDiaryId) return alert('请选中日记'); target = diaries.filter(d=>d.id===selectedDiaryId); }
    else if(range==='today') target = diaries.filter(d=>d.date===now.toLocaleDateString());
    else if(range==='week') target = diaries.filter(d=>new Date(d.date) >= new Date(now.getTime()-7*86400000));
    else if(range==='month') target = diaries.filter(d=>new Date(d.date) >= new Date(now.getTime()-30*86400000));
    else target = [...diaries];
    target = target.filter(isValidDiary);
    if(!target.length) return alert('无有效日记');
    const text = target.map(d => `【${d.date}】\n${safeBlocks(d).map(b=>`【${b.title}】${b.content}`).join('\n')}`).join('\n---\n');
    document.getElementById('analysisResult').style.display='block';
    document.getElementById('analysisResult').innerHTML = '<div class="loading">分析中...</div>';
    try {
        const prompt = config.analysisPrompt.replace('我的所有自定义长期目标', goals.join('、')).replace('{日记内容}', text);
        const res = await callAI(prompt);
        analysisHistory.unshift({ id:Date.now(), view:views.join('、'), timeRange:range, diaryCount:target.length, result:res, createdAt:new Date().toLocaleString() });
        localStorage.setItem('analysisHistory', JSON.stringify(analysisHistory));
        if(range!=='single') renderDashboard();
        document.getElementById('analysisResult').innerHTML = `<div>${marked.parse(res)}</div><button onclick="copyResult()">复制</button>`;
    } catch(e) { document.getElementById('analysisResult').innerHTML = `<div style="color:red">失败：${e.message}</div>`; }
}

async function callAI(prompt) {
    const model = config.modelName==='custom' ? document.getElementById('customModel').value : config.modelName;
    const res = await fetch(`${config.apiBase}/chat/completions`, {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${config.apiKey}`},
        body: JSON.stringify({ model, messages:[{role:'user',content:prompt}], temperature:Number(config.temperature), max_tokens:Number(config.maxTokens) })
    });
    if(!res.ok) throw new Error((await res.json()).error?.message||'请求失败');
    return (await res.json()).choices[0].message.content;
}
function copyResult() { const t = document.querySelector('#analysisResult div:first-child')?.innerText; if(t) navigator.clipboard.writeText(t).then(()=>alert('已复制')); }

// 历史
function viewRangeHistory(range) {
    const list = analysisHistory.filter(h=>h.timeRange===range);
    document.getElementById('historyModalTitle').textContent = `${range} 历史`;
    document.getElementById('historyList').innerHTML = list.length ? list.map(h=>`<div>${h.createdAt} | ${h.result.slice(0,100)}</div>`).join('') : '暂无记录';
    openModal('historyModal');
}

// 弹窗
function openModal(id) { document.getElementById(id).style.display='flex'; }
function closeModal(id) { document.getElementById(id).style.display='none'; }
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if(e.target===m) m.style.display='none'; }));

// 配置与数据管理
document.getElementById('configBtn').onclick = () => { loadConfigToForm(); openModal('configModal'); };
document.getElementById('goalConfigBtn').onclick = () => { renderGoalConfigList(); openModal('goalConfigModal'); };
function loadConfigToForm() {
    document.getElementById('apiKey').value = config.apiKey||'';
    document.getElementById('apiBase').value = config.apiBase||'';
    document.getElementById('temperature').value = config.temperature||0.7;
    document.getElementById('maxTokens').value = config.maxTokens||2000;
    document.getElementById('analysisPrompt').value = config.analysisPrompt||'';
    document.getElementById('partitionPrompt').value = config.partitionPrompt||'';
    const ms = document.getElementById('modelName'), cm = document.getElementById('customModel');
    if(config.modelName && ms.querySelector(`option[value="${config.modelName}"]`)) { ms.value = config.modelName; cm.style.display='none'; }
    else { ms.value='custom'; cm.value = config.modelName||''; cm.style.display='block'; }
}
function saveConfig() {
    config.apiKey = document.getElementById('apiKey').value.trim();
    config.apiBase = document.getElementById('apiBase').value.trim();
    config.modelName = document.getElementById('modelName').value==='custom' ? document.getElementById('customModel').value : document.getElementById('modelName').value;
    config.temperature = document.getElementById('temperature').value;
    config.maxTokens = document.getElementById('maxTokens').value;
    config.analysisPrompt = document.getElementById('analysisPrompt').value;
    config.partitionPrompt = document.getElementById('partitionPrompt').value;
    localStorage.setItem('aiConfig', JSON.stringify(config));
    alert('配置已保存'); closeModal('configModal');
}
function resetPrompts() { if(confirm('恢复默认提示词？')) { document.getElementById('analysisPrompt').value = getFullDefaultAnalysisPrompt(); document.getElementById('partitionPrompt').value = getFullDefaultPartitionPrompt(); } }
document.getElementById('modelName').addEventListener('change', function() { document.getElementById('customModel').style.display = this.value==='custom'?'block':'none'; });

document.getElementById('exportBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify({diaries,analysisHistory,goals},null,2)],{type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `日记备份_${new Date().toISOString().slice(0,10)}.json`; a.click();
});
document.getElementById('importBtn').addEventListener('click', ()=>{
    if(!confirm('导入将合并新增数据')) return;
    const inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
    inp.onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const data = JSON.parse(ev.target.result);
                if(data.diaries) { const ids = new Set(diaries.map(d=>d.id)); data.diaries.forEach(d => { if(!ids.has(d.id)) diaries.unshift(d); }); }
                if(data.analysisHistory) { const ids = new Set(analysisHistory.map(h=>h.id)); data.analysisHistory.forEach(h => { if(!ids.has(h.id)) analysisHistory.unshift(h); }); }
                saveDiaries(); localStorage.setItem('analysisHistory', JSON.stringify(analysisHistory));
                renderDiaryList(); renderDashboard(); alert('导入成功'); location.reload();
            } catch { alert('文件格式错误'); }
        };
        reader.readAsText(e.target.files[0]);
    };
    inp.click();
});
document.getElementById('restoreBtn').addEventListener('click', ()=>{
    if(!confirm('恢复到上次自动备份？')) return;
    const backup = localStorage.getItem('diaries_backup');
    if(!backup) return alert('无备份');
    diaries = JSON.parse(backup); saveDiaries(); alert('恢复成功'); location.reload();
});

// 搜索
document.getElementById('searchInput').addEventListener('input', renderDiaryList);
document.getElementById('diaryTypeFilter').addEventListener('change', renderDiaryList);

// 初始化（关键：绑定保存按钮）
document.addEventListener('DOMContentLoaded', () => {
    setDefaultDate();
    initTheme();
    initTabs();
    renderGoalInputs();
    renderDiaryList();
    renderDashboard();
    // 绑定目标打卡保存按钮
    document.getElementById('saveGoalBtn').addEventListener('click', saveGoalDiary);
    document.getElementById('saveGoalBtn').addEventListener('touchstart', (e) => { e.preventDefault(); saveGoalDiary(); });
});
</script>
