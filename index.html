<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI日记分析</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#FFF0F5;--card:#FFFFFF;--text:#5A4B5A;--text-secondary:#9A8B9A;
            --border:#FFD1DC;--primary:#FFB7C5;--primary-hover:#FF9AAE;--danger:#FF8A80;
            --success:#A8D8B9;--success-light:#D4EDDA;--shadow:0 2px 12px rgba(255,183,197,0.2);
            --font:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',cursive,sans-serif;
        }
        .dark{
            --bg:#3A2D34;--card:#4A3D44;--text:#FDE8EC;--text-secondary:#C9B8BE;
            --border:#6A5760;--primary:#F8BBD0;--primary-hover:#F48FB1;--danger:#EF9A9A;
            --success:#80CBC4;--success-light:#375B5B;--shadow:0 2px 12px rgba(0,0,0,0.3);
        }
        body{background:var(--bg);color:var(--text);font-family:var(--font);padding:20px;max-width:1000px;margin:0 auto;transition:all 0.3s ease;font-size:16px}
        .card{border-radius:24px}.input,.select,.btn{border-radius:16px;font-family:var(--font)}
        .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .top-bar h1{font-size:30px;color:var(--primary)}
        .top-actions{display:flex;gap:12px;align-items:center}
        .icon-btn{background:transparent;border:none;font-size:24px;cursor:pointer;color:var(--text);padding:8px;border-radius:12px}
        .icon-btn:hover{background:var(--border)}
        .card{background:var(--card);padding:24px;margin-bottom:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
        .card h2{font-size:24px;margin-bottom:16px}.card h3{font-size:20px;margin:12px 0 8px}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        @media (max-width:768px){.grid-2{grid-template-columns:1fr}}
        .input{width:100%;padding:12px 16px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;outline:none}
        .input:focus{border-color:var(--success)}
        .textarea{min-height:140px;resize:vertical;line-height:1.6}
        .select{width:100%;padding:12px 16px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;cursor:pointer;border-radius:16px}
        .btn{padding:10px 20px;border:none;font-size:16px;font-weight:bold;cursor:pointer;transition:all 0.2s}
        .btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:var(--primary-hover)}
        .btn-danger{background:var(--danger);color:white}.btn-success{background:var(--success);color:white}
        .btn-outline{background:transparent;border:2px solid var(--border);color:var(--text)}.btn-outline:hover{background:var(--border)}
        .btn-sm{padding:6px 14px;font-size:14px}
        .tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid var(--border);padding-bottom:8px}
        .tab{padding:8px 20px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-radius:20px;font-size:18px;font-weight:bold}
        .tab.active{background:var(--primary);color:white}
        .date-nav{display:flex;align-items:center;gap:12px;margin-bottom:24px}
        .date-nav input[type="date"]{border:1px solid var(--border);padding:8px 12px;border-radius:12px;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px}
        .date-nav button{background:var(--success);border:none;color:white;padding:6px 12px;border-radius:12px;cursor:pointer;font-size:18px}
        .goal-row{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
        .goal-row label{font-weight:bold;font-size:18px}
        .other-section,.free-section{margin-top:28px;padding-top:20px;border-top:2px dashed var(--border)}
        .ai-actions{display:flex;gap:12px;margin-top:12px}
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
        .modal-content{background:var(--card);border-radius:24px;padding:24px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .modal-close{background:none;border:none;font-size:28px;cursor:pointer;color:var(--text)}
        .badge{background:var(--success);color:white;padding:4px 12px;border-radius:12px;font-size:14px;margin-left:8px}
        .history-panel{margin-top:16px;border-top:1px solid var(--border);padding-top:12px}
        .history-item{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:8px;font-size:14px}
        .history-item small{color:var(--text-secondary)}
        .loading{text-align:center;padding:20px}
        .loading::after{content:"";display:inline-block;width:20px;height:20px;border:3px solid var(--border);border-top-color:var(--success);border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .config-selector{display:flex;gap:8px;align-items:center;margin-bottom:16px}
        .config-selector select{flex:1}
        .config-selector button{white-space:nowrap}
        .fetch-models-btn{margin-top:8px}
        .result-content{position:relative;margin:8px 0}
        .result-content.collapsed{max-height:200px;overflow:hidden}
        .result-content.collapsed::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(transparent, var(--bg))}
        .toggle-btn{color:var(--primary);cursor:pointer;font-size:14px;margin-top:4px;background:none;border:none;font-family:var(--font);text-decoration:underline}
        .notebook-item{padding:12px;border-bottom:1px solid var(--border)}
        .notebook-item:last-child{border-bottom:none}
    </style>
</head>
<body>
<div class="top-bar">
    <h1>🌸 AI日记分析</h1>
    <div class="top-actions">
        <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
        <button class="icon-btn" id="goalConfigBtn" title="目标配置">🎯</button>
        <button class="icon-btn" id="configBtn" title="设置">⚙️</button>
    </div>
</div>

<div class="tabs">
    <button class="tab active" data-main-tab="diary">📝 日记</button>
    <button class="tab" data-main-tab="analyze">📊 分析</button>
</div>

<!-- 日记页 -->
<div id="diaryTab" class="main-tab-content">
    <!-- 子标签 -->
    <div class="tabs" style="border-bottom:0;margin-bottom:0">
        <button class="tab active" data-sub-tab="big">📖 大日记本</button>
        <button class="tab" data-sub-tab="small">📚 小本子</button>
    </div>

    <!-- 大日记本 -->
    <div id="bigNotebook" class="sub-tab-content">
        <div class="card">
            <div class="date-nav">
                <button onclick="changeDate(-1)">◀</button>
                <input type="date" id="diaryDate" onchange="loadDiaryByDate()">
                <button onclick="changeDate(1)">▶</button>
                <button class="btn btn-outline btn-sm" onclick="setToday()">今天</button>
                <button class="btn btn-danger btn-sm" onclick="deleteCurrentDiary()" style="margin-left:auto">🗑️ 删除当天</button>
            </div>
            <h3>🎯 今日目标</h3>
            <div id="goalRows"></div>
            <div class="other-section">
                <h3>📌 其他</h3>
                <textarea class="input textarea" id="otherBlock" placeholder="不在目标范围内的其他内容..."></textarea>
            </div>
            <div class="free-section">
                <h3>✍️ 随心记（AI智能归类）</h3>
                <textarea class="input textarea" id="freeInput" placeholder="随便写点什么，点下方按钮自动归类到对应目标…"></textarea>
                <div class="ai-actions">
                    <button class="btn btn-success" id="aiPartitionBtn" onclick="aiPartition()">✨ AI智能归类</button>
                    <span style="color:var(--text-secondary);font-size:14px;padding-top:10px">归类后请手动调整并保存</span>
                </div>
            </div>
            <div style="margin-top:24px;display:flex;gap:12px">
                <button class="btn btn-primary" id="saveDiaryBtn">💾 保存日记</button>
                <button class="btn btn-outline" onclick="selectCurrentForAnalysis()">🔍 选中当天分析</button>
                <button class="btn btn-outline" id="batchImportBtn" onclick="openModal('batchImportModal')">📥 批量导入旧日记</button>
            </div>
        </div>
    </div>

    <!-- 小本子 -->
    <div id="smallNotebook" class="sub-tab-content" style="display:none">
        <div class="card">
            <h3>📚 目标小本子</h3>
            <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px">
                <select class="select" id="notebookGoalSelector" onchange="renderNotebook()" style="width:200px"></select>
                <button class="btn btn-success btn-sm" onclick="analyzeNotebook()">🔍 分析本子</button>
            </div>
            <div id="notebookEntries"></div>
        </div>
    </div>
</div>

<!-- 分析页 -->
<div id="analyzeTab" class="main-tab-content" style="display:none">
    <div class="card">
        <h3>📅 分析指定日期</h3>
        <div style="display:flex;gap:12px;align-items:center">
            <input type="date" id="analyzeDatePicker" style="border:1px solid var(--border);padding:8px 12px;border-radius:12px;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px">
            <button class="btn btn-success btn-sm" onclick="analyzeSpecificDate()">分析该日</button>
            <span style="color:var(--text-secondary)">分析单日日记（使用默认全视角）</span>
        </div>
    </div>

    <div class="card"><h3>☀️ 今日分析</h3><div><button class="btn btn-success btn-sm" onclick="quickAnalyze('today')">重新分析</button><button class="btn btn-outline btn-sm" onclick="toggleHistory('today')">显示/隐藏历史</button></div><div id="todayResult"></div><div id="todayHistory" class="history-panel" style="display:none"></div></div>
    <div class="card"><h3>📅 近7天分析</h3><div><button class="btn btn-success btn-sm" onclick="quickAnalyze('week')">重新分析</button><button class="btn btn-outline btn-sm" onclick="toggleHistory('week')">显示/隐藏历史</button></div><div id="weekResult"></div><div id="weekHistory" class="history-panel" style="display:none"></div></div>
    <div class="card"><h3>📆 近30天分析</h3><div><button class="btn btn-success btn-sm" onclick="quickAnalyze('month')">重新分析</button><button class="btn btn-outline btn-sm" onclick="toggleHistory('month')">显示/隐藏历史</button></div><div id="monthResult"></div><div id="monthHistory" class="history-panel" style="display:none"></div></div>
    <div class="card"><h3>📈 年度分析</h3><div><button class="btn btn-success btn-sm" onclick="quickAnalyze('all')">重新分析</button><button class="btn btn-outline btn-sm" onclick="toggleHistory('all')">显示/隐藏历史</button></div><div id="allResult"></div><div id="allHistory" class="history-panel" style="display:none"></div></div>

    <div class="card">
        <h2>🔍 自定义分析 <span class="badge">手动</span></h2>
        <p style="color:var(--text-secondary);margin-bottom:12px">💡 可选中当前日记（日记页按钮），或直接选范围。也可选择“目标小本子”分析单项。</p>
        <div class="grid-2">
            <div>
                <label>时间范围</label>
                <select class="select" id="timeRange"><option value="single">当前选中日记</option><option value="today">今日</option><option value="week">近7天</option><option value="month">近30天</option><option value="all">全部</option><option value="notebook">当前小本子目标</option></select>
            </div>
            <div>
                <label>分析视角</label>
                <div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
                    <label><input type="checkbox" id="selectAll" onchange="toggleAllViews()"> 全选（内置）</label>
                    <label><input type="checkbox" name="view" value="default"> 默认洞察</label>
                    <label><input type="checkbox" name="view" value="value"> 价值澄清</label>
                    <label><input type="checkbox" name="view" value="reverse"> 逆向思考</label>
                    <label><input type="checkbox" name="view" value="second"> 二阶思考</label>
                    <label><input type="checkbox" name="view" value="cbt"> CBT疗法</label>
                    <label><input type="checkbox" name="view" value="mbti"> MBTI分析</label>
                    <label><input type="checkbox" name="view" value="custom"> 自定义视角</label>
                </div>
            </div>
        </div>
        <div id="customViewInput" style="margin-top:12px;display:none"><input type="text" class="input" id="customView" placeholder="输入自定义视角"></div>
        <div style="margin-top:20px"><button class="btn btn-success" onclick="startAnalysis()">✨ 开始分析</button></div>
        <div id="analysisResult" style="display:none"></div>
    </div>
</div>

<!-- 目标配置模态框 -->
<div id="goalConfigModal" class="modal" style="display:none">
    <div class="modal-content">
        <div class="modal-header"><h2>🎯 长期目标</h2><button class="modal-close" onclick="closeModal('goalConfigModal')">×</button></div>
        <div id="goalConfigList"></div>
        <div style="margin-top:20px;display:flex;gap:12px"><button class="btn btn-outline" onclick="addGoalItem()">+ 添加</button><button class="btn btn-primary" onclick="saveGoals()">💾 保存</button></div>
    </div>
</div>

<!-- 设置模态框 -->
<div id="configModal" class="modal" style="display:none">
    <div class="modal-content">
        <div class="modal-header"><h2>⚙️ 设置</h2><button class="modal-close" onclick="closeModal('configModal')">×</button></div>
        <h3>🔁 API配置方案</h3>
        <div class="config-selector">
            <select class="select" id="configSelector" onchange="switchConfig(this.value)"></select>
            <button class="btn btn-outline btn-sm" id="addConfigBtn">+ 新增方案</button>
            <button class="btn btn-outline btn-sm" id="deleteConfigBtn">🗑️ 删除</button>
        </div>
        <h3>AI接口</h3>
        <div class="grid-2"><div><label>API Key</label><input type="password" class="input" id="apiKey"></div><div><label>节点地址</label><input type="text" class="input" id="apiBase" value="https://api.openai.com/v1"></div></div>
        <div class="grid-2">
            <div>
                <label>模型</label>
                <select class="select" id="modelName"><option value="gpt-3.5-turbo">gpt-3.5-turbo</option><option value="gpt-4o">gpt-4o</option><option value="custom">自定义</option></select>
                <input type="text" class="input" id="customModel" placeholder="自定义模型名" style="margin-top:8px;display:none">
                <button class="btn btn-outline btn-sm fetch-models-btn" id="fetchModelsBtn">🔄 拉取模型列表</button>
            </div>
            <div><label>温度</label><input type="number" class="input" id="temperature" value="0.7" step="0.1"></div>
        </div>
        <div><label>Tokens</label><input type="number" class="input" id="maxTokens" value="2000"></div>
        <h3>提示词（全局共用）</h3>
        <textarea class="input textarea" id="analysisPrompt" style="min-height:150px"></textarea>
        <textarea class="input textarea" id="partitionPrompt" style="min-height:100px;margin-top:8px"></textarea>
        <div style="margin:12px 0"><button class="btn btn-outline" onclick="resetPrompts()">恢复默认提示词</button><button class="btn btn-primary" id="saveConfigBtn">💾 保存当前方案</button></div>
        <h3>💾 数据管理</h3>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
            <button class="btn btn-success" id="exportBtn">📤 导出文件</button>
            <button class="btn btn-success" id="importBtn">📥 导入文件</button>
            <button class="btn btn-outline" id="pasteImportBtn">📋 粘贴导入</button>
            <button class="btn btn-outline" id="restoreBtn">🔄 恢复备份</button>
        </div>
    </div>
</div>

<!-- 粘贴导入模态框 -->
<div id="pasteModal" class="modal" style="display:none">
    <div class="modal-content">
        <div class="modal-header"><h2>📋 粘贴 JSON 备份</h2><button class="modal-close" onclick="closeModal('pasteModal')">×</button></div>
        <textarea class="input textarea" id="pasteJsonInput" style="min-height:300px" placeholder="在此粘贴之前导出的 JSON 备份内容..."></textarea>
        <div style="margin-top:12px"><button class="btn btn-primary" onclick="importFromPaste()">导入并合并</button></div>
    </div>
</div>

<!-- 批量导入旧日记模态框 -->
<div id="batchImportModal" class="modal" style="display:none">
    <div class="modal-content">
        <div class="modal-header"><h2>📥 批量导入旧日记</h2><button class="modal-close" onclick="closeModal('batchImportModal')">×</button></div>
        <p style="color:var(--text-secondary);margin-bottom:12px">粘贴你以前写的多日期纯文本日记，AI 会自动识别日期并归类到对应目标</p>
        <textarea class="input textarea" id="batchTextInput" style="min-height:300px" placeholder="在此粘贴旧日记文本..."></textarea>
        <div style="margin-top:12px;display:flex;gap:12px">
            <button class="btn btn-success" id="batchImportBtn" onclick="batchImportDiaries()">✨ AI解析并导入</button>
            <span id="batchStatus" style="color:var(--text-secondary);padding-top:10px"></span>
        </div>
    </div>
</div>

<script>
// ========== 默认提示词 ==========
function getDefaultAnalysisPrompt() {
    return `【AI角色】
我是一名在福州读大学的女生，你是我的专属私人日记洞察师，深度了解我的所有自定义长期目标。你精通Flomo全6大洞察视角，客观中立，只讲真话，不做道德评判。我是坚定的女权主义者，反对平权，支持推翻父权制，成为强大女性（包括身体强壮，心理强大）。

【核心规则（必须严格遵守）】
1. 绝对禁止鸡汤、空洞安慰、空泛大道理和晦涩的心理学术语
2. 所有分析必须紧扣我当天的日记内容，不凭空臆测
3. 所有行动建议必须是我当天/次日就能完成的小事，单条不超过20字
4. 严格按照下面的固定模块和顺序输出，不要增减大标题
5. 末尾必须生成3-5个关键词标签，方便我检索和长期记忆存档
6. 绝对禁止生成与之前分析重复的内容，每次分析必须基于最新日记内容提供新的洞察

【分析维度（完整覆盖Flomo6大视角+专属目标追踪）】
1. 【默认洞察】一句话概括当日核心内容+提炼3件最关键的事
2. 【价值澄清】从今天的言行中，找出我真正在意的东西；判断哪些事符合我的长期目标，哪些事在消耗我、偏离目标
3. 【逆向思考】如果今天这件事反过来做/不做，会有什么更好的结果？我今天忽略了哪些原本可以抓住的小机会（尤其关于赚钱、找工作、自媒体）
4. 【二阶思考】今天出现的问题（拖延、焦虑、不开心），表面原因是什么？背后真正的深层原因是什么？（不要只说“我懒”）
5. 【CBT认知纠偏】识别我日记里的负面思维陷阱（如非黑即白、灾难化、自我否定），用客观事实帮我纠正
6. 【MBTI行为映射】结合今天我的具体言行，分析我的人格特质在这件事上的体现，指出优势和需要注意的短板
7. 【核心目标每日追踪】分别对应我的所有自定义长期目标，给出1句话反馈+1条可落地小建议（当天没涉及的目标标注“今日无相关记录”即可）
8. 【明日行动清单】最多3条，只写具体动作，不写空话

【输出要求】
每个模块用【】标注大标题，内容分点，语言简洁，单篇总字数控制在500字以内。尽量一次性全部发完，不要分段发。

现在分析以下日记内容：
{日记内容}`;
}

function getDefaultPartitionPrompt() {
    return `请将以下日记文本按照我的长期目标进行智能分区，然后将剩余内容归纳为合理的临时主题。

我的长期目标列表：
{目标列表}

要求：
1. 首先提取所有与上述长期目标相关的内容，放入对应的目标区块
2. 剩余内容自动归纳为合理的临时主题，生成新的区块
3. 输出严格按照JSON数组格式，每个元素包含title和content两个字段
4. 不要添加任何额外的解释或说明
5. 保留原始内容，不要修改

需要分区的文本：
{文本内容}`;
}

// ========== 全局变量 ==========
let diaries = [], analysisHistory = [], goals = [], selectedDiaryId = null, selectedNotebookGoal = null;
let apiConfigs = [], currentConfigId = null, config = {};

function isValidDiary(d) { return d && typeof d === 'object' && Array.isArray(d.blocks); }
function getValidDiaries() { return Array.isArray(diaries) ? diaries.filter(isValidDiary) : []; }

// ========== 配置系统 ==========
function initConfigs() {
    const savedConfigs = localStorage.getItem('apiConfigs');
    const savedCurrentId = localStorage.getItem('currentConfigId');
    const oldConfig = localStorage.getItem('aiConfig');

async function callAI(prompt) {
    const model = config.modelName==='custom' ? (document.getElementById('customModel')?.value || config.modelName) : config.modelName;
    const res = await fetch(`${config.apiBase}/chat/completions`, {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${config.apiKey}`},
        body: JSON.stringify({ model, messages:[{role:'user',content:prompt}], temperature:Number(config.temperature), max_tokens:Number(config.maxTokens) })
    });
    if(!res.ok) throw new Error((await res.json()).error?.message||'请求失败');
    return (await res.json()).choices[0].message.content;
}

            let dateStr = entry.date || today;
            const parsedDate = new Date(dateStr); if (!isNaN(parsedDate.getTime())) dateStr = parsedDate.toLocaleDateString();
            const match = dateStr.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/); if (match) dateStr = new Date(match[1], match[2]-1, match[3]).toLocaleDateString();
            if (!entry.blocks || !Array.isArray(entry.blocks)) return;
            const blocks = entry.blocks.filter(b => b.title && b.content); if (blocks.length === 0) return;
            const existing = getDiaryByDate(dateStr);
            if (existing) { blocks.forEach(b => { const existingBlock = existing.blocks.find(eb => eb.title === b.title); if (existingBlock) existingBlock.content = existingBlock.content + '\n' + b.content; else existing.blocks.push({ title: b.title, content: b.content }); }); existing.source = '批量导入'; }
            else { diaries.unshift({ id: Date.now() + Math.random(), date: dateStr, type: 'goal', blocks: blocks, rawText: '', source: '批量导入', createdAt: new Date().toISOString() }); }
            importedCount++;
        });
        saveDiaries(); loadDiaryByDate(); status.textContent = `导入完成！成功导入 ${importedCount} 天日记`;
        btn.disabled = false; btn.textContent = '✨ AI解析并导入'; document.getElementById('batchTextInput').value = '';
        setTimeout(() => { status.textContent = ''; }, 3000);
    } catch (e) { status.textContent = '导入失败: ' + e.message; btn.disabled = false; btn.textContent = '✨ AI解析并导入'; }
}

// ========== 设置面板 ==========
document.getElementById('configBtn').onclick = () => { refreshConfigSelector(); loadConfigToForm(); openModal('configModal'); };
document.getElementById('goalConfigBtn').onclick = () => { renderGoalConfigList(); openModal('goalConfigModal'); };
function refreshConfigSelector() { const sel = document.getElementById('configSelector'); sel.innerHTML = apiConfigs.map(c => `<option value="${c.id}" ${c.id===currentConfigId?'selected':''}>${c.name}</option>`).join(''); }
window.switchConfig = function(newId) { if (!newId || newId === currentConfigId) return; currentConfigId = newId; syncCurrentConfig(); loadConfigToForm(); saveConfigs(); };
function loadConfigToForm() {
    const cfg = apiConfigs.find(c => c.id === currentConfigId) || apiConfigs[0];
    document.getElementById('apiKey').value = cfg.apiKey || ''; document.getElementById('apiBase').value = cfg.apiBase || 'https://api.openai.com/v1';
    document.getElementById('temperature').value = cfg.temperature ?? 0.7; document.getElementById('maxTokens').value = cfg.maxTokens ?? 2000;
    const ms = document.getElementById('modelName'), cm = document.getElementById('customModel');
    const existingOptions = Array.from(ms.options).map(o=>o.value);
    if(existingOptions.includes(cfg.modelName)) { ms.value = cfg.modelName; cm.style.display='none'; }
    else { ms.value = 'custom'; cm.value = cfg.modelName || ''; cm.style.display='block'; }
    document.getElementById('analysisPrompt').value = config.analysisPrompt || getDefaultAnalysisPrompt();
    document.getElementById('partitionPrompt').value = config.partitionPrompt || getDefaultPartitionPrompt();
}
document.getElementById('addConfigBtn').addEventListener('click', () => { const name = prompt('请输入新方案名称：'); if (!name) return; const newId = Date.now().toString(); const currentCfg = apiConfigs.find(c => c.id === currentConfigId) || apiConfigs[0]; const newCfg = JSON.parse(JSON.stringify(currentCfg)); newCfg.id = newId; newCfg.name = name; apiConfigs.push(newCfg); currentConfigId = newId; syncCurrentConfig(); refreshConfigSelector(); loadConfigToForm(); saveConfigs(); });
document.getElementById('deleteConfigBtn').addEventListener('click', () => { if (apiConfigs.length <= 1) return alert('至少保留一个配置方案'); if (!confirm('确定删除当前方案？')) return; apiConfigs = apiConfigs.filter(c => c.id !== currentConfigId); currentConfigId = apiConfigs[0].id; syncCurrentConfig(); refreshConfigSelector(); loadConfigToForm(); saveConfigs(); });
document.getElementById('saveConfigBtn').addEventListener('click', () => { const cfg = apiConfigs.find(c => c.id === currentConfigId); if (!cfg) return; cfg.apiKey = document.getElementById('apiKey').value.trim(); cfg.apiBase = document.getElementById('apiBase').value.trim(); cfg.modelName = document.getElementById('modelName').value === 'custom' ? document.getElementById('customModel').value : document.getElementById('modelName').value; cfg.customModel = document.getElementById('customModel').value; cfg.temperature = document.getElementById('temperature').value; cfg.maxTokens = document.getElementById('maxTokens').value; config.analysisPrompt = document.getElementById('analysisPrompt').value; config.partitionPrompt = document.getElementById('partitionPrompt').value; config.apiKey = cfg.apiKey; config.apiBase = cfg.apiBase; config.modelName = cfg.modelName; config.temperature = cfg.temperature; config.maxTokens = cfg.maxTokens; saveConfigs(); alert('当前方案已保存'); closeModal('configModal'); });
document.getElementById('fetchModelsBtn').addEventListener('click', async () => { const base = document.getElementById('apiBase').value.trim(), key = document.getElementById('apiKey').value.trim(); if(!base || !key) return alert('请先填写API地址和密钥'); const btn = document.getElementById('fetchModelsBtn'); btn.disabled = true; btn.textContent = '获取中...'; try { const res = await fetch(`${base}/models`, { headers: { 'Authorization': `Bearer ${key}` } }); if(!res.ok) throw new Error('请求失败'); const data = await res.json(); const models = data.data.map(m => m.id).filter(id => id.includes('gpt') || id.includes('claude') || id.includes('deepseek')); document.getElementById('modelName').innerHTML = models.map(id => `<option value="${id}">${id}</option>`).join('') + '<option value="custom">自定义</option>'; document.getElementById('customModel').style.display = 'none'; alert('模型列表已更新'); } catch(e) { alert('获取失败: '+e.message); } btn.disabled = false; btn.textContent = '🔄 拉取模型列表'; });
function resetPrompts() { if(confirm('恢复默认提示词？')) { document.getElementById('analysisPrompt').value = getDefaultAnalysisPrompt(); document.getElementById('partitionPrompt').value = getDefaultPartitionPrompt(); config.analysisPrompt = getDefaultAnalysisPrompt(); config.partitionPrompt = getDefaultPartitionPrompt(); saveConfigs(); alert('已恢复默认提示词'); } }
document.getElementById('modelName').addEventListener('change', function() { document.getElementById('customModel').style.display = this.value==='custom'?'block':'none'; });

// ========== 导入导出 ==========
document.getElementById('exportBtn').addEventListener('click', ()=>{ const all = { diaries, analysisHistory, goals, apiConfigs, currentConfigId, exportTime: new Date().toISOString() }; const blob = new Blob([JSON.stringify(all, null, 2)],{type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `日记备份_${new Date().toISOString().slice(0,10)}.json`; a.click(); });
document.getElementById('importBtn').addEventListener('click', ()=>{ if(!confirm('导入将合并新增数据')) return; const inp = document.createElement('input'); inp.type='file'; inp.accept='.json'; inp.onchange = e => { const reader = new FileReader(); reader.onload = ev => { handleImportData(ev.target.result); }; reader.readAsText(e.target.files[0]); }; inp.click(); });
document.getElementById('pasteImportBtn').addEventListener('click', () => { openModal('pasteModal'); document.getElementById('pasteJsonInput').value = ''; });
function importFromPaste() { const text = document.getElementById('pasteJsonInput').value.trim(); if(!text) return alert('请粘贴 JSON 内容'); handleImportData(text); closeModal('pasteModal'); }
function handleImportData(jsonStr) { try { const data = JSON.parse(jsonStr); let added = 0; if(data.diaries) { const ids = new Set(diaries.map(d=>d.id)); data.diaries.forEach(d => { if(!ids.has(d.id)) { diaries.unshift(d); added++; } }); } if(data.analysisHistory) { const ids = new Set(analysisHistory.map(h=>h.id)); data.analysisHistory.forEach(h => { if(!ids.has(h.id)) { analysisHistory.unshift(h); added++; } }); } if(data.goals && !goals.length) goals = data.goals; if(data.apiConfigs) { const ids = new Set(apiConfigs.map(c=>c.id)); data.apiConfigs.forEach(c => { if(!ids.has(c.id)) apiConfigs.push(c); }); if(data.currentConfigId) currentConfigId = data.currentConfigId; } saveDiaries(); localStorage.setItem('analysisHistory', JSON.stringify(analysisHistory)); localStorage.setItem('goals', JSON.stringify(goals)); saveConfigs(); syncCurrentConfig(); loadDiaryByDate(); renderDashboard(); renderGoalConfigList(); updateNotebookSelector(); alert(`导入完成，新增 ${added} 条数据`); location.reload(); } catch(e) { alert('JSON 格式错误'); } }
document.getElementById('restoreBtn').addEventListener('click', ()=>{ if(!confirm('恢复到上次自动备份？')) return; const backup = localStorage.getItem('diaries_backup'); if(!backup) return alert('无备份'); diaries = JSON.parse(backup); saveDiaries(); alert('恢复成功'); location.reload(); });

// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('diaryDate').value = today; document.getElementById('analyzeDatePicker').value = today;
    initTheme(); initTabs();
    refreshConfigSelector(); loadDiaryByDate(); renderDashboard(); updateNotebookSelector();
    document.getElementById('saveDiaryBtn').addEventListener('click', saveCurrentDiary);
    document.getElementById('saveDiaryBtn').addEventListener('touchstart', (e) => { e.preventDefault(); saveCurrentDiary(); });
});
</script>
