<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI日记分析</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#FFF0F5;
            --card:#FFFFFF;
            --text:#5A4B5A;
            --text-secondary:#9A8B9A;
            --border:#FFD1DC;
            --primary:#FFB7C5;
            --primary-hover:#FF9AAE;
            --danger:#FF8A80;
            --success:#A8D8B9;   /* 柔和抹茶绿，不刺眼 */
            --success-light:#D4EDDA;
            --shadow:0 2px 12px rgba(255,183,197,0.2);
            --font:'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', cursive, sans-serif;
        }
        .dark{
            --bg:#3A2D34;
            --card:#4A3D44;
            --text:#FDE8EC;
            --text-secondary:#C9B8BE;
            --border:#6A5760;
            --primary:#F8BBD0;
            --primary-hover:#F48FB1;
            --danger:#EF9A9A;
            --success:#80CBC4;
            --success-light:#375B5B;
            --shadow:0 2px 12px rgba(0,0,0,0.3);
        }
        body{
            background:var(--bg);
            color:var(--text);
            font-family:var(--font);
            padding:20px;
            max-width:1000px;
            margin:0 auto;
            transition:all 0.3s ease;
            font-size:16px;
        }
        .card{border-radius:24px}
        .input,.select,.btn{border-radius:16px;font-family:var(--font);}
        .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .top-bar h1{font-size:30px;color:var(--primary);display:flex;align-items:center;gap:8px}
        .top-actions{display:flex;gap:12px;align-items:center}
        .icon-btn{background:transparent;border:none;font-size:24px;cursor:pointer;color:var(--text);padding:8px;border-radius:12px;transition:background 0.2s}
        .icon-btn:hover{background:var(--border)}
        .card{background:var(--card);padding:24px;margin-bottom:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
        .card h2{font-size:24px;margin-bottom:16px;color:var(--text)}
        .card h3{font-size:20px;margin:12px 0 8px;color:var(--text)}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        @media (max-width:768px){.grid-2{grid-template-columns:1fr}}
        .input{width:100%;padding:12px 16px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;outline:none;transition:border-color 0.2s}
        .input:focus{border-color:var(--success)}
        .textarea{min-height:120px;resize:vertical;line-height:1.6}
        .select{width:100%;padding:12px 16px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;cursor:pointer;border-radius:16px}
        .btn{padding:10px 20px;border:none;font-size:16px;font-weight:bold;cursor:pointer;transition:all 0.2s;letter-spacing:1px}
        .btn-primary{background:var(--primary);color:white}
        .btn-primary:hover{background:var(--primary-hover)}
        .btn-danger{background:var(--danger);color:white}
        .btn-success{background:var(--success);color:white}
        .btn-outline{background:transparent;border:2px solid var(--border);color:var(--text)}
        .btn-outline:hover{background:var(--border)}
        .btn-sm{padding:6px 14px;font-size:14px}
        .tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid var(--border);padding-bottom:8px}
        .tab{padding:8px 20px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-radius:20px;font-size:18px;font-weight:bold;transition:all 0.2s}
        .tab.active{background:var(--primary);color:white}
        .diary-item{border-bottom:1px solid var(--border);padding:16px 0;display:flex;align-items:flex-start;gap:12px}
        .diary-item:last-child{border-bottom:none}
        .diary-checkbox{width:20px;height:20px;margin-top:4px;cursor:pointer;accent-color:var(--success)}
        .diary-body{flex:1}
        .diary-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        .diary-date{font-weight:bold;color:var(--text)}
        .diary-source{font-size:14px;color:var(--text-secondary);background:var(--bg);padding:2px 10px;border-radius:12px}
        .diary-preview{color:var(--text-secondary);line-height:1.5}
        .diary-actions{display:flex;gap:8px;margin-top:12px}
        .diary-block{margin-bottom:12px;padding:12px;background:var(--bg);border-radius:16px}
        .diary-block-title{font-weight:bold;color:var(--primary);margin-bottom:6px}
        .analysis-result{background:var(--bg);border-radius:20px;padding:20px;margin-top:20px;line-height:1.8}
        .empty-state{text-align:center;padding:40px;color:var(--text-secondary)}
        .loading{text-align:center;padding:40px}
        .loading::after{content:"";display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--success);border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
        .modal-content{background:var(--card);border-radius:24px;padding:24px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .modal-close{background:none;border:none;font-size:28px;cursor:pointer;color:var(--text)}
        .badge{display:inline-block;padding:4px 12px;border-radius:12px;font-size:14px;background:var(--success);color:white;margin-left:8px}
        .batch-actions{display:flex;gap:8px;margin-bottom:12px;align-items:center}
        .goal-input-group{margin-bottom:16px}
        .goal-input-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        .goal-no-record{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
        .date-picker{display:flex;align-items:center;gap:8px;margin-bottom:16px;background:var(--success-light);padding:8px 12px;border-radius:12px}
        .date-picker input{border:none;background:transparent;color:var(--text);font-size:16px;font-family:var(--font)}
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>🌸 AI日记分析</h1>
        <div class="top-actions">
            <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
            <button class="icon-btn" id="goalConfigBtn" title="目标配置">🎯</button>
            <button class="icon-btn" id="configBtn" title="设置">⚙️</button>
        </div>
    </div>

    <!-- 主标签：记录日记 / 分析日记 -->
    <div class="tabs">
        <button class="tab active" data-main-tab="record">📝 记录日记</button>
        <button class="tab" data-main-tab="analyze">📊 分析日记</button>
    </div>

    <!-- 记录日记页 -->
    <div id="recordTab" class="main-tab-content">
        <!-- 日期选择 -->
        <div class="date-picker">
            <span>📅 日记日期：</span>
            <input type="date" id="diaryDate">
        </div>

        <!-- 录入子标签 -->
        <div class="tabs">
            <button class="tab active" data-entry-tab="goal">🎯 目标打卡记</button>
            <button class="tab" data-entry-tab="free">✍️ 随心记</button>
        </div>
        <div id="goalEntryTab" class="entry-tab-content">
            <div id="goalInputsContainer"></div>
            <div class="goal-input-group">
                <div class="goal-input-header"><span>📝 额外补充（可选）</span></div>
                <textarea class="input textarea goal-textarea" id="extraContent" placeholder="写一些目标之外的零散内容..."></textarea>
            </div>
            <div style="margin-top:20px"><button class="btn btn-primary" id="saveGoalBtn">💾 保存日记</button></div>
        </div>
        <div id="freeEntryTab" class="entry-tab-content" style="display:none">
            <textarea class="input textarea" id="freeDiaryInput" style="min-height:300px" placeholder="随便写点什么吧，不用有任何格式限制..."></textarea>
            <div style="margin-top:20px;display:flex;gap:12px">
                <button class="btn btn-outline" onclick="saveFreeDiary(false)">仅保存原始文本</button>
                <button class="btn btn-primary" onclick="saveFreeDiary(true)">✨ 保存并AI智能分区</button>
            </div>
        </div>
    </div>

    <!-- 分析日记页 -->
    <div id="analyzeTab" class="main-tab-content" style="display:none">
        <!-- 看板 -->
        <div class="card dashboard-card"><div class="dashboard-header"><h3>☀️ 今日分析</h3><div class="dashboard-actions"><button class="btn btn-success btn-sm" onclick="quickAnalyze('today')">重新分析</button><button class="btn btn-outline btn-sm" onclick="viewRangeHistory('today')">查看历史</button></div></div><div id="todayResult" class="latest-result"><div class="empty-state">还没有今日分析</div></div></div>
        <div class="card dashboard-card"><div class="dashboard-header"><h3>📅 近7天分析</h3><div class="dashboard-actions"><button class="btn btn-success btn-sm" onclick="quickAnalyze('week')">重新分析</button><button class="btn btn-outline btn-sm" onclick="viewRangeHistory('week')">查看历史</button></div></div><div id="weekResult" class="latest-result"><div class="empty-state">还没有近7天分析</div></div></div>
        <div class="card dashboard-card"><div class="dashboard-header"><h3>📆 近30天分析</h3><div class="dashboard-actions"><button class="btn btn-success btn-sm" onclick="quickAnalyze('month')">重新分析</button><button class="btn btn-outline btn-sm" onclick="viewRangeHistory('month')">查看历史</button></div></div><div id="monthResult" class="latest-result"><div class="empty-state">还没有近30天分析</div></div></div>
        <div class="card dashboard-card"><div class="dashboard-header"><h3>📈 年度分析（全部）</h3><div class="dashboard-actions"><button class="btn btn-success btn-sm" onclick="quickAnalyze('all')">重新分析</button><button class="btn btn-outline btn-sm" onclick="viewRangeHistory('all')">查看历史</button></div></div><div id="allResult" class="latest-result"><div class="empty-state">还没有年度分析</div></div></div>

        <!-- 日记列表 -->
        <div class="card">
            <h2>📚 日记列表</h2>
            <div style="display:flex;gap:12px;margin-bottom:12px">
                <input type="text" class="input" id="searchInput" placeholder="搜索日记内容或日期..." style="flex:1">
                <select class="select" id="diaryTypeFilter" style="width:140px">
                    <option value="all">全部类型</option>
                    <option value="goal">目标打卡</option>
                    <option value="free">随心记</option>
                </select>
            </div>
            <div id="batchBar" class="batch-actions" style="display:none">
                <span id="selectedCount" style="color:var(--success);font-weight:bold">已选0篇</span>
                <button class="btn btn-outline btn-sm" onclick="toggleSelectAll()">全选</button>
                <button class="btn btn-outline btn-sm" onclick="clearSelection()">取消选择</button>
                <button class="btn btn-danger btn-sm" onclick="batchDelete()">🗑️ 批量删除</button>
            </div>
            <div id="diaryList"><div class="empty-state">还没有日记</div></div>
        </div>

        <!-- 自定义分析 -->
        <div class="card">
            <h2>🔍 自定义分析 <span class="badge">手动触发</span></h2>
            <div class="grid-2">
                <div><label>分析时间范围</label><select class="select" id="timeRange"><option value="single">当前选中日记</option><option value="today">今日日记</option><option value="week">近7天日记</option><option value="month">近30天日记</option><option value="all">全部日记</option></select></div>
                <div>
                    <label>分析视角（可多选）</label>
                    <div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
                        <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="selectAll" onchange="toggleAllViews()"> 全选（内置）</label>
                        <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" name="view" value="default"> 默认洞察</label>
                        <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" name="view" value="value"> 价值澄清</label>
                        <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" name="view" value="reverse"> 逆向思考</label>
                        <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" name="view" value="second"> 二阶思考</label>
                        <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" name="view" value="cbt"> CBT疗法</label>
                        <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" name="view" value="mbti"> MBTI分析</label>
                        <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" name="view" value="custom"> 自定义视角</label>
                    </div>
                </div>
            </div>
            <div id="customViewInput" style="margin-top:12px;display:none"><input type="text" class="input" id="customView" placeholder="输入你想要的额外分析视角"></div>
            <div style="margin-top:20px"><button class="btn btn-success" onclick="startAnalysis()">✨ 开始AI分析</button></div>
            <div id="analysisResult" style="display:none"></div>
        </div>
    </div>

    <!-- 目标配置模态框 -->
    <div id="goalConfigModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header"><h2>🎯 长期目标配置</h2><button class="modal-close" onclick="closeModal('goalConfigModal')">×</button></div>
            <div id="goalConfigList"></div>
            <div style="margin-top:20px;display:flex;gap:12px"><button class="btn btn-outline" onclick="addGoalItem()">+ 添加新目标</button><button class="btn btn-primary" onclick="saveGoals()">💾 保存目标</button></div>
        </div>
    </div>

    <!-- 设置模态框（包含AI配置 + 数据管理） -->
    <div id="configModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header"><h2>⚙️ 设置</h2><button class="modal-close" onclick="closeModal('configModal')">×</button></div>
            <h3>AI接口配置</h3>
            <div class="grid-2" style="margin-bottom:16px"><div><label>API 密钥</label><input type="password" class="input" id="apiKey"></div><div><label>API 节点地址</label><input type="text" class="input" id="apiBase" value="https://api.openai.com/v1"></div></div>
            <div class="grid-2" style="margin-bottom:16px">
                <div><label>模型名称</label><select class="select" id="modelName"><option value="gpt-3.5-turbo">gpt-3.5-turbo</option><option value="gpt-4">gpt-4</option><option value="gpt-4-turbo">gpt-4-turbo</option><option value="gpt-4o">gpt-4o</option><option value="claude-3-opus-20240229">claude-3-opus</option><option value="claude-3-sonnet-20240229">claude-3-sonnet</option><option value="claude-3-haiku-20240307">claude-3-haiku</option><option value="custom">自定义其他模型</option></select><input type="text" class="input" id="customModel" placeholder="自定义模型名称" style="margin-top:8px;display:none"></div>
                <div><label>温度值 (0-2)</label><input type="number" class="input" id="temperature" value="0.7" min="0" max="2" step="0.1"></div>
            </div>
            <div style="margin-bottom:16px"><label>最大生成长度 (tokens)</label><input type="number" class="input" id="maxTokens" value="2000" min="100" max="10000"></div>
            <h3>提示词</h3>
            <div style="margin-bottom:16px"><label>日记分析提示词</label><textarea class="input textarea" id="analysisPrompt" style="min-height:200px"></textarea></div>
            <div style="margin-bottom:24px"><label>AI智能分区提示词</label><textarea class="input textarea" id="partitionPrompt" style="min-height:150px"></textarea></div>
            <div style="display:flex;gap:12px;margin-bottom:24px"><button class="btn btn-outline" onclick="resetPrompts()">恢复默认</button><button class="btn btn-primary" onclick="saveConfig()">💾 保存AI配置</button></div>

            <h3>💾 数据管理</h3>
            <div style="display:flex;gap:12px;flex-wrap:wrap">
                <button class="btn btn-success" id="exportBtn">📤 导出备份</button>
                <button class="btn btn-success" id="importBtn">📥 导入合并</button>
                <button class="btn btn-outline" id="restoreBtn">🔄 恢复上次备份</button>
            </div>
        </div>
    </div>

    <!-- 历史分析模态框 -->
    <div id="historyModal" class="modal" style="display:none">
        <div class="modal-content"><div class="modal-header"><h2 id="historyModalTitle">历史分析记录</h2><button class="modal-close" onclick="closeModal('historyModal')">×</button></div><div id="historyList"></div></div>
    </div>

    <!-- 编辑模态框 -->
    <div id="editModal" class="modal" style="display:none">
        <div class="modal-content">
            <div class="modal-header"><h2>✏️ 编辑日记</h2><button class="modal-close" onclick="closeModal('editModal')">×</button></div>
            <div id="editContent"></div>
            <div style="margin-top:20px;display:flex;gap:12px"><button class="btn btn-outline" onclick="closeModal('editModal')">取消</button><button class="btn btn-primary" id="saveEditBtn">💾 保存修改</button></div>
        </div>
    </div>

<script>
// ========== 安全工具 ==========
function isValidDiary(d) { return d && typeof d === 'object' && Array.isArray(d.blocks); }
function getValidDiaries() { return Array.isArray(diaries) ? diaries.filter(isValidDiary) : []; }
function safeBlocks(d) { return isValidDiary(d) ? d.blocks : []; }

// ========== 全局变量 ==========
let diaries = [];
let analysisHistory = [];
let goals = [];
let selectedDiaryId = null;
let config = {};
let editingDiaryId = null;
let selectedIds = new Set();

// ========== 默认提示词 ==========
function getFullDefaultAnalysisPrompt() {
    return `【AI角色】\n我是一名在福州读大学的女生，你是我的专属私人日记洞察师，深度了解我的所有自定义长期目标。你精通Flomo全6大洞察视角，客观中立，只讲真话，不做道德评判。我是坚定的女权主义者，反对平权，支持推翻父权制，成为强大女性（包括身体强壮，心理强大）。\n\n【核心规则】\n1. 绝对禁止鸡汤、空洞安慰、空泛大道理和晦涩的心理学术语\n2. 所有分析必须紧扣我当天的日记内容，不凭空臆测\n3. 所有行动建议必须是我当天/次日就能完成的小事，单条不超过20字\n4. 严格按照下面的固定模块和顺序输出，不要增减大标题\n5. 末尾必须生成3-5个关键词标签\n\n【分析维度】\n1. 【默认洞察】\n2. 【价值澄清】\n3. 【逆向思考】\n4. 【二阶思考】\n5. 【CBT认知纠偏】\n6. 【MBTI行为映射】\n7. 【核心目标每日追踪】\n8. 【明日行动清单】\n\n现在分析以下日记内容：\n{日记内容}`;
}
function getFullDefaultPartitionPrompt() {
    return `请将以下日记文本按照我的长期目标进行智能分区，然后将剩余内容归纳为合理的临时主题。\n\n我的长期目标列表：\n{目标列表}\n\n要求：\n1. 首先提取所有与上述长期目标相关的内容，放入对应的目标区块\n2. 剩余内容自动归纳为合理的临时主题，生成新的区块\n3. 输出严格按照JSON数组格式，每个元素包含title和content两个字段\n4. 不要添加任何额外的解释或说明\n5. 保留原始内容，不要修改\n\n需要分区的文本：\n{文本内容}`;
}

// ========== 数据加载 ==========
function safeLoadData() {
    try { diaries = JSON.parse(localStorage.getItem('diaries')||'[]'); if(!Array.isArray(diaries)) diaries=[]; diaries=diaries.filter(isValidDiary); } catch(e){ diaries=[]; }
    try { analysisHistory = JSON.parse(localStorage.getItem('analysisHistory')||'[]'); } catch(e){ analysisHistory=[]; }
    try { goals = JSON.parse(localStorage.getItem('goals')||'["瘦子增肌","去外地找工作","早睡早起/健康饮食","克服拖延症","攒钱下学期校外租房","自媒体从零起步"]'); } catch(e){ goals=['瘦子增肌','去外地找工作','早睡早起/健康饮食','克服拖延症','攒钱下学期校外租房','自媒体从零起步']; }
    try {
        config = JSON.parse(localStorage.getItem('aiConfig'));
        if(!config || !config.analysisPrompt) config = { apiKey:'', apiBase:'https://api.openai.com/v1', modelName:'gpt-3.5-turbo', temperature:0.7, maxTokens:2000, analysisPrompt:getFullDefaultAnalysisPrompt(), partitionPrompt:getFullDefaultPartitionPrompt() };
    } catch(e){ config = { apiKey:'', apiBase:'https://api.openai.com/v1', modelName:'gpt-3.5-turbo', temperature:0.7, maxTokens:2000, analysisPrompt:getFullDefaultAnalysisPrompt(), partitionPrompt:getFullDefaultPartitionPrompt() }; }
}

safeLoadData();

// ========== 主题 ==========
function initTheme() {
    if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark'); document.getElementById('themeBtn').textContent='☀️'; }
    document.getElementById('themeBtn').onclick = () => {
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');

function getSelectedDate() {
    const dateInput = document.getElementById('diaryDate');
    return dateInput ? dateInput.value : new Date().toISOString().split('T')[0];
}

function saveGoalDiary() {
    const groups = document.querySelectorAll('#goalInputsContainer .goal-input-group');
    const blocks = [];
    groups.forEach((group, idx) => {
        const cb = group.querySelector('input[type="checkbox"]');
        const ta = group.querySelector('textarea');
        if (!cb.checked && ta.value.trim()) blocks.push({ title: goals[idx], content: ta.value.trim() });
        else if (cb.checked) blocks.push({ title: goals[idx], content: '今日无相关记录' });
    });
    const extra = document.getElementById('extraContent').value.trim();
    if (extra) blocks.push({ title: '额外补充', content: extra });
    if (blocks.length === 0) return alert('请至少填写一个目标或勾选“今日无相关记录”');

    const diary = {
        id: Date.now(),
        date: getSelectedDate(),
        type: 'goal',
        blocks,
        rawText: '',
        source: '目标打卡',
        createdAt: new Date().toISOString()
    };
    diaries.unshift(diary);
    saveDiaries();
    renderDiaryList();
    groups.forEach((group, i) => {
        group.querySelector('input[type="checkbox"]').checked = false;
        const ta = group.querySelector('textarea');
        ta.disabled = false; ta.value = ''; ta.style.opacity = '1';
    });
    document.getElementById('extraContent').value = '';
    alert('日记保存成功！');
}

async function saveFreeDiary(needPartition) {
    const raw = document.getElementById('freeDiaryInput').value.trim();
    if (!raw) return alert('日记内容不能为空');
    let blocks = [];
    if (needPartition) {
        if (!config.apiKey) return alert('请先配置AI接口');
        const btn = document.querySelector('#freeEntryTab .btn-primary');
        btn.disabled = true; btn.textContent = 'AI分区中...';
        try {
            const prompt = config.partitionPrompt.replace('{目标列表}', goals.join('、')).replace('{文本内容}', raw);
            const res = await callAI(prompt);
            blocks = JSON.parse(res);
        } catch(e) {
            alert('AI分区失败，已保存原始文本');
            blocks = [{ title: '原始内容', content: raw }];
        }
        btn.disabled = false; btn.textContent = '✨ 保存并AI智能分区';
    } else {
        blocks = [{ title: '原始内容', content: raw }];
    }
    const diary = {
        id: Date.now() + Math.random(),
        date: getSelectedDate(),
        type: 'free',
        blocks,
        rawText: raw,
        source: '随心记',
        createdAt: new Date().toISOString()
    };
    diaries.unshift(diary);
    saveDiaries();
    renderDiaryList();
    document.getElementById('freeDiaryInput').value = '';
    alert('日记保存成功！');
}

}

// ========== 日记列表 ==========
function renderDiaryList() {
    const validDiaries = getValidDiaries();
    const kw = document.getElementById('searchInput').value.toLowerCase();
    const type = document.getElementById('diaryTypeFilter').value;
    let list = validDiaries.filter(d => {
        const matchKw = safeBlocks(d).some(b => b?.content?.toLowerCase().includes(kw)) || (d.date && d.date.includes(kw));
        const matchType = type === 'all' || d.type === type;
        return matchKw && matchType;
    });
    const wrap = document.getElementById('diaryList');
    if (!list.length) { wrap.innerHTML = '<div class="empty-state">没有找到匹配日记 🌸</div>'; updateBatchBar(); return; }
    let html = '';
    list.forEach(d => {
        const blocks = safeBlocks(d);
        let preview = '';
        blocks.slice(0,2).forEach(b => {
            preview += `<div class="diary-block"><div class="diary-block-title">【${b.title||''}】</div><div class="diary-block-content">${(b.content||'').slice(0,100)}${b.content&&b.content.length>100?'...':''}</div></div>`;
        });
        if (blocks.length > 2) preview += `<div style="color:var(--text-secondary)">还有${blocks.length-2}个区块...</div>`;
        const checked = selectedIds.has(d.id) ? 'checked' : '';
        html += `
        <div class="diary-item">
            <input type="checkbox" class="diary-checkbox" data-id="${d.id}" ${checked} onchange="toggleSelectDiary(${d.id}, this.checked)">
            <div class="diary-body">
                <div class="diary-header"><span class="diary-date">📅 ${d.date||''}</span><span class="diary-source">${d.source||''}</span></div>
                ${preview}
                <div class="diary-actions">
                    <button class="btn btn-outline btn-sm" onclick="selectDiary(${d.id})">选中分析</button>
                    <button class="btn btn-outline btn-sm" onclick="viewDiary(${d.id})">查看</button>
                    <button class="btn btn-outline btn-sm" onclick="editDiary(${d.id})">✏️ 编辑</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteDiary(${d.id})">🗑️ 删除</button>
                </div>
            </div>
        </div>`;
    });
    wrap.innerHTML = html;
    updateBatchBar();
}

function toggleSelectDiary(id, checked) {

    updateBatchBar();
}
function toggleSelectAll() {
    const checkboxes = document.querySelectorAll('.diary-checkbox');

function batchDelete() {

// ========== 编辑日记 ==========
function editDiary(id) {
    const d = diaries.find(x => x && x.id === id);
    if (!isValidDiary(d)) return alert('数据损坏');
    editingDiaryId = id;
    const content = document.getElementById('editContent');
    if (d.type === 'goal') {
        let html = '';
        const blocks = safeBlocks(d);
        const blockMap = {};
        blocks.forEach(b => { if (b.title) blockMap[b.title] = b.content; });
        goals.forEach((goal, i) => {
            const val = blockMap[goal] || '';
            const noRecord = val === '今日无相关记录';
            html += `
            <div class="goal-input-group">
                <div class="goal-input-header"><span>🎯 ${goal}</span><label class="goal-no-record"><input type="checkbox" onchange="toggleEditGoalRecord(${i})" ${noRecord?'checked':''}> 无记录</label></div>
                <textarea class="input textarea" id="editGoalInput${i}" ${noRecord?'disabled style="opacity:0.5"':''}>${noRecord ? '' : val}</textarea>
            </div>`;
        });
        const extra = blockMap['额外补充'] || '';
        html += `<div class="goal-input-group"><span>📝 额外补充</span><textarea class="input textarea" id="editExtra">${extra}</textarea></div>`;
        content.innerHTML = html;
    } else {
        content.innerHTML = `<textarea class="input textarea" id="editFreeInput" style="min-height:200px">${d.rawText||''}</textarea>`;
    }
    openModal('editModal');
}
function toggleEditGoalRecord(i) {
    const cb = event.target;
    const ta = document.getElementById('editGoalInput'+i);
    ta.disabled = cb.checked;
    ta.style.opacity = cb.checked ? '0.5' : '1';
    if (cb.checked) ta.value = '';
}
document.getElementById('saveEditBtn').onclick = () => {
    if (!editingDiaryId) return;
    const d = diaries.find(x => x && x.id === editingDiaryId);
    if (!d) return;
    if (d.type === 'goal') {
        const newBlocks = [];
        goals.forEach((goal, i) => {
            const group = document.getElementById('editGoalInput'+i)?.closest('.goal-input-group');
            const cb = group?.querySelector('input[type="checkbox"]');
            const ta = document.getElementById('editGoalInput'+i);
            if (cb && ta) {
                if (!cb.checked && ta.value.trim()) newBlocks.push({ title: goal, content: ta.value.trim() });
                else if (cb.checked) newBlocks.push({ title: goal, content: '今日无相关记录' });
            }
        });
        const extra = document.getElementById('editExtra')?.value.trim();
        if (extra) newBlocks.push({ title: '额外补充', content: extra });

async function quickAnalyze(range) {
    if (!config.apiKey) { openModal('configModal'); return alert('请先配置AI密钥'); }
    const viewNames = '默认洞察、价值澄清、逆向思考、二阶思考、CBT疗法、MBTI分析';
    let target = [];
    const now = new Date();
    switch(range) {
        case 'today': target = diaries.filter(d => d && d.date === now.toLocaleDateString()); break;
        case 'week': target = diaries.filter(d => d && new Date(d.date) >= new Date(now.getTime()-7*86400000)); break;
        case 'month': target = diaries.filter(d => d && new Date(d.date) >= new Date(now.getTime()-30*86400000)); break;
        case 'all': target = [...diaries]; break;
    }
    target = target.filter(isValidDiary);
    if (!target.length) return alert('所选范围无有效日记');
    const diaryTxt = target.map(d => `【${d.date}】\n${safeBlocks(d).map(b=>`【${b.title||''}】\n${b.content||''}`).join('\n\n')}`).join('\n\n---\n\n');
    const el = document.getElementById(range+'Result');
    el.innerHTML = '<div class="loading">AI分析请求中...</div>';
    try {
        const prompt = config.analysisPrompt.replace('我的所有自定义长期目标', goals.join('、')).replace('{日记内容}', diaryTxt);
        const aiRes = await callAI(prompt);
        const item = { id: Date.now(), view: viewNames, timeRange: range, diaryCount: target.length, result: aiRes, createdAt: new Date().toLocaleString() };
        analysisHistory.unshift(item);
        localStorage.setItem('analysisHistory', JSON.stringify(analysisHistory));
        renderDashboard();
        alert(`${getRangeName(range)}分析完成！`);
    } catch(e) {
        el.innerHTML = `<div style="color:var(--danger);padding:20px">失败：${e.message}</div>`;
    }
}

// ========== 自定义分析 ==========
async function startAnalysis() {
    if (!config.apiKey) { openModal('configModal'); return alert('请先配置AI密钥'); }
    const range = document.getElementById('timeRange').value;
    const checked = Array.from(document.querySelectorAll('input[name="view"]:checked')).map(cb => cb.value);
    if (!checked.length) return alert('至少勾选一个视角');
    const viewMap = { default:'默认洞察', value:'价值澄清', reverse:'逆向思考', second:'二阶思考', cbt:'CBT疗法', mbti:'MBTI分析', custom: document.getElementById('customView').value.trim() };
    if (checked.includes('custom') && !viewMap.custom) return alert('请填写自定义视角');
    const viewNames = checked.map(k => viewMap[k]).join('、');
    let target = [];
    const now = new Date();
    switch(range) {
        case 'single': if(!selectedDiaryId) return alert('请先选中一篇日记'); target = diaries.filter(d => d && d.id === selectedDiaryId); break;
        case 'today': target = diaries.filter(d => d && d.date === now.toLocaleDateString()); break;
        case 'week': target = diaries.filter(d => d && new Date(d.date) >= new Date(now.getTime()-7*86400000)); break;
        case 'month': target = diaries.filter(d => d && new Date(d.date) >= new Date(now.getTime()-30*86400000)); break;
        case 'all': target = [...diaries]; break;
    }
    target = target.filter(isValidDiary);
    if (!target.length) return alert('所选范围无有效日记');
    const diaryTxt = target.map(d => `【${d.date}】\n${safeBlocks(d).map(b=>`【${b.title||''}】\n${b.content||''}`).join('\n\n')}`).join('\n\n---\n\n');
    const resWrap = document.getElementById('analysisResult');
    resWrap.style.display='block';
    resWrap.innerHTML='<div class="loading">AI分析请求中...</div>';
    try {
        const prompt = config.analysisPrompt.replace('我的所有自定义长期目标', goals.join('、')).replace('{日记内容}', diaryTxt);
        const aiRes = await callAI(prompt);
        const item = { id: Date.now(), view: viewNames, timeRange: range, diaryCount: target.length, result: aiRes, createdAt: new Date().toLocaleString() };
        analysisHistory.unshift(item);
        localStorage.setItem('analysisHistory', JSON.stringify(analysisHistory));
        if (range !== 'single') renderDashboard();
        resWrap.innerHTML = `<div class="analysis-result"><h4>📊 ${viewNames} 分析结果</h4><div class="analysis-meta">范围:${getRangeName(range)}｜${target.length}篇｜${item.createdAt}</div><div id="analysisBody">${marked.parse(aiRes)}</div><div style="margin-top:20px;display:flex;gap:12px"><button class="btn btn-outline" onclick="copyResult()">复制</button><button class="btn btn-outline" onclick="exportResult()">导出md</button></div></div>`;
    } catch(e) {
        resWrap.innerHTML = `<div style="color:var(--danger);padding:20px">失败：${e.message}</div>`;
    }
}

function getRangeName(s) { return { single:'单篇', today:'今日', week:'近7天', month:'近30天', all:'全部' }[s]||s; }
async function callAI(prompt) {
    const model = config.modelName === 'custom' ? document.getElementById('customModel').value : config.modelName;
    const res = await fetch(`${config.apiBase}/chat/completions`, {
        method:'POST', headers:{'Content-Type':'application/json', 'Authorization':`Bearer ${config.apiKey}`},
        body: JSON.stringify({ model, messages:[{role:'user',content:prompt}], temperature:Number(config.temperature), max_tokens:Number(config.maxTokens) })
    });
    if (!res.ok) { const err = await res.json(); throw new Error(err.error?.message||'请求失败'); }
    const json = await res.json();
    return json.choices[0].message.content;
}
function copyResult() { const body=document.getElementById('analysisBody'); if(body) navigator.clipboard.writeText(body.innerText).then(()=>alert('已复制')); }
function exportResult() { const body=document.getElementById('analysisBody'); if(!body) return; const blob=new Blob([body.innerText],{type:'text/markdown'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`日记分析_${new Date().toLocaleDateString()}.md`; a.click(); }

}
function saveConfig() {
    const model = document.getElementById('modelName').value === 'custom' ? document.getElementById('customModel').value : document.getElementById('modelName').value;
    config.apiKey = document.getElementById('apiKey').value.trim();
    config.apiBase = document.getElementById('apiBase').value.trim();
    config.modelName = model;
    config.temperature = document.getElementById('temperature').value;
    config.maxTokens = document.getElementById('maxTokens').value;
    config.analysisPrompt = document.getElementById('analysisPrompt').value;
    config.partitionPrompt = document.getElementById('partitionPrompt').value;
    localStorage.setItem('aiConfig', JSON.stringify(config));
    alert('AI配置已保存');
    closeModal('configModal');
}
function resetPrompts() {
    if (!confirm('恢复默认提示词？')) return;
    document.getElementById('analysisPrompt').value = getFullDefaultAnalysisPrompt();
    document.getElementById('partitionPrompt').value = getFullDefaultPartitionPrompt();
}
document.getElementById('modelName').addEventListener('change', function() {
    document.getElementById('customModel').style.display = this.value === 'custom' ? 'block' : 'none';
});

// 数据导出/导入/恢复 现在在设置弹窗内
document.getElementById('exportBtn').addEventListener('click', () => {
    const all = { diaries, analysisHistory, goals, exportTime: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `日记全量备份_${new Date().toLocaleDateString()}.json`;
    a.click();
});
document.getElementById('importBtn').addEventListener('click', () => {
    if (!confirm('导入将合并新增内容，不覆盖现有数据。继续？')) return;
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.json';
    input.onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const backup = JSON.parse(ev.target.result);
                let added = 0;
                if (backup.diaries) {
                    const ids = new Set(diaries.map(d => d.id));
                    backup.diaries.forEach(d => { if (!ids.has(d.id)) { diaries.unshift(d); added++; } });
                }
                if (backup.analysisHistory) {
                    const ids = new Set(analysisHistory.map(h => h.id));
                    backup.analysisHistory.forEach(h => { if (!ids.has(h.id)) { analysisHistory.unshift(h); added++; } });
                }
                if (backup.goals && !goals.length) goals = backup.goals;
                saveDiaries();
                localStorage.setItem('analysisHistory', JSON.stringify(analysisHistory));
                localStorage.setItem('goals', JSON.stringify(goals));
                renderDiaryList(); renderDashboard(); renderGoalInputs();
                alert(`导入完成，新增 ${added} 条`);
                location.reload();
            } catch { alert('文件格式错误'); }
        };
        reader.readAsText(e.target.files[0]);
    };
    input.click();
});
document.getElementById('restoreBtn').addEventListener('click', () => {
    if (!confirm('恢复到上次自动备份？当前数据将被覆盖。')) return;
    const backup = localStorage.getItem('diaries_backup');
    if (!backup) return alert('没有备份数据');
    diaries = JSON.parse(backup);
    saveDiaries();
    alert('恢复成功');
    location.reload();
});

// ========== 搜索事件 ==========
document.getElementById('searchInput').addEventListener('input', renderDiaryList);
document.getElementById('diaryTypeFilter').addEventListener('change', renderDiaryList);

// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded', () => {
    setDefaultDate();
    initTheme();
    initTabs();
    renderGoalInputs();
    renderDiaryList();
    renderDashboard();
});
</script>
